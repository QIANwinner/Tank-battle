<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='12' y='42' width='76' height='46' rx='10' fill='%23002FA7'/><rect x='30' y='52' width='40' height='26' rx='6' fill='%230a1040'/><rect x='44' y='10' width='12' height='36' fill='%2300f0ff'/></svg>">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #05050a;
    --text: #e8eef4;
    --muted: #5a6a8a;
    --klein: #002FA7;
    --klein-bright: #3355cc;
    --cyan: #00f0ff;
    --magenta: #ff00ff;
    --green: #39ff14;
    --red: #ff2d55;
    --hud-h: 54px;
    --pad-h: 0px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    position: fixed; inset: 0;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    overscroll-behavior: none;
    touch-action: none;
  }
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image:
      linear-gradient(rgba(0, 47, 167, 0.10) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 47, 167, 0.10) 1px, transparent 1px);
    background-size: 36px 36px;
    opacity: .8;
  }

  /* ---------- 舞台 ---------- */
  #stage {
    position: fixed; left: 0; right: 0;
    top: var(--hud-h); bottom: var(--pad-h);
    display: flex; align-items: center; justify-content: center;
    padding: 0; z-index: 1;
  }
  #frame { position: relative; display: flex; line-height: 0; }
  canvas {
    display: block;
    border-radius: 10px;
    border: 1px solid rgba(0, 47, 167, 0.85);
    background: #030308;
    box-shadow:
      0 0 0 1px rgba(0, 240, 255, 0.08),
      0 0 26px rgba(0, 47, 167, 0.42),
      0 0 70px rgba(0, 47, 167, 0.18);
    touch-action: none;
  }

  /* 画布右下角常驻署名：跟着画布走，桌面手机都在视野内 */
  #wm {
    position: absolute; right: 7px; bottom: 6px; z-index: 2;
    display: flex; align-items: center; gap: 4px;
    padding: 2px 6px 2px 5px; border-radius: 4px;
    background: rgba(0, 47, 167, 0.5);
    border: 1px solid rgba(0, 240, 255, 0.3);
    box-shadow: 0 0 10px rgba(0, 47, 167, 0.5);
    font-size: 9px; font-weight: 800; letter-spacing: 2px; line-height: 1.4;
    color: #c9e9ff; pointer-events: none;
    text-shadow: 0 0 6px rgba(0, 240, 255, 0.6);
  }
  #wm i {
    font-style: normal; font-size: 8px; letter-spacing: 0;
    color: var(--cyan); opacity: .9;
  }

  /* ---------- 顶部 HUD ---------- */
  /* 品牌徽章：一直挂在 HUD 最左，玩的时候也看得见 */
  #brandTag {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 4px;
    margin-right: 1px;
  }
  #brandTag .q {
    width: 19px; height: 19px; border-radius: 5px;
    display: grid; place-items: center;
    font-size: 11px; font-weight: 900; font-style: normal; line-height: 1;
    color: #02101f;
    background: linear-gradient(160deg, #8bf6ff, var(--cyan) 55%, #008fbf);
    box-shadow: 0 0 10px rgba(0, 240, 255, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.4) inset;
  }
  #brandTag .n {
    font-size: 10px; font-weight: 800; letter-spacing: 2px; line-height: 1;
    color: #d6ecff;
    text-shadow: 0 0 8px rgba(0, 240, 255, 0.6);
  }
  #hud {
    position: fixed; top: 0; left: 0; right: 0; z-index: 20;
    height: var(--hud-h);
    display: flex; align-items: center; gap: 5px;
    padding: 0 8px;
    padding-top: env(safe-area-inset-top);
    background: linear-gradient(180deg, rgba(5, 5, 10, 0.95) 40%, rgba(5, 5, 10, 0));
    pointer-events: none;
  }
  .pill {
    display: flex; align-items: baseline; gap: 4px;
    padding: 3px 8px; border-radius: 999px;
    background: rgba(0, 47, 167, 0.18);
    border: 1px solid rgba(77, 159, 255, 0.22);
    white-space: nowrap; line-height: 1;
  }
  .pill .k { font-size: 9px; letter-spacing: 1px; color: var(--muted); }
  .pill .v {
    font-size: 14px; font-weight: 800; color: #fff;
    font-variant-numeric: tabular-nums;
  }
  .pill.best .v { color: var(--cyan); }
  .pill.combo { border-color: rgba(255, 0, 255, 0.5); background: rgba(255, 0, 255, 0.12); }
  .pill.combo .v { color: var(--cyan); }
  .pill.combo.hot .v { color: var(--magenta); text-shadow: 0 0 8px rgba(255, 0, 255, 0.9); }
  #lives {
    display: flex; gap: 1px; font-size: 12px; line-height: 1;
    color: var(--green); margin-left: 2px;
  }
  #lives .off { opacity: .2; }
  .hbtns { margin-left: auto; display: flex; gap: 6px; pointer-events: auto; }
  .hbtn {
    width: 34px; height: 34px; padding: 0;
    display: grid; place-items: center;
    border-radius: 10px; font-size: 15px; line-height: 1;
    background: rgba(0, 47, 167, 0.28);
    border: 1px solid rgba(77, 159, 255, 0.35);
    color: var(--cyan);
    cursor: pointer;
    -webkit-appearance: none; appearance: none;
  }
  .hbtn:active { background: var(--klein); }

  /* ---------- 触屏按键 ---------- */
  #pad {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    height: var(--pad-h);
    display: none;
    align-items: center; justify-content: space-between;
    padding: 0 16px calc(10px + env(safe-area-inset-bottom));
    pointer-events: none;
  }
  html.touch { --pad-h: 178px; }
  html.touch #pad { display: flex; }

  /* 虚拟摇杆：外面一层更大的透明触摸区，手指落在圆边外也能拉 */
  #stickZone {
    pointer-events: auto;
    width: 158px; height: 158px;
    display: grid; place-items: center;
    touch-action: none;
  }
  #stick {
    pointer-events: none;
    position: relative;
    width: 126px; height: 126px;
    border-radius: 50%;
    display: grid; place-items: center;
    background: radial-gradient(circle at 50% 40%,
      rgba(0, 47, 167, 0.46), rgba(0, 47, 167, 0.15) 68%, rgba(0, 240, 255, 0.06));
    border: 1px solid rgba(77, 159, 255, 0.42);
    box-shadow: inset 0 0 26px rgba(0, 240, 255, 0.12), 0 0 20px rgba(0, 47, 167, 0.45);
    touch-action: none;
    -webkit-appearance: none; appearance: none;
  }
  #stick::before {
    content: ''; position: absolute; inset: 17%;
    border-radius: 50%; border: 1px dashed rgba(77, 159, 255, 0.20);
  }
  #stick::after {
    content: ''; position: absolute; inset: 0; border-radius: 50%;
    pointer-events: none;
    background:
      linear-gradient(to right, transparent calc(50% - 0.5px),
        rgba(0, 240, 255, 0.10) calc(50% - 0.5px),
        rgba(0, 240, 255, 0.10) calc(50% + 0.5px), transparent calc(50% + 0.5px)),
      linear-gradient(to bottom, transparent calc(50% - 0.5px),
        rgba(0, 240, 255, 0.10) calc(50% - 0.5px),
        rgba(0, 240, 255, 0.10) calc(50% + 0.5px), transparent calc(50% + 0.5px));
  }
  #stick.active { border-color: rgba(0, 240, 255, 0.7); box-shadow: inset 0 0 30px rgba(0, 240, 255, 0.2), 0 0 26px rgba(0, 240, 255, 0.35); }
  #knob {
    width: 58px; height: 58px; border-radius: 50%;
    pointer-events: none;
    background: radial-gradient(circle at 50% 32%, #7fb4ff, #002fa7 74%);
    border: 1px solid rgba(150, 220, 255, 0.7);
    box-shadow: 0 0 16px rgba(0, 240, 255, 0.35), inset 0 -4px 10px rgba(0, 0, 0, 0.35);
    transition: transform 0.10s ease-out, box-shadow 0.12s ease;
    will-change: transform;
  }
  #knob.on { box-shadow: 0 0 28px rgba(0, 240, 255, 0.85), inset 0 -4px 10px rgba(0, 0, 0, 0.3); }
  #tFire {
    pointer-events: auto;
    width: 86px; height: 86px; border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, 0.55);
    background: radial-gradient(circle at 50% 32%, #ff4dd2, #b80090);
    color: #fff; font-size: 15px; font-weight: 800; letter-spacing: 2px;
    box-shadow: 0 0 24px rgba(255, 0, 255, 0.45);
    touch-action: none;
    -webkit-appearance: none; appearance: none;
  }
  #tFire.on { transform: scale(0.94); box-shadow: 0 0 32px rgba(255, 0, 255, 0.8); }

  /* 横屏：按键浮在画布两侧空白处，不再占用高度 */
  html.touch.wide { --pad-h: 0px; }
  html.touch.wide #pad {
    height: auto; background: none;
    align-items: flex-end;
    padding-bottom: calc(12px + env(safe-area-inset-bottom));
  }
  html.touch.wide #stickZone { width: 136px; height: 136px; }
  html.touch.wide #stick { width: 104px; height: 104px; opacity: 0.85; }
  html.touch.wide #knob { width: 50px; height: 50px; }
  html.touch.wide #tFire { width: 74px; height: 74px; opacity: 0.85; }

  /* ---------- 开始 / 暂停 / 结算 遮罩 ---------- */
  #overlay {
    position: fixed; inset: 0; z-index: 30;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 10px; padding: 26px;
    text-align: center;
    background: radial-gradient(circle at 50% 42%, rgba(0, 47, 167, 0.28), rgba(4, 4, 10, 0.9) 62%);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    transition: opacity .22s ease, visibility .22s;
  }
  #overlay.hide { opacity: 0; visibility: hidden; pointer-events: none; }
  #overlay .brand {
    position: relative; align-self: center;
    display: flex; align-items: baseline; gap: 6px;
    font-size: 15px; font-weight: 800; letter-spacing: 8px;
    color: var(--cyan);
    text-shadow: 0 0 14px rgba(0, 240, 255, 0.8), 0 0 34px rgba(0, 47, 167, 0.9);
  }
  #overlay .brand .b2 {
    font-size: 10px; font-weight: 700; letter-spacing: 3px;
    color: #9dc4e8; opacity: .85; text-shadow: none;
  }
  #overlay .brand::before, #overlay .brand::after {
    content: ''; position: absolute; top: 50%; width: 24px; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(0, 240, 255, 0.8));
  }
  #overlay .brand::before { right: calc(100% + 10px); }
  #overlay .brand::after { left: calc(100% + 10px); transform: scaleX(-1); }
  #ovTitle {
    font-size: 34px; font-weight: 800; letter-spacing: 6px; color: #fff;
    text-shadow: 0 0 10px rgba(0, 240, 255, 0.75), 0 0 36px rgba(0, 47, 167, 0.85);
    margin: 0;
  }
  #ovSub {
    font-size: 12px; line-height: 1.7; letter-spacing: 1px;
    color: #93a4c4; max-width: 300px; margin: 0;
  }
  #ovStats {
    font-size: 12px; letter-spacing: 1px; color: #93a4c4;
    font-variant-numeric: tabular-nums; min-height: 16px;
  }
  #ovStats b { color: var(--cyan); font-size: 15px; }
  #btnPlay {
    margin-top: 4px;
    min-width: 176px; padding: 14px 30px;
    border: 1px solid rgba(0, 240, 255, 0.55); border-radius: 999px;
    background: linear-gradient(180deg, #0a3fd0, var(--klein));
    color: #fff; font-size: 16px; font-weight: 800; letter-spacing: 3px;
    box-shadow: 0 0 22px rgba(0, 47, 167, 0.7), 0 0 0 1px rgba(0, 240, 255, 0.18) inset;
    cursor: pointer;
    -webkit-appearance: none; appearance: none;
  }
  #btnPlay:active { transform: translateY(1px); filter: brightness(1.1); }
  #btnDaily, #btnShare, #btnReport, #btnShop {
    margin-top: -2px;
    padding: 9px 22px;
    border: 1px solid rgba(0, 240, 255, 0.4); border-radius: 999px;
    background: rgba(0, 47, 167, 0.22);
    color: #bfe4ff; font-size: 13px; font-weight: 700; letter-spacing: 2px;
    cursor: pointer;
    -webkit-appearance: none; appearance: none;
  }
  #btnDaily:active, #btnShare:active, #btnReport:active, #btnShop:active { background: var(--klein); transform: translateY(1px); }
  #btnDaily { display: none; }
  #btnShare { display: none; border-color: rgba(255, 0, 255, 0.5); color: #ffc4ff; box-shadow: 0 0 14px rgba(255, 0, 255, 0.18); }
  #btnReport { display: none; border-color: rgba(57, 255, 20, 0.5); color: #c9ffd2; box-shadow: 0 0 14px rgba(57, 255, 20, 0.18); }
  #btnShop { border-color: rgba(255, 215, 0, 0.55); color: #ffe9a6; box-shadow: 0 0 14px rgba(255, 215, 0, 0.2); }
  #ovStats .sub {
    margin-top: 6px; font-size: 11px; letter-spacing: 1px; color: #7f92b5;
    font-variant-numeric: tabular-nums;
  }
  #ovStats .achrow { margin-top: 6px; font-size: 11px; letter-spacing: 1px; color: #7f92b5; }
  #ovStats .achrow b { color: var(--cyan); font-size: 13px; }
  #ovStats .chip {
    display: inline-block; margin: 3px 3px 0 0; padding: 3px 9px;
    border-radius: 999px; border: 1px solid rgba(255, 230, 0, 0.55);
    background: rgba(255, 230, 0, 0.12); color: #ffe600;
    font-size: 10px; letter-spacing: 1px;
    animation: chipPop .45s ease;
  }
  @keyframes chipPop {
    0% { transform: scale(0.6); opacity: 0; }
    70% { transform: scale(1.08); opacity: 1; }
    100% { transform: scale(1); }
  }

  /* ---------- 关卡过渡 ---------- */
  #lvIntro {
    position: fixed; inset: 0; z-index: 30;
    display: none; align-items: center; justify-content: center;
    background: rgba(3, 3, 10, 0.72);
    pointer-events: none;
  }
  #lvIntro.show { display: flex; }
  #lvIntro .lvT {
    font-size: 42px; font-weight: 800; letter-spacing: 10px; color: #fff;
    text-shadow: 0 0 16px rgba(0, 240, 255, 0.9), 0 0 48px rgba(0, 47, 167, 0.9);
    animation: lvIn 1.45s ease both;
  }
  #lvIntro .lvT::before, #lvIntro .lvT::after {
    content: ''; display: block; width: 132px; height: 2px; margin: 16px auto;
    background: linear-gradient(90deg, transparent, #00f0ff, transparent);
  }
  @keyframes lvIn {
    0% { opacity: 0; transform: scale(1.35); letter-spacing: 24px; }
    22% { opacity: 1; transform: scale(1); letter-spacing: 10px; }
    78% { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(0.93); letter-spacing: 14px; }
  }

  /* ---------- 过关强化三选一 ---------- */
  #upgradeBox {
    position: fixed; inset: 0; z-index: 40;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; padding: 20px;
    background: radial-gradient(circle at 50% 40%, rgba(0, 47, 167, 0.34), rgba(3, 3, 10, 0.94) 65%);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  }
  #upgradeBox.show { display: flex; }
  #upgradeBox .upTitle {
    font-size: 22px; font-weight: 800; letter-spacing: 4px; color: #fff;
    text-shadow: 0 0 12px rgba(0, 240, 255, 0.75), 0 0 34px rgba(0, 47, 167, 0.9);
  }
  #upgradeBox .upSub { font-size: 12px; letter-spacing: 1px; color: #93a4c4; margin-bottom: 4px; }
  #upgradeBox .upCards {
    display: flex; gap: 12px; width: 100%; max-width: 560px;
    justify-content: center; flex-wrap: wrap;
  }
  #upgradeBox .upCard {
    flex: 1 1 150px; max-width: 172px; min-height: 176px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    padding: 16px 12px;
    border: 1px solid rgba(0, 240, 255, 0.4); border-radius: 16px;
    background: linear-gradient(180deg, rgba(0, 47, 167, 0.28), rgba(4, 6, 20, 0.85));
    color: #fff; cursor: pointer;
    -webkit-appearance: none; appearance: none;
    transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease;
  }
  #upgradeBox .upCard:active { transform: translateY(2px) scale(0.98); }
  #upgradeBox .upCard:hover, #upgradeBox .upCard:focus-visible {
    border-color: #00f0ff;
    box-shadow: 0 0 22px rgba(0, 240, 255, 0.35), 0 0 0 1px rgba(0, 240, 255, 0.3) inset;
  }
  #upgradeBox .upCard .uIcon { font-size: 34px; line-height: 1; filter: drop-shadow(0 0 10px rgba(0, 240, 255, 0.6)); }
  #upgradeBox .upCard .uName { font-size: 15px; font-weight: 800; letter-spacing: 1px; color: #00f0ff; }
  #upgradeBox .upCard .uDesc { font-size: 11px; line-height: 1.5; color: #aebbd8; min-height: 32px; }
  #upgradeBox .upCard .uOwn { font-size: 10px; letter-spacing: 1px; color: #ffe600; }
  #upgradeBox .upCard.locked { opacity: .55; }
  #upgradeBox .upSkip {
    margin-top: 6px; font-size: 12px; letter-spacing: 1px; color: #7f92b5;
    padding: 8px 18px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, 0.18);
    cursor: pointer;
  }
  #upgradeBox .upSkip:active { background: rgba(255, 255, 255, 0.08); }

  /* ---------- 金币 HUD pill ---------- */
  .pill.coin { border-color: rgba(255, 215, 0, 0.5); }
  .pill.coin .k { color: #ffd700; }
  .pill.coin .v { color: #ffe066; text-shadow: 0 0 8px rgba(255, 215, 0, 0.6); }

  /* ---------- 商店弹层 ---------- */
  #shopBox {
    position: fixed; inset: 0; z-index: 46;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 18px;
    background: radial-gradient(circle at 50% 38%, rgba(0, 47, 167, 0.34), rgba(3, 3, 10, 0.95) 66%);
    -webkit-backdrop-filter: blur(9px); backdrop-filter: blur(9px);
  }
  #shopBox.show { display: flex; }
  .shopHead { display: flex; align-items: center; gap: 12px; width: 100%; max-width: 640px; }
  .shopTitle {
    flex: 1; font-size: 20px; font-weight: 800; letter-spacing: 3px; color: #fff;
    text-shadow: 0 0 12px rgba(0, 240, 255, 0.7), 0 0 30px rgba(0, 47, 167, 0.9);
  }
  .shopWallet {
    font-size: 15px; letter-spacing: 1px; color: #ffe066; font-variant-numeric: tabular-nums;
    padding: 6px 14px; border-radius: 999px; border: 1px solid rgba(255, 215, 0, 0.45);
    background: rgba(255, 215, 0, 0.08);
  }
  .shopWallet b { font-size: 17px; }
  .shopClose {
    width: 34px; height: 34px; border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.25); background: rgba(255, 255, 255, 0.06);
    color: #cfe3ff; font-size: 16px; cursor: pointer; flex: none;
  }
  .shopClose:active { background: rgba(255, 255, 255, 0.14); }
  .shopTabs { display: flex; gap: 8px; width: 100%; max-width: 640px; }
  .shopTab {
    flex: 1; padding: 9px 0; border-radius: 999px;
    border: 1px solid rgba(0, 240, 255, 0.35); background: rgba(0, 47, 167, 0.18);
    color: #9dc4e8; font-size: 13px; font-weight: 700; letter-spacing: 2px; cursor: pointer;
  }
  .shopTab.active {
    background: linear-gradient(180deg, #0a3fd0, var(--klein));
    color: #fff; border-color: rgba(0, 240, 255, 0.7);
    box-shadow: 0 0 16px rgba(0, 47, 167, 0.6);
  }
  .shopBody {
    width: 100%; max-width: 640px; max-height: 58vh; overflow-y: auto;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 10px; padding: 2px;
  }
  .shopItem {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 14px 12px; border-radius: 12px;
    border: 1px solid rgba(0, 240, 255, 0.22); background: rgba(10, 20, 50, 0.5);
  }
  .shopItem .siIcon { font-size: 30px; line-height: 1; filter: drop-shadow(0 0 8px rgba(0, 240, 255, 0.5)); }
  .shopItem .siName { font-size: 14px; font-weight: 800; letter-spacing: 1px; color: #00f0ff; }
  .shopItem .siDesc { font-size: 11px; line-height: 1.5; color: #aebbd8; text-align: center; min-height: 32px; }
  .shopItem .siMeta { font-size: 10px; letter-spacing: 1px; color: #ffe066; }
  .shopItem .siBtn {
    margin-top: 4px; width: 100%; padding: 8px 0; border-radius: 999px;
    border: 1px solid rgba(0, 240, 255, 0.5); background: rgba(0, 47, 167, 0.3);

    if (muted) return;

      ensureAudio();

      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t); o.stop(t + dur);
    } catch (e) { /* 忽略音频错误 */ }
  }

  // 白噪声源（1 秒循环用）

    if (!noiseBuf) {
      const len = Math.floor(audioCtx.sampleRate * 1);
      noiseBuf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    }
    return noiseBuf;
  }

  // 白噪声爆破：低通扫频衰减

    if (muted) return;
    try {
      ensureAudio();
      const t = audioCtx.currentTime;
      const src = audioCtx.createBufferSource();
      src.buffer = getNoise();
      const f = audioCtx.createBiquadFilter();
      f.type = 'lowpass';
      f.frequency.setValueAtTime(fFrom, t);
      f.frequency.exponentialRampToValueAtTime(Math.max(40, fTo), t + dur);
      const g = audioCtx.createGain();
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(f); f.connect(g); g.connect(audioCtx.destination);
      src.start(t); src.stop(t + dur + 0.02);
    } catch (e) { /* 忽略 */ }
  }

      o.connect(g); g.connect(audioCtx.destination);
      o.start(t); o.stop(t + dur + 0.02);
    } catch (e) { /* 忽略 */ }
  }

  function bgmNote(freq, time, dur, type, vol) {
    const o = audioCtx.createOscillator();

    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, time);

  function bgmTick() {
    if (!audioCtx || bgmMode === 'off' || muted) return;

    const stepDur = 60 / pat.bpm / 4;
    if (bgmNextTime < audioCtx.currentTime) bgmNextTime = audioCtx.currentTime + 0.06;
    while (bgmNextTime < audioCtx.currentTime + 0.18) {
      const i = bgmStep % 16;
      const b = BGM_NOTES[pat.bass[i]], l = BGM_NOTES[pat.lead[i]];
      if (b) bgmNote(b, bgmNextTime, stepDur * 1.55, 'triangle', 0.042);
      if (l) bgmNote(l, bgmNextTime, stepDur * 1.1, 'square', 0.025);
      bgmNextTime += stepDur;
      bgmStep++;

    for (let y = 3; y <= 20; y++)
      for (let x = 2; x <= 23; x++)
        if (map[y][x] === 0 && Math.abs(x - SPAWN.x) + Math.abs(y - SPAWN.y) > 4) empties.push([x, y]);
    let n = 3;
    while (n-- > 0 && empties.length) {
      const i = Math.floor(rng() * empties.length);
      const [x, y] = empties.splice(i, 1)[0];
      map[y][x] = TILE_BARREL;
    }
  }

  // 放置一对传送门（距离较远的两处空地）
  function placePortals() {
    portals = [];
    if (bossLevel) return;
    const empties = [];
    for (let y = 3; y <= 20; y++)
      for (let x = 2; x <= 23; x++)
        if (map[y][x] === 0) empties.push([x, y]);
    if (empties.length < 2) return;
    const pick = () => empties[Math.floor(rng() * empties.length)];
    let a = pick(), b = pick(), tries = 0;
    while (Math.abs(a[0] - b[0]) + Math.abs(a[1] - b[1]) < 12 && tries++ < 60) b = pick();
    if (Math.abs(a[0] - b[0]) + Math.abs(a[1] - b[1]) < 6) return;  // 太近放弃
    map[a[1]][a[0]] = TILE_PORTAL;
    map[b[1]][b[0]] = TILE_PORTAL;
    portals = [a, b];
  }

  function inside(x, y) { return x >= 0 && y >= 0 && x < COLS && y < ROWS; }

  // 判断某像素区域是否可通行
  function isBlocked(px, py, size, isBullet = false) {
    const x0 = Math.floor(px / TILE), x1 = Math.floor((px + size - 0.01) / TILE);
    const y0 = Math.floor(py / TILE), y1 = Math.floor((py + size - 0.01) / TILE);
    for (let y = y0; y <= y1; y++)
      for (let x = x0; x <= x1; x++) {
        if (!inside(x, y)) return true;
        const t = map[y][x];
        if (isBullet) {
          if (t === TILE_STEEL || t === TILE_BRICK || t === TILE_BARREL) return true;
          if (t === TILE_WATER) return false; // 子弹可越过水
        } else {
          if (t === TILE_BRICK || t === TILE_STEEL || t === TILE_WATER || t === TILE_BARREL) return true;
          if (x === BASE.x && y === BASE.y) return true;  // 基地格坦克不可驶入
        }
      }
    return false;
  }

  // 子弹击中砖块：摧毁命中的那一格；命中油桶则引爆
  function damageTile(px, py) {
    const x = Math.floor(px / TILE), y = Math.floor(py / TILE);
    if (!inside(x, y)) return false;
    if (map[y][x] === TILE_BARREL) { explodeBarrel(x, y); return true; }
    if (map[y][x] === TILE_BRICK) {
      map[y][x] = 0;
      spawnParticles(x * TILE + TILE / 2, y * TILE + TILE / 2, '#ff00ff', 6);
      return true;
    }
    return false;
  }

  // 油桶爆炸：范围伤害敌人 + 连锁引爆相邻油桶
  function explodeBarrel(x, y, visited) {
    visited = visited || {};
    const key = x + ',' + y;
    if (visited[key]) return;
    visited[key] = true;
    if (!inside(x, y) || map[y][x] !== TILE_BARREL) return;
    map[y][x] = 0;
    const cxp = x * TILE + TILE / 2, cyp = y * TILE + TILE / 2;
    spawnParticles(cxp, cyp, '#ffb300', 22);
    spawnParticles(cxp, cyp, '#ff2d55', 12);
    spawnParticles(cxp, cyp, '#fff', 6);
    addText(cxp, cyp - 12, '💥', '#ffb300');
    shake = Math.max(shake, 10);
    sfxBoom();
    vibe([120, 60, 120]);
    const R = 2 * TILE;   // 爆炸半径 2 格
    for (const e of enemies) {
      if (e.dead || (e.isBoss && e.enterT > 0)) continue;
      const ecx = e.x + e.size / 2, ecy = e.y + e.size / 2;
      if (Math.hypot(ecx - cxp, ecy - cyp) <= R) {
        e.hp -= 3; e.hitFlash = 6;
        if (e.hp <= 0) { e.dead = true; onEnemyKilled(e); }
        else { sfxHit(); spawnParticles(ecx, ecy, e.color, 6); }
      }
    }
    // 连锁引爆周边油桶
    for (let dy = -2; dy <= 2; dy++)
      for (let dx = -2; dx <= 2; dx++) {
        const nx = x + dx, ny = y + dy;
        if (inside(nx, ny) && map[ny][nx] === TILE_BARREL) explodeBarrel(nx, ny, visited);
      }
  }

  // 传送门：坦克中心进入门格即瞬移到另一端（带冷却防连穿）
  function checkPortal(t) {
    if (!portals.length || t.portalCd > 0) return;
    const cx = t.x + t.size / 2, cy = t.y + t.size / 2;
    const gx = Math.floor(cx / TILE), gy = Math.floor(cy / TILE);
    if (!inside(gx, gy) || map[gy][gx] !== TILE_PORTAL) return;
    const idx = portals.findIndex(p => p[0] === gx && p[1] === gy);
    if (idx < 0) return;
    const other = portals[1 - idx];
    const ox = other[0] * TILE + (TILE - t.size) / 2;
    const oy = other[1] * TILE + (TILE - t.size) / 2;
    t.x = ox; t.y = oy;
    t.portalCd = 45;   // 冷却 0.75 秒
    spawnParticles(cx, cy, '#a06bff', 14);
    spawnParticles(ox + t.size / 2, oy + t.size / 2, '#a06bff', 14);
    sfxPortal();
  }

  // ===== 粒子 / 飘分 =====
  function spawnParticles(x, y, color, n = 8) {
    for (let i = 0; i < n; i++) {
      particles.push({
        x, y,
        vx: rand(-2.5, 2.5), vy: rand(-2.5, 2.5),
        life: rand(0.3, 0.6), max: 0.6, color,
        size: rand(1.5, 3.5)
      });
    }
  }

  function addText(x, y, str, color = '#00f0ff') {
    texts.push({ x, y, str, color, life: 0.9, max: 0.9 });
  }

  // ===== 坦克 =====
  function makePlayer() {
    return {
      x: SPAWN.x * TILE + (TILE - TANK_SIZE) / 2,
      y: SPAWN.y * TILE + (TILE - TANK_SIZE) / 2,
      dir: DIR.UP, speed: PLAYER_SPEED,
      cooldown: 0, isPlayer: true, color: '#002FA7',
      size: TANK_SIZE, spawnInv: 0, hitFlash: 0, portalCd: 0
    };
  }

  function levelSpeedMul() { return Math.min(1 + (level - 1) * 0.06, 1.6); }

  function pickEnemyType() {
    const r = rng();
    // 每日词条：疾风骤雨（只出快速）/ 狙击天团（大量狙击）
    if (dailyMods.onlyFast) return 'fast';
    if (dailyMods.sniperBoost && r < 0.35) return 'sniper';
    // 波次推进让后期波更凶：有效难度 = 关卡 + 波次加成
    const lvl = level + (wave - 1) * 0.6;
    if (lvl >= 8) {
      if (r < 0.08) return 'sniper';
      if (r < 0.16) return 'suicide';
      if (r < 0.24) return 'engineer';
      if (r < 0.34) return 'elite';
      if (r < 0.52) return 'armored';
      if (r < 0.70) return 'fast';
      return 'normal';
    }
    if (lvl >= 6) {
      if (r < 0.08) return 'sniper';
      if (r < 0.15) return 'suicide';
      if (r < 0.22) return 'engineer';
      if (r < 0.34) return 'armored';
      if (r < 0.55) return 'fast';
      return 'normal';
    }
    if (lvl >= 4) {
      if (r < 0.07) return 'sniper';
      if (r < 0.14) return 'suicide';
      if (r < 0.30) return 'armored';
      if (r < 0.50) return 'fast';
      return 'normal';
    }
    if (lvl >= 2) {
      if (r < 0.06) return 'suicide';
      if (r < 0.28) return 'fast';
      return 'normal';
    }
    return 'normal';
  }

  function pickEnemyColor() {
    const c = ['#ff00ff', '#00f0ff', '#39ff14', '#ff2d55', '#4d9fff'];
    return c[randInt(0, c.length - 1)];
  }

  function spawnEnemy(x, y, type) {
    const def = ENEMY_TYPES[type];
    enemies.push({
      x, y, dir: DIR.DOWN,
      speed: def.speed * levelSpeedMul() * (dailyMods.speedMul || 1),
      cooldown: 0, isPlayer: false,
      type, hp: def.hp, maxHp: def.hp, size: TANK_SIZE,
      color: def.color || pickEnemyColor(),
      changeTimer: randInt(60, 160), shootTimer: randInt(40, 140),
      hitFlash: 0, portalCd: 0
    });
  }

  function spawnBoss() {
    bossMaxHp = 12 + Math.floor(level * 1.5);      // 难度曲线更陡
    bossHp = bossMaxHp;
    enemies.push({
      x: W / 2 - BOSS_SIZE / 2,
      y: -BOSS_SIZE - 8,               // 屏幕外上方，出场缓缓降下
      dir: DIR.DOWN, speed: 0.7,
      cooldown: 0, isPlayer: false, isBoss: true,
      type: 'boss', hp: bossMaxHp, maxHp: bossMaxHp,
      size: BOSS_SIZE, color: '#ff2d55',
      changeTimer: 90, shootTimer: 70, hitFlash: 0, portalCd: 0,
      enterT: 1.5,                     // 出场下降时间（秒），期间无敌
      enterY: 6 * TILE,                // 场中落点
      phase: 0,                        // 0 正常 / 1 狂暴(50%) / 2 狂暴·二段(25%)
      skillTimer: 200,                 // 首次技能倒计时（帧）
      state: 'idle', chargeT: 0, chargeDir: 0   // idle / charge_warn / charge
    });
    bossWarn = 1.8;                 // 全屏警报
    sfxBoss();
    vibe([90, 60, 90, 60, 180]);
    showToast('⚠ BOSS 出现！');
  }

  const spawnPoints = [
    [1 * TILE, 1 * TILE],
    [(COLS - 2) * TILE, 1 * TILE],
    [(COLS / 2 | 0) * TILE, 1 * TILE]
  ];

  // ===== 子弹 =====
  function fire(tank) {
    if (tank.cooldown > 0) return;
    const isP = tank.isPlayer;
    const rapid = isP && fx.rapid > 0;
    const isSniper = !isP && tank.type === 'sniper';
    if (isP) {
      // 快速装填强化：冷却 ×0.8/层；道具双倍射速再 ×0.5；永久加成射速 -5%/级
      let cd = 14 * Math.pow(0.8, upgrades.rapid || 0) * (1 - 0.05 * (bonus.cd || 0));
      if (rapid) cd *= 0.5;
      tank.cooldown = Math.max(3, cd);
    } else {
      tank.cooldown = tank.isBoss ? 50 : (isSniper ? 55 : 40);
    }
    const cx = tank.x + tank.size / 2;
    const cy = tank.y + tank.size / 2;
    // 穿云弹头强化：玩家弹速 +20%/层；狙击弹慢速可躲
    const bulletSpeed = isSniper ? BULLET_SPEED * 0.55 : BULLET_SPEED * (isP ? (1 + 0.2 * (upgrades.bulletspd || 0)) : 1);
    // 巨弹头强化：弹头更大（更容易命中、更醒目）
    const bsize = isSniper ? 5 : (4 + (isP && (upgrades.bigbullet || 0) > 0 ? 2 : 0));
    const pen = isP ? (upgrades.pierce || 0) : 0;   // 穿透弹头：可穿透敌人次数
    const shoot = (ox, oy, dir) => {
      bullets.push({ x: ox - 2, y: oy - 2, size: bsize, dir: dir, speed: bulletSpeed, owner: tank, pen, bomb: (upgrades.bomb || 0) > 0 });
      if (isP) stat.shots++;
    };
    if (isP && fx.double > 0) {
      // 双管沿垂直于炮管方向展开（斜向同样成立）
      const px = -DY[tank.dir] * 6, py = DX[tank.dir] * 6;
      shoot(cx - px, cy - py, tank.dir); shoot(cx + px, cy + py, tank.dir);
    } else {
      shoot(cx, cy, tank.dir);
    }
    // 三向散射强化：沿两侧 ±s 方向追加斜射弹（每层 +1 对）
    if (isP && (upgrades.spread || 0) > 0) {
      for (let s = 1; s <= (upgrades.spread || 0); s++) {
        for (const d of [(tank.dir + s) % 8, (tank.dir + 8 - s) % 8]) {
          const sx = cx + DX[d] * 15, sy = cy + DY[d] * 15;
          shoot(sx, sy, d);
        }
      }
    }
    if (isP) sfxShoot();
    else beep(500, 0.05, 'square', 0.02);
  }

  function bossFire(e, phase) {
    const cx = e.x + e.size / 2, cy = e.y + e.size / 2;
    const px = -DY[e.dir], py = DX[e.dir];   // 垂直于炮管的展开方向
    // 狂暴后扇形更宽（5 连发）、子弹更大更快
    const offsets = phase >= 1 ? [-14, -7, 0, 7, 14] : [-10, 0, 10];
    const spd = phase >= 1 ? 1.0 : 0.9;
    for (const off of offsets) {
      const ox = cx + px * off, oy = cy + py * off;
      bullets.push({ x: ox - 2, y: oy - 2, size: phase >= 1 ? 6 : 5, dir: e.dir, speed: BULLET_SPEED * spd, owner: e });
    }
    beep(phase >= 1 ? 240 : 300, 0.1, 'sawtooth', 0.05);
  }

  // —— Boss 技能池（按关卡解锁：5/10/15 关分别 1/2/3 种） ——
  function bossUnlockedSkills() {
    const pool = ['ring', 'charge', 'summon'];
    return pool.slice(0, level >= 15 ? 3 : level >= 10 ? 2 : 1);
  }
  function bossSkill(e) {
    const pool = bossUnlockedSkills();
    const s = pool[randInt(0, pool.length - 1)];
    if (s === 'ring') ringShot(e);
    else if (s === 'charge') {
      if (player && !player.dead) e.chargeDir = dirFromVec(player.x - e.x, player.y - e.y);
      e.state = 'charge_warn'; e.chargeT = 40; sfxChargeWarn();
    } else summonMinions(e);
  }
  function ringShot(e) {
    const cx = e.x + e.size / 2, cy = e.y + e.size / 2;
    for (let d = 0; d < 8; d++) {
      bullets.push({ x: cx - 2, y: cy - 2, size: 4, dir: d, speed: BULLET_SPEED * 0.85, owner: e });
    }
    beep(220, 0.14, 'sawtooth', 0.05);
    showToast('🌀 环形弹幕！');
  }
  function summonMinions(e) {
    const n = level >= 15 ? 2 : 1;
    let added = 0;
    for (let i = 0; i < n; i++) {
      if (enemies.length >= 6) break;
      const pt = spawnPoints[randInt(0, 2)];
      if (enemies.some(x => !x.dead && Math.abs(x.x - pt[0]) < TILE && Math.abs(x.y - pt[1]) < TILE)) continue;
      spawnEnemy(pt[0], pt[1], pickEnemyType());
      added++;
    }
    if (added) { showToast('👾 敌军增援！'); beep(340, 0.08, 'square', 0.04); }
  }

  // 按当前八方向移动：x/y 轴独立碰撞，斜向可沿墙滑动；返回是否成功移动
  function moveTank(t, k) {
    const nx = t.x + DX[t.dir] * t.speed * k;
    const ny = t.y + DY[t.dir] * t.speed * k;
    let moved = false;
    if (DX[t.dir] !== 0 && !isBlocked(nx, t.y, t.size) && !tankHitsTank(nx, t.y, t.size, t)) { t.x = nx; moved = true; }
    if (DY[t.dir] !== 0 && !isBlocked(t.x, ny, t.size) && !tankHitsTank(t.x, ny, t.size, t)) { t.y = ny; moved = true; }
    return moved;
  }

  // ===== 敌人 AI =====
  // 目标倾向：按兵种返回 'player' / 'base' / null（null=随机游走）
  function enemyTarget(e) {
    const r = rng();
    switch (e.type) {
      case 'elite':    return r < 0.16 ? 'player' : r < 0.26 ? 'base' : null;
      case 'armored':  return r < 0.06 ? 'player' : r < 0.24 ? 'base' : null;
      case 'engineer': return r < 0.04 ? 'player' : r < 0.30 ? 'base' : null;
      case 'fast':     return r < 0.03 ? 'player' : r < 0.07 ? 'base' : null;
      default:         return r < 0.025 ? 'player' : r < 0.05 ? 'base' : null;
    }
  }
  // 撞墙转向时优先朝目标走的概率（按兵种分层）
  function chaseChance(e) {
    switch (e.type) {
      case 'elite':    return 0.90;
      case 'engineer': return 0.85;
      case 'armored':  return 0.75;
      case 'fast':     return 0.45;
      default:         return 0.35;
    }
  }

  function updateEnemy(e, k) {
    if (fx.freeze > 0) return;              // 冻结：不动不射
    if (e.freezeT > 0) { e.freezeT -= k; if (e.freezeT <= 0) e.freezeT = 0; return; }  // 冰冻子弹：单兵冻结中不动不射
    if (e.isBoss) { updateBoss(e, k); return; }
    if (e.type === 'sniper')  { updateSniper(e, k); return; }    // 狙击：远处压制
    if (e.type === 'suicide') { updateSuicide(e, k); return; }   // 自爆：贴脸引爆
    if (e.type === 'engineer'){ updateEngineer(e, k); return; }  // 工兵：专拆基地

    if ((e.changeTimer -= k) <= 0) {
      e.changeTimer = randInt(50, 170);
      if (rng() < 0.6) e.dir = randInt(0, 7);
    }
    const shootMin = Math.max(22, 60 - level * 4);
    const shootMax = Math.max(80, 150 - level * 6);
    if ((e.shootTimer -= k) <= 0) {
      e.shootTimer = randInt(shootMin, shootMax);
      fire(e);
    }
    // 分层目标锁定：精英追玩家，装甲/工兵直冲基地，快速游走
    const tgt = enemyTarget(e);
    if (tgt === 'player' && player && !player.dead) e.dir = dirFromVec(player.x - e.x, player.y - e.y);
    else if (tgt === 'base' && baseAlive) e.dir = dirFromVec(BASE.x * TILE - e.x, BASE.y * TILE - e.y);

    if (!moveTank(e, k)) {
      e.changeTimer = Math.min(e.changeTimer, 20);
      e.dir = pickFreeDir(e, chaseChance(e));
    }
  }

  // —— 狙击兵：保持中距离压制，慢速精准弹，可走位躲避 ——
  function updateSniper(e, k) {
    if (player && !player.dead) {
      const dx = player.x - e.x, dy = player.y - e.y;
      const dist = Math.hypot(dx, dy);
      let moveDir = null;
      if (dist > 11 * TILE) moveDir = dirFromVec(dx, dy);          // 太远：靠近
      else if (dist < 6 * TILE) moveDir = dirFromVec(-dx, -dy);    // 太近：拉开
      if (moveDir !== null) {
        e.dir = moveDir;
        if (!moveTank(e, k)) e.dir = pickFreeDir(e, 0.5);
      }
      e.dir = dirFromVec(dx, dy);   // 始终面向玩家
    } else if (baseAlive) {
      e.dir = dirFromVec(BASE.x * TILE - e.x, BASE.y * TILE - e.y);
    }
    if ((e.shootTimer -= k) <= 0) {
      e.shootTimer = randInt(Math.max(26, 80 - level * 2), Math.max(60, 130 - level * 4));
      fire(e);
    }
  }

  // —— 自爆兵：全速冲向玩家（无则基地），近身引爆 ——
  function updateSuicide(e, k) {
    let tx = BASE.x * TILE, ty = BASE.y * TILE;
    if (player && !player.dead) { tx = player.x; ty = player.y; }
    e.dir = dirFromVec(tx - e.x, ty - e.y);
    if (!moveTank(e, k)) e.dir = pickFreeDir(e, 0.9);
    const dist = Math.hypot(tx - e.x, ty - e.y);
    if (dist < 1.2 * TILE) { e.dead = true; explodeSuicide(e); }
  }
  function explodeSuicide(e) {
    const cx = e.x + TANK_SIZE / 2, cy = e.y + TANK_SIZE / 2;
    spawnParticles(cx, cy, '#ff6b35', 26);
    sfxBoom(); shake = Math.max(shake, 8); vibe(30);
    // 近身伤害玩家（护盾/无敌期间免疫）
    if (player && !player.dead && !(player.spawnInv > 0)) {
      const d = Math.hypot(player.x + TANK_SIZE / 2 - cx, player.y + TANK_SIZE / 2 - cy);
      if (d < 2.2 * TILE) killPlayer();
    }
  }

  // —— 工兵：直冲基地，高射速专拆护墙 ——
  function updateEngineer(e, k) {
    const tx = BASE.x * TILE, ty = BASE.y * TILE;
    e.dir = dirFromVec(tx - e.x, ty - e.y);
    if (!moveTank(e, k)) e.dir = pickFreeDir(e, 0.9);
    if ((e.shootTimer -= k) <= 0) {
      e.shootTimer = randInt(40, 80);
      fire(e);
    }
  }

  function updateBoss(e, k) {
    // 出场下降：无敌、不攻击，缓动降落到场中
    if (e.enterT > 0) {
      e.enterT -= k / 60;
      e.y += (e.enterY - e.y) * 0.045 * k;
      if (e.enterT <= 0) { e.y = e.enterY; sfxBossBeam(); shake = Math.max(shake, 7); }
      return;
    }
    // 狂暴阶段判定（血量分段 50% / 25%）
    const ratio = e.hp / e.maxHp;
    const newPhase = ratio <= 0.25 ? 2 : ratio <= 0.5 ? 1 : 0;
    if (newPhase > e.phase) {
      e.phase = newPhase;
      sfxBossRage();
      bossHitFlash = 0.3;
      shake = Math.max(shake, 8);
      showToast(newPhase === 2 ? '🔥 BOSS 狂暴·二段！' : '🔥 BOSS 狂暴！');
      vibe(newPhase === 2 ? [80, 40, 80, 40, 200] : [60, 40, 120]);
    }
    // 冲锋：预警后直线高速撞击（撞墙/撞坦克自停）
    if (e.state === 'charge') {
      e.chargeT -= k;
      const sp = 3.6;
      const nx = e.x + DX[e.chargeDir] * sp * k;
      const ny = e.y + DY[e.chargeDir] * sp * k;
      if (isBlocked(nx, ny, e.size) || tankHitsTank(nx, ny, e.size, e)) {
        e.state = 'idle'; e.chargeT = 0; sfxChargeHit(); shake = Math.max(shake, 10);
      } else { e.x = nx; e.y = ny; }
      return;
    }
    if (e.state === 'charge_warn') {
      e.chargeT -= k;
      if (e.chargeT <= 0) { e.state = 'charge'; e.chargeT = 26; }
      return;
    }
    // 追踪玩家
    if (player && !player.dead) {
      e.dir = dirFromVec(
        (player.x + TANK_SIZE / 2) - (e.x + e.size / 2),
        (player.y + TANK_SIZE / 2) - (e.y + e.size / 2));
    }
    e.speed = e.phase >= 1 ? 0.95 : 0.7;   // 狂暴加速
    if (!moveTank(e, k)) e.dir = pickFreeDir(e);
    // 射击：狂暴越狠越密
    if ((e.shootTimer -= k) <= 0) {
      e.shootTimer = e.phase >= 2 ? 30 : e.phase >= 1 ? 36 : Math.max(40, 70 - level * 2);
      bossFire(e, e.phase);
    }
    // 技能释放
    if ((e.skillTimer -= k) <= 0) {
      e.skillTimer = randInt(230, 340);
      bossSkill(e);
    }
  }

  function pickFreeDir(e, chase) {
    const free = [0, 1, 2, 3, 4, 5, 6, 7].filter(d =>
      !isBlocked(e.x + DX[d] * TILE, e.y + DY[d] * TILE, e.size) &&
      !tankHitsTank(e.x + DX[d] * TILE, e.y + DY[d] * TILE, e.size, e));
    if (!free.length) return randInt(0, 7);
    // 被挡住转向时：按 chase 概率优先朝目标（玩家 / 基地）走，其余随机游走
    if (chase && rng() < chase) {
      const goPlayer = player && !player.dead && e.type !== 'fast';
      const tx = goPlayer ? player.x : BASE.x * TILE;
      const ty = goPlayer ? player.y : BASE.y * TILE;
      const want = dirFromVec(tx - e.x, ty - e.y);
      // 期望方向不可走时，退而求其次：先两侧 45°，再对称方向
      const prefs = [want, (want + 1) % 8, (want + 7) % 8, (want + 2) % 8, (want + 6) % 8];
      const good = free.filter(d => prefs.includes(d));
      if (good.length) return good[0];
    }
    return free[randInt(0, free.length - 1)];
  }

  function tankHitsTank(nx, ny, size, self) {
    const tanks = self.isPlayer ? enemies : enemies.concat(player && !player.dead ? [player] : []);
    for (const t of tanks) {
      if (t === self || t.dead) continue;
      if (nx < t.x + t.size && nx + size > t.x && ny < t.y + t.size && ny + size > t.y) return true;
    }
    return false;
  }

  // ===== 子弹更新 =====
  function updateBullet(b, k) {
    const dist = b.speed * k;
    const steps = Math.max(1, Math.ceil(dist));
    const stepLen = dist / steps;
    for (let s = 0; s < steps; s++) {
      b.x += DX[b.dir] * stepLen;
      b.y += DY[b.dir] * stepLen;
      const cx = b.x + b.size / 2, cy = b.y + b.size / 2;

      if (b.x < 0 || b.y < 0 || b.x + b.size > W || b.y + b.size > H) { b.dead = true; return; }
      if (isBlocked(b.x, b.y, b.size, true)) {
        damageTile(cx, cy);
        // 沿运动方向补刀相邻格（斜向子弹两轴都补）
        if (DY[b.dir] < 0) damageTile(cx, b.y);
        else if (DY[b.dir] > 0) damageTile(cx, b.y + b.size);
        if (DX[b.dir] < 0) damageTile(b.x, cy);
        else if (DX[b.dir] > 0) damageTile(b.x + b.size, cy);
        b.dead = true; sfxHit(); return;
      }
      // 基地
      if (baseAlive) {
        const bx = BASE.x * TILE, by = BASE.y * TILE;
        if (cx >= bx && cx <= bx + TILE && cy >= by && cy <= by + TILE) {
          baseAlive = false;
          b.dead = true; sfxBoom();
          hurtFlash = 1; vibe([90, 50, 90]);
          spawnParticles(bx + TILE / 2, by + TILE / 2, '#ff2d55', 20);
          shake = 12;
          return;
        }
      }
      // 命中坦克
      if (b.owner.isPlayer) {
        for (const e of enemies) {
          if (e.dead) continue;
          if (e.isBoss && e.enterT > 0) continue;   // Boss 出场下降中无敌
          if (cx >= e.x && cx <= e.x + e.size && cy >= e.y && cy <= e.y + e.size) {
            stat.hits++;
            // 巨弹头强化：对多血敌人额外 -1 伤害
            const extra = ((upgrades.bigbullet || 0) > 0 && e.hp > 1) ? 1 : 0;
            e.hp -= 1 + extra; e.hitFlash = 6;
            // 冰冻子弹：命中几率冻住 1 秒（每层 +15% 概率）
            if (!e.isBoss && !(e.freezeT > 0) && rng() < 0.15 * (upgrades.freeze || 0)) {
              e.freezeT = 60;
              addText(cx, cy - 8, '❄', '#7fd7ff');
            }
            if (e.isBoss) bossHitFlash = 0.18;      // Boss 血条受击闪白
            // 爆破弹头：命中时小范围溅射（波及周围敌人，不重复伤及直接命中者）
            if (b.bomb) blastBullet(cx, cy, e);
            if (e.hp <= 0) { e.dead = true; onEnemyKilled(e); }
            else { sfxHit(); spawnParticles(cx, cy, e.color, 6); }
            // 穿透弹头：有穿透余量则继续飞行（同一帧可连中），否则销毁
            if (b.pen > 0) { b.pen--; continue; }
            b.dead = true;
            return;
          }
        }
      } else if (player && !player.dead && !(player.spawnInv > 0)) {
        if (cx >= player.x && cx <= player.x + TANK_SIZE && cy >= player.y && cy <= player.y + TANK_SIZE) {
          b.dead = true; killPlayer(); return;
        }
      }
      // 子弹互撞（玩家弹拦截 Boss 弹有反馈）
      for (const o of bullets) {
        if (o === b || o.dead || o.owner.isPlayer === b.owner.isPlayer) continue;
        if (cx >= o.x && cx <= o.x + o.size && cy >= o.y && cy <= o.y + o.size) {
          b.dead = true; o.dead = true;
          if (o.owner.isBoss) { sfxClash(); score += 20; addText(cx, cy, '+20', '#ffe600'); }
          return;
        }
      }
    }
  }

  // ===== 玩家 =====
  function updatePlayer(k) {
    if (!player || player.dead) return;
    if (player.cooldown > 0) player.cooldown -= k;
    // 双轴独立读取：斜向键组合（如 W+D / 摇杆斜推）即走对角线
    let mx = 0, my = 0;
    if (keys['ArrowUp'] || keys['w'] || keys['W']) my -= 1;
    if (keys['ArrowDown'] || keys['s'] || keys['S']) my += 1;
    if (keys['ArrowLeft'] || keys['a'] || keys['A']) mx -= 1;
    if (keys['ArrowRight'] || keys['d'] || keys['D']) mx += 1;

    if (mx !== 0 || my !== 0) {
      player.dir = dirFromVec(mx, my);
      // 斜向走 1/√2 速度，保证各方向合速度一致；疾速履带强化 +15%/层；永久加成移速 +5%/级
      const spd = player.speed * (1 + 0.15 * (upgrades.speed || 0)) * (1 + 0.05 * (bonus.spd || 0));
      const step = spd * k * ((mx !== 0 && my !== 0) ? Math.SQRT1_2 : 1);
      const nx = player.x + mx * step;
      const ny = player.y + my * step;
      if (mx !== 0 && !isBlocked(nx, player.y, TANK_SIZE) && !tankHitsTank(nx, player.y, TANK_SIZE, player))
        player.x = nx;
      if (my !== 0 && !isBlocked(player.x, ny, TANK_SIZE) && !tankHitsTank(player.x, ny, TANK_SIZE, player))
        player.y = ny;
      clampPlayer();
    }
    if (keys[' '] || keys['Space'] || keys['j'] || keys['J']) fire(player);
    if (player.portalCd > 0) player.portalCd -= k;
    checkPortal(player);
  }

  function clampPlayer() {
    player.x = clamp(player.x, TILE, W - TILE - TANK_SIZE);
    player.y = clamp(player.y, TILE, H - TILE - TANK_SIZE);
  }

  function killPlayer() {
    if (!player || player.dead) return;
    player.dead = true;
    stat.deaths++;
    tookHitThisLevel = true;
    sfxBoom();
    hurtFlash = 1;
    vibe([70, 40, 70]);
    spawnParticles(player.x + TANK_SIZE / 2, player.y + TANK_SIZE / 2, player.color, 18);
    shake = 10;
    lives--;
    updateHud();
    setTimeout(() => {
      if (!running || gameOver) return;
      if (player && !player.dead) return;  // 已重生
      if (lives > 0) {
        player = makePlayer();
        player.spawnInv = 120;
        updateHud();
      } else {
        endGame(false);
      }
    }, 700);
  }

  // ===== 金币 =====
  function enemyGold(e) {
    return e.isBoss ? 60 + level * 10 : Math.round(ENEMY_TYPES[e.type].score / 10);
  }
  function addGold(n, x, y) {
    // 金运永久加成 +15%/级；金运强化 +30%/层
    const gain = Math.max(1, Math.round(n * (1 + 0.15 * (bonus.coinup || 0)) * (1 + 0.3 * (upgrades.fortune || 0))));
    coins += gain; saveCoins(); updateCoinHud();
    if (x !== undefined && y !== undefined) addText(x, y, '+' + gain + '🪙', '#ffd700');
    return gain;
  }
  function updateCoinHud() {
    if (elCoins) elCoins.textContent = coins;
    const sc = $('shopCoins'); if (sc) sc.textContent = coins;
  }

  // 爆破弹头溅射：命中点小范围爆炸，伤及周围敌人（exclude 为被直接命中者，不重复扣血）
  function blastBullet(cx, cy, exclude) {
    const R = TILE * 1.3;
    sfxBoom();
    spawnParticles(cx, cy, '#ff9f43', 14);
    shake = Math.max(shake, 5);
    for (const e of enemies) {
      if (e.dead || e === exclude) continue;
      const ex = e.x + e.size / 2, ey = e.y + e.size / 2;
      if (Math.hypot(ex - cx, ey - cy) <= R) {
        e.hp--; e.hitFlash = 6;
        if (e.hp <= 0) { e.dead = true; onEnemyKilled(e); }
      }
    }
  }

  function onEnemyKilled(e) {
    sfxBoom();
    hitStop = e.isBoss ? 0.06 : 0.03;          // 击杀定格（Boss 用慢动作替代长定格）
    vibe(e.isBoss ? [60, 50, 130] : 15);
    spawnParticles(e.x + e.size / 2, e.y + e.size / 2, e.color, e.isBoss ? 48 : 16);
    shake = e.isBoss ? 16 : 6;
    stat.kills++;
    if (e.isBoss) stat.bossKills++;
    addKillScore(e);
    // 金币掉落：不同敌人金币不同，受金运加成
    addGold(enemyGold(e), e.x + e.size / 2, e.y + e.size / 2 - 14);
    // 吸血装甲：击杀有 35%/层 几率回复 1 生命
    if ((upgrades.vampire || 0) > 0 && rng() < 0.35 * (upgrades.vampire || 0)) {
      lives = Math.min(lives + 1, 9); lastLives = -1;
      const hx = player ? player.x + TANK_SIZE / 2 : e.x + e.size / 2;
      const hy = player ? player.y - 6 : e.y - 8;
      addText(hx, hy, '+1 ❤', '#ff6b81');
      updateHud();
    }
    maybeDropPowerup(e.x + e.size / 2, e.y + e.size / 2, e.isBoss);
    if (e.isBoss) {
      bossHp = 0;
      // 死亡演出：连环爆炸 + 慢动作 + 白闪
      bossDeathT = 1.15; bossDeathX = e.x + e.size / 2; bossDeathY = e.y + e.size / 2;
      bossDeathBurst = 0;
      whiteFlash = 0.3; timeScale = 0.35;
      sfxBossDie();
      showToast('💥 BOSS 击破！'); unlockAch('boss');
    }
    if (stat.kills === 1) unlockAch('first');
  }

  function addKillScore(e) {
    combo++;
    comboTimer = 5;
    if (combo > stat.maxCombo) stat.maxCombo = combo;
    if (combo >= 8) unlockAch('combo8');
    const baseScore = e.isBoss ? 1000 * level : ENEMY_TYPES[e.type].score;
    // 连击暴击：连击系数加成 +50%；战利品猎手：基础分 +25%/层
    const mult = 1 + (combo - 1) * 0.1 * (1 + 0.5 * (upgrades.double || 0));
    const gain = Math.round(baseScore * mult * (1 + 0.25 * (upgrades.greed || 0)) / 10) * 10;
    score += gain;
    addText(e.x + e.size / 2, e.y - 4, '+' + gain, combo >= 3 ? '#ff00ff' : '#00f0ff');
    if (combo >= 3) addText(e.x + e.size / 2, e.y - 24, combo + ' 连击', '#ffe600');
  }

  // ===== 道具 =====
  function maybeDropPowerup(x, y, isBoss) {
    if (isBoss) {
      // Boss 固定掉落：护盾 + 生命 + 随机，保证战后能回血
      spawnPowerup(x - 20, y, 'shield');
      spawnPowerup(x + 20, y, 'life');
      spawnPowerup(x, y);
    } else if (rng() < (dailyMods.doublePU ? 0.30 : 0.15)) {
      spawnPowerup(x, y);
    }
  }

  function spawnPowerup(x, y, forceType) {
    let type = forceType;
    if (!type) {
      type = POWERUP_LIST[randInt(0, POWERUP_LIST.length - 1)];
      // 每日词条：后勤休假（不落生命道具）——重抽一次仍为生命则兜底为护盾
      if (dailyMods.noHeal && type === 'life') {
        type = POWERUP_LIST[randInt(0, POWERUP_LIST.length - 1)];
        if (type === 'life') type = 'shield';
      }
    }
    powerups.push({
      x: clamp(x - 8, TILE, W - TILE - 16),
      y: clamp(y - 8, TILE, H - TILE - 16),
      type, life: 12, bob: rand(0, Math.PI * 2), dead: false
    });
  }

  function updatePowerups(dt) {
    for (const p of powerups) {
      if (p.dead) continue;
      p.life -= dt;
      p.bob += dt * 4;
      if (player && !player.dead) {
        const pcx = player.x + TANK_SIZE / 2, pcy = player.y + TANK_SIZE / 2;
        const dx = pcx - (p.x + 8), dy = pcy - (p.y + 8);
        if (dx * dx + dy * dy < 24 * 24) { applyPowerup(p.type); p.dead = true; }
      }
      if (p.life <= 0) p.dead = true;
    }
    powerups = powerups.filter(p => !p.dead);
  }

  function applyPowerup(type) {
    sfxPickup();
    vibe(10);
    const def = POWERUP_DEF[type];
    if (player) addText(player.x + TANK_SIZE / 2, player.y - 6, def.label, def.color);
    switch (type) {
      case 'shield': player.spawnInv = Math.max(player.spawnInv || 0, 180); break;
      case 'rapid':  fx.rapid = 8; break;
      case 'double': fx.double = 10; break;
      case 'life':   lives = Math.min(lives + 1, 5); lastLives = -1; break;
      case 'freeze': fx.freeze = 5; break;
      case 'bomb':   bombEnemies(); break;
    }
    showToast('获得 ' + def.label + '！');
  }

  function bombEnemies() {
    shake = 14; sfxBoom();
    for (const e of enemies) {
      if (e.dead) continue;
      if (e.isBoss) {
        e.hp -= 4; e.hitFlash = 6;
        if (e.hp <= 0) { e.dead = true; onEnemyKilled(e); }
        else spawnParticles(e.x + e.size / 2, e.y + e.size / 2, '#ff9f43', 12);
      } else {
        e.dead = true;
        spawnParticles(e.x + TANK_SIZE / 2, e.y + TANK_SIZE / 2, '#ff9f43', 12);
        score += 50;
      }
    }
  }

  function showLevelIntro(text) {
    const el = $('lvIntro');
    el.querySelector('.lvT').textContent = text;
    el.classList.remove('show');
    void el.offsetWidth;             // 强制重排以重放动画
    el.classList.add('show');
    lvIntroT = 1.5;
  }

  // ===== 过关成长（三选一 Roguelite 强化） =====
  function offerUpgrades() {
    // 3 个不重复的强化（允许同项多选叠加，但本轮不重复）
    const opts = [];
    const pool = UPGRADE_POOL.slice();
    while (opts.length < 3 && pool.length) {
      const i = Math.floor(rng() * pool.length);
      opts.push(pool.splice(i, 1)[0]);
    }
    if (upgradeOpen) hideUpgradeBox();
    upgradeBox.querySelectorAll('.upCard').forEach((card, i) => {
      const def = opts[i];
      if (!def) { card.classList.add('locked'); card.style.display = 'none'; return; }
      card.style.display = '';
      card.classList.remove('locked');
      const own = upgrades[def.id] || 0;
      card.querySelector('.uIcon').textContent = def.icon;
      card.querySelector('.uName').textContent = def.name;
      card.querySelector('.uDesc').textContent = def.desc;
      card.querySelector('.uOwn').textContent = own > 0 ? '已持有 ×' + own : def.tag;
      card.onclick = () => { if (!upgradeOpen) return; applyUpgrade(def.id); };
    });
    upgradeBox.classList.add('show');
    upgradeOpen = true;
    sfxLevel();
  }

  function applyUpgrade(id) {
    const def = UPGRADE_POOL.find(x => x.id === id);
    if (!def) return;
    upgrades[id] = (upgrades[id] || 0) + 1;
    upgTotal++;
    // 即时生效项
    if (id === 'hp') { lives = Math.min(lives + 1, 9); lastLives = -1; }
    if (id === 'shield' && player) player.spawnInv = Math.max(player.spawnInv || 0, 180);
    showToast(def.icon + ' 强化 · ' + def.name);
    sfxPickup();
    advanceLevel();
  }

  function advanceLevel() {
    hideUpgradeBox();
    level++;
    if (level >= 5) unlockAch('lv5');
    // 过关奖励金币（随关卡提升，受金运加成）
    const g = addGold(20 + level * 5);
    showToast('🪙 过关奖励 +' + g);
    lvIntroNext = true;
    showLevelIntro('第 ' + level + ' 关');
    updateHud();
  }

  function hideUpgradeBox() {
    upgradeBox.classList.remove('show');
    upgradeOpen = false;
  }

  // ===== 关卡 / 敌人生成 =====
  function startLevel() {
    bossLevel = (level % 5 === 0);
    tookHitThisLevel = false;
    enemiesSpawned = 0;
    enemiesTotal = bossLevel ? 1 : Math.round((6 + level * 2) * (dailyMods.surge ? 1.3 : 1));
    // 波次：非 Boss 关拆成多波，波次越多越凶
    wavesTotal = bossLevel ? 1 : Math.min(2 + Math.floor(level / 2), 8);
    wave = 1; waveSpawned = 0; waveGapT = 0;
    enemySpawnTimer = bossLevel ? 40 : 45;
    bullets = []; enemies = []; particles = []; texts = []; powerups = [];
    baseAlive = true;
    fx = { rapid: 0, double: 0, freeze: 0 };
    combo = 0; comboTimer = 0;
    bossHp = 0; bossMaxHp = 0;
    generateMap();
    if (lives > 0 && (!player || player.dead)) {
      player = makePlayer();
      player.spawnInv = 120;
    }
    if (player) {
      player.x = SPAWN.x * TILE + (TILE - TANK_SIZE) / 2;
      player.y = SPAWN.y * TILE + (TILE - TANK_SIZE) / 2;
      player.dir = DIR.UP;
      // 开局护盾强化：每关开场 3 秒护盾
      if (upgrades.shield > 0) player.spawnInv = Math.max(player.spawnInv || 0, 180);
    }
    lastLives = -1; lastCombo = -1;
    updateHud();
  }

  // 第 w 波应刷的数量（均匀分配总量，余数补给靠后波）
  function waveSizeOf(w) {
    const base = Math.floor(enemiesTotal / wavesTotal);
    const rem = enemiesTotal - base * wavesTotal;
    return base + (w > wavesTotal - rem ? 1 : 0);
  }

  function updateSpawning(k) {
    if (enemiesSpawned >= enemiesTotal) return;
    if (bossLevel) {
      if ((enemySpawnTimer -= k) <= 0) { spawnBoss(); enemiesSpawned = 1; }
      return;
    }
    // 波间休整：清完一波稍作喘息，再提示下一波
    if (waveGapT > 0) {
      waveGapT -= k;
      spawnWarnPt = null;
      if (waveGapT <= 0) {
        wave++;
        waveSpawned = 0;
        if (wave <= wavesTotal) { showToast('🌊 第 ' + wave + ' / ' + wavesTotal + ' 波'); sfxLevel(); }
      }
      return;
    }
    if (waveSpawned >= waveSizeOf(wave)) {
      // 本波刷完：等待场上清空再进下一波
      if (enemiesSpawned < enemiesTotal && !enemies.some(e => !e.dead)) waveGapT = 130;
      spawnWarnPt = null;
      return;
    }
    if ((enemySpawnTimer -= k) > 0) {
      // 即将刷：预选出生点闪烁预告
      if (enemySpawnTimer <= 35 && !spawnWarnPt) spawnWarnPt = spawnPoints[randInt(0, 2)];
      return;
    }
    enemySpawnTimer = 60;
    // 优先用预告点，被占则顺延其他空点
    const tryPts = spawnWarnPt ? [spawnWarnPt].concat(spawnPoints) : spawnPoints;
    let pt = null;
    for (const c of tryPts) {
      if (c && !enemies.some(e => !e.dead && Math.abs(e.x - c[0]) < TILE && Math.abs(e.y - c[1]) < TILE)) { pt = c; break; }
    }
    spawnWarnPt = null;
    if (pt) {
      spawnEnemy(pt[0], pt[1], pickEnemyType());
      enemiesSpawned++;
      waveSpawned++;
    }
  }

  // ===== 主循环（deltaTime 驱动） =====
  function tick(now) {
    rafId = requestAnimationFrame(tick);
    animTime = now;
    let dt = (now - lastTime) / 1000;
    lastTime = now;
    if (!isFinite(dt) || dt <= 0) dt = 1 / 60;
    if (dt > 0.05) dt = 0.05;      // 切窗恢复后限制单帧步长
    const k = dt * 60 * timeScale; // 以 60fps 为基准的系数（含 Boss 死亡慢动作）

    if (!running || paused) { draw(); return; }

    // 关卡过渡：冻结世界，展示「第 N 关」大字
    if (lvIntroT > 0) {
      lvIntroT -= dt;
      if (lvIntroT <= 0) {
        $('lvIntro').classList.remove('show');
        if (lvIntroNext) { lvIntroNext = false; startLevel(); }
      }
      draw(); return;
    }

    // 击杀定格：世界短暂静止，只保留画面
    if (hitStop > 0) { hitStop -= dt; draw(); return; }

    // 道具效果 / 连击计时（秒）
    if (fx.rapid > 0) fx.rapid -= dt;
    if (fx.double > 0) fx.double -= dt;
    if (fx.freeze > 0) fx.freeze -= dt;
    if (comboTimer > 0) { comboTimer -= dt; if (comboTimer <= 0) combo = 0; }
    if (hurtFlash > 0) hurtFlash = Math.max(0, hurtFlash - dt * 2.2);
    if (bossWarn > 0) bossWarn -= dt;

    // Boss 死亡演出：连环爆炸 + 慢动作回弹 + 白闪渐隐
    if (bossDeathT > 0) {
      bossDeathT -= dt;
      const seg = [1.15, 0.9, 0.66, 0.42, 0.18];
      if (bossDeathBurst < seg.length && bossDeathT <= seg[bossDeathBurst]) {
        spawnParticles(bossDeathX + rand(-62, 62), bossDeathY + rand(-62, 62),
          randInt(0, 1) ? '#ff2d55' : '#ffaa00', 22);
        shake = Math.max(shake, 10);
        noiseBurst(0.25, 0.15, 2200, 200);
        bossDeathBurst++;
      }
    }
    if (timeScale < 1) timeScale = Math.min(1, timeScale + dt * 1.3);
    if (whiteFlash > 0) whiteFlash = Math.max(0, whiteFlash - dt * 1.7);
    if (bossHitFlash > 0) bossHitFlash = Math.max(0, bossHitFlash - dt);

    updatePlayer(k);
    enemies.forEach(e => { if (e.portalCd > 0) e.portalCd -= k; updateEnemy(e, k); checkPortal(e); });
    bullets.forEach(b => updateBullet(b, k));
    updatePowerups(dt);

    bullets = bullets.filter(b => !b.dead);
    enemies = enemies.filter(e => !e.dead);

    updateSpawning(k);

    // 玩家与敌人碰撞
    if (player && !player.dead) {
      for (const e of enemies) {
        if (e.dead) continue;
        const r = TANK_SIZE - 1;
        if (player.x < e.x + e.size - 1 && player.x + r > e.x && player.y < e.y + e.size - 1 && player.y + r > e.y) {
          const dx = player.x - e.x, dy = player.y - e.y;
          const len = Math.hypot(dx, dy) || 1;
          const push = 0.5 * k;
          player.x += dx / len * push; player.y += dy / len * push;
          e.x -= dx / len * push; e.y -= dy / len * push;
          clampPlayer();
          e.changeTimer = Math.min(e.changeTimer, 10);
        }
      }
    }

    if (!baseAlive) { endGame(false); return; }

    // 敌人全灭 → 过关奖励 + 关卡过渡（成就判定；Boss 需等死亡演出结束；强化面板弹出时不再重复触发）
    if (running && !upgradeOpen && enemies.length === 0 && enemiesSpawned >= enemiesTotal && bossDeathT <= 0) {
      const bonus = 1000 + level * 200;
      score += bonus;
      addText(W / 2, H / 2 - 30, '+' + bonus, '#39ff14');
      showToast('🎉 第 ' + level + ' 关完成 · 奖励 +' + bonus);
      if (!tookHitThisLevel) unlockAch('nohit');
      if (score >= 5000) unlockAch('score5k');
      sfxLevel();
      // 过关成长：先弹三选一面板，选完（或跳过）再开下一关
      lvIntroNext = false;
      offerUpgrades();
      updateHud();
      return;
    }

    particles.forEach(p => { p.x += p.vx * k; p.y += p.vy * k; p.life -= dt; });
    particles = particles.filter(p => p.life > 0);

    texts.forEach(t => { t.y -= 0.55 * k; t.life -= dt; });
    texts = texts.filter(t => t.life > 0);

    if (player && player.spawnInv > 0) player.spawnInv -= k;
    if (shake > 0) shake -= k;
    enemies.forEach(e => { if (e.hitFlash > 0) e.hitFlash -= k; });
    if (player && player.hitFlash > 0) player.hitFlash -= k;

    // 同步 Boss 血条
    const boss = enemies.find(e => e.isBoss && !e.dead);
    bossHp = boss ? boss.hp : 0;

    updateHud();
    draw();
  }

  // ===== HUD =====
  function updateHud() {
    if (score > best) {
      best = score;
      try { localStorage.setItem(LS_BEST, String(best)); } catch (e) { /* 忽略 */ }
    }
    elScore.textContent = score;
    elBest.textContent = best;
    elLevel.textContent = level;
    elRemaining.textContent = Math.max(0, enemiesTotal - enemiesSpawned + enemies.length);
    if (lives !== lastLives) {
      lastLives = lives;
      let html = '';
      const slots = Math.max(3, lives);
      for (let i = 0; i < slots; i++) html += `<span class="${i < lives ? '' : 'off'}">▲</span>`;
      elLives.innerHTML = html;
    }
    if (combo !== lastCombo) {
      lastCombo = combo;
      if (combo >= 2) {
        elComboWrap.style.display = '';
        elCombo.textContent = '×' + combo;
        elComboWrap.classList.toggle('hot', combo >= 3);
      } else {
        elComboWrap.style.display = 'none';
      }
    }
    // 波次 HUD（Boss 关隐藏）
    if (bossLevel) {
      elWaveWrap.style.display = 'none';
    } else {
      elWaveWrap.style.display = '';
      elWaveNum.textContent = Math.min(wave, wavesTotal) + '/' + wavesTotal;
    }
    // 强化计数 HUD
    if (upgTotal !== lastUpg) {
      lastUpg = upgTotal;
      elUpgNum.textContent = upgTotal;
      elUpgWrap.style.display = upgTotal > 0 ? '' : 'none';
    }
  }

  // ===== 渲染 =====
  function draw() {
    if (!map.length) return;
    ctx.setTransform(renderScale, 0, 0, renderScale, 0, 0);
    ctx.save();
    if (shake > 0) ctx.translate(rand(-shake, shake) * 0.5, rand(-shake, shake) * 0.5);

    // 背景 + 赛博网格
    ctx.fillStyle = '#030308';
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(0, 47, 167, 0.12)';
    ctx.lineWidth = 1;
    for (let i = 0; i <= W; i += TILE) {
      ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, H); ctx.stroke();
    }
    for (let i = 0; i <= H; i += TILE) {
      ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(W, i); ctx.stroke();
    }

    // 地块
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        const t = map[y][x];
        const px = x * TILE, py = y * TILE;
        if (t === TILE_BRICK) drawBrick(px, py);
        else if (t === TILE_STEEL) drawSteel(px, py);
        else if (t === TILE_WATER) drawWater(px, py);
        else if (t === TILE_BARREL) drawBarrel(px, py);
        else if (t === TILE_PORTAL) drawPortal(px, py);
      }
    }

    drawBase();

    // 出生点标记 + 预告闪烁（非 Boss 关）
    if (!bossLevel) {
      for (const pt of spawnPoints) {
        const px = pt[0] + TILE / 2, py = pt[1] + TILE / 2;
        ctx.fillStyle = 'rgba(255,80,80,0.15)';
        ctx.beginPath(); ctx.arc(px, py, 8, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(255,80,80,0.4)';
        ctx.beginPath(); ctx.arc(px, py, 2.6, 0, Math.PI * 2); ctx.fill();
      }
      if (spawnWarnPt) {
        const px = spawnWarnPt[0] + TILE / 2, py = spawnWarnPt[1] + TILE / 2;
        const blink = Math.floor(enemySpawnTimer / 5) % 2 === 0;
        ctx.save();
        ctx.strokeStyle = '#ff3355';
        ctx.lineWidth = 2.5;
        ctx.globalAlpha = blink ? 0.95 : 0.4;
        ctx.beginPath(); ctx.arc(px, py, 9 + (35 - Math.max(0, enemySpawnTimer)) * 0.35, 0, Math.PI * 2); ctx.stroke();
        ctx.restore();
      }
    }

    // 子弹（霓虹辉光；敌弹统一红色系，一眼识别敌我）
    for (const b of bullets) {
      if (b.owner.isPlayer) {
        ctx.shadowColor = '#00f0ff'; ctx.shadowBlur = 8; ctx.fillStyle = '#00f0ff';
      } else {
        const isSnip = b.owner.type === 'sniper';
        ctx.shadowColor = b.owner.isBoss ? '#ff2d55' : (isSnip ? '#ff1a2e' : '#ff3355');
        ctx.shadowBlur = b.owner.isBoss ? 10 : (isSnip ? 9 : 6);
        ctx.fillStyle = b.owner.isBoss ? '#ff2d55' : (isSnip ? '#ff1a2e' : '#ff3355');
      }
      ctx.fillRect(b.x, b.y, b.size, b.size);
      ctx.shadowBlur = 0;
    }

    // Boss 出场光柱 / 冲锋预警（画在敌人下层）
    drawBossFx();

    // 敌人
    for (const e of enemies) drawTank(e);

    // 玩家（无敌闪烁）
    if (player && !player.dead) {
      if (player.spawnInv > 0 && Math.floor(player.spawnInv / 4) % 2 === 0) {
        // 闪烁隐藏
      } else drawTank(player);
    }

    // 草丛（覆盖上层）
    for (let y = 0; y < ROWS; y++)
      for (let x = 0; x < COLS; x++)
        if (map[y][x] === TILE_TREE) drawTree(x * TILE, y * TILE);

    // 道具
    for (const p of powerups) drawPowerup(p);

    // 粒子
    for (const p of particles) {
      ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
    ctx.globalAlpha = 1;

    // 飘分
    if (texts.length) {
      ctx.font = '700 13px "Segoe UI", sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      for (const t of texts) {
        ctx.globalAlpha = clamp(t.life / t.max, 0, 1);
        ctx.fillStyle = t.color;
        ctx.fillText(t.str, t.x, t.y);
      }
      ctx.globalAlpha = 1;
    }

    ctx.restore();

    // Boss 血条（受击闪白 / 狂暴变色 / 显示关卡）
    if (bossHp > 0 && bossMaxHp > 0) {
      const bw = 300, bh = 10, bx = (W - bw) / 2, by = 8;
      const ratio = clamp(bossHp / bossMaxHp, 0, 1);
      const rage = ratio <= 0.5;
      const bar = bossHitFlash > 0 ? '#ffffff' : (rage ? '#ffaa00' : '#ff2d55');
      ctx.fillStyle = 'rgba(3,3,8,0.85)';
      ctx.fillRect(bx - 3, by - 3, bw + 6, bh + 6);
      ctx.fillStyle = rage ? 'rgba(255,170,0,0.2)' : 'rgba(255,45,85,0.2)';
      ctx.fillRect(bx, by, bw, bh);
      ctx.fillStyle = bar;
      ctx.shadowColor = bar; ctx.shadowBlur = 10;
      ctx.fillRect(bx, by, bw * ratio, bh);
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#fff';
      ctx.font = '700 10px "Consolas", monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.fillText('LV.' + level + ' BOSS  ' + bossHp + ' / ' + bossMaxHp + (rage ? '  ⚡狂暴' : ''), W / 2, by + bh + 6);
    }

    // 道具效果状态（左下）
    let ex = 8;
    const ey = H - 20;
    const showFx = (label, t, color) => {
      if (t <= 0) return;
      ctx.fillStyle = color;
      ctx.globalAlpha = 0.85;
      ctx.fillRect(ex, ey, 58, 13);
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#030308';
      ctx.font = '700 9px "Consolas", monospace';
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillText(label + ' ' + t.toFixed(1) + 's', ex + 4, ey + 7);
      ex += 64;
    };
    showFx('护盾', (player && player.spawnInv > 0) ? player.spawnInv / 60 : 0, '#00f0ff');
    showFx('快速', fx.rapid, '#ffe600');
    showFx('双管', fx.double, '#ff00ff');
    showFx('冻结', fx.freeze, '#4d9fff');

    // 受击红闪：四边红色 vignette 渐隐
    if (hurtFlash > 0) {
      const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.28, W / 2, H / 2, H * 0.78);
      g.addColorStop(0, 'rgba(255,45,85,0)');
      g.addColorStop(1, 'rgba(255,45,85,' + (0.5 * hurtFlash).toFixed(3) + ')');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
    }

    // Boss 出场警报：红色扫描条 + 闪烁大字
    if (bossWarn > 0) {
      const blink = 0.55 + 0.45 * Math.sin(bossWarn * 20);
      const bandY = H * 0.30;
      ctx.fillStyle = 'rgba(255,45,85,' + (0.22 * blink).toFixed(3) + ')';
      ctx.fillRect(0, bandY, W, 66);
      ctx.fillStyle = '#ff2d55';
      ctx.fillRect(0, bandY, W, 2);
      ctx.fillRect(0, bandY + 64, W, 2);
      ctx.globalAlpha = blink;
      ctx.shadowColor = '#ff2d55'; ctx.shadowBlur = 18;
      ctx.fillStyle = '#ff5c7a';
      ctx.font = '900 26px "Segoe UI", sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('⚠ WARNING · BOSS 来袭 ⚠', W / 2, bandY + 33);
      ctx.globalAlpha = 1; ctx.shadowBlur = 0;
    }

    // Boss 死亡白闪
    if (whiteFlash > 0) {
      ctx.fillStyle = 'rgba(255,255,255,' + (0.85 * whiteFlash).toFixed(3) + ')';
      ctx.fillRect(0, 0, W, H);
    }
  }

  // Boss 出场光柱 + 冲锋预警线（覆盖层，画在敌人下层）
  function drawBossFx() {
    for (const e of enemies) {
      if (!e.isBoss) continue;
      const cx = e.x + e.size / 2;
      if (e.enterT > 0) {
        const g = ctx.createLinearGradient(0, 0, 0, e.y + e.size);
        g.addColorStop(0, 'rgba(255,45,85,0)');
        g.addColorStop(1, 'rgba(255,45,85,0.4)');
        ctx.fillStyle = g;
        ctx.fillRect(cx - 32, 0, 64, Math.max(0, e.y + e.size));
        ctx.strokeStyle = 'rgba(255,45,85,' + (0.45 + 0.3 * Math.sin(e.enterT * 12)).toFixed(3) + ')';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(cx, e.y + e.size, 18 + (1.5 - e.enterT) * 22, 0, Math.PI * 2);
        ctx.stroke();
      }
      if (e.state === 'charge_warn') {
        const cy = e.y + e.size / 2;
        const ex = cx + DX[e.chargeDir] * 800, ey = cy + DY[e.chargeDir] * 800;
        ctx.strokeStyle = 'rgba(255,90,0,' + (0.5 + 0.4 * Math.sin(e.chargeT * 0.5)).toFixed(3) + ')';
        ctx.lineWidth = 3;
        ctx.setLineDash([10, 8]);
        ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(ex, ey); ctx.stroke();
        ctx.setLineDash([]);
      }
    }
  }

  function drawBrick(px, py) {
    ctx.fillStyle = '#2a1520';
    ctx.fillRect(px, py, TILE, TILE);
    ctx.strokeStyle = '#1a0a12';
    ctx.lineWidth = 1;
    ctx.strokeRect(px + 0.5, py + 0.5, TILE - 1, TILE - 1);
    ctx.fillStyle = '#3a2030';
    ctx.fillRect(px, py + 7, TILE, 2);
    ctx.fillRect(px, py + 15, TILE, 2);
    ctx.fillRect(px + 5, py, 2, 7);
    ctx.fillRect(px + 17, py, 2, 7);
    ctx.fillRect(px + 11, py + 9, 2, 6);
    ctx.fillRect(px + 23, py + 9, 2, 6);
    ctx.fillRect(px + 5, py + 17, 2, 7);
    ctx.fillRect(px + 17, py + 17, 2, 7);
  }

  function drawSteel(px, py) {
    ctx.fillStyle = '#1a2030';
    ctx.fillRect(px, py, TILE, TILE);
    ctx.fillStyle = '#2a3548';
    ctx.fillRect(px + 3, py + 3, TILE - 6, TILE - 6);
    ctx.fillStyle = '#3a4860';
    ctx.fillRect(px + 8, py + 8, TILE - 16, TILE - 16);
    ctx.fillStyle = 'rgba(0, 240, 255, 0.12)';
    ctx.fillRect(px + 8, py + 8, TILE - 16, 2);
  }

  function drawWater(px, py) {
    ctx.fillStyle = '#0a1530';
    ctx.fillRect(px, py, TILE, TILE);
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.35)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(px + 2, py + 8); ctx.lineTo(px + 12, py + 8);
    ctx.moveTo(px + 14, py + 16); ctx.lineTo(px + 22, py + 16);
    ctx.stroke();
  }

  function drawTree(px, py) {
    ctx.fillStyle = 'rgba(10, 30, 20, 0.85)';
    ctx.fillRect(px, py, TILE, TILE);
    ctx.fillStyle = '#1a4020';
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.arc(px + 6 + i * 7, py + 8, 6, 0, Math.PI * 2);
      ctx.arc(px + 10 + i * 7, py + 15, 6, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = 'rgba(57, 255, 20, 0.4)';
    ctx.fillRect(px + 4, py + 4, 2, 2);
    ctx.fillRect(px + 18, py + 14, 2, 2);
  }

  // 可爆炸油桶：圆柱体 + 危险警示条 + 顶部引信
  function drawBarrel(px, py) {
    const cx = px + TILE / 2, cy = py + TILE / 2;
    ctx.save();
    // 桶身
    ctx.fillStyle = '#6b4a16';
    ctx.fillRect(px + 5, py + 3, TILE - 10, TILE - 6);
    ctx.fillStyle = '#8a5f1e';
    ctx.fillRect(px + 5, py + 3, TILE - 10, TILE - 14);
    // 危险警示条
    ctx.fillStyle = '#ffb300';
    ctx.fillRect(px + 5, py + 13, TILE - 10, 5);
    ctx.fillStyle = '#1a1206';
    for (let i = 0; i < 4; i++) ctx.fillRect(px + 6 + i * 6, py + 13, 3, 5);
    // 上下箍环
    ctx.fillStyle = '#4a320e';
    ctx.fillRect(px + 4, py + 3, TILE - 8, 2);
    ctx.fillRect(px + 4, py + TILE - 7, TILE - 8, 2);
    // 引信/危险标记
    const blink = Math.floor(animTime / 350) % 2 === 0;
    ctx.fillStyle = blink ? '#ff2d55' : '#8a1520';
    ctx.beginPath(); ctx.arc(cx, cy - 5, 3, 0, Math.PI * 2); ctx.fill();
    ctx.shadowColor = '#ffb300'; ctx.shadowBlur = blink ? 8 : 0;
    ctx.strokeStyle = '#ffb300'; ctx.lineWidth = 1;
    ctx.strokeRect(px + 6.5, py + 4.5, TILE - 13, TILE - 9);
    ctx.restore();
  }

  // 传送门：旋转紫环 + 内芯
  function drawPortal(px, py) {
    const cx = px + TILE / 2, cy = py + TILE / 2;
    const pulse = (Math.sin(animTime * 0.006) + 1) / 2;
    ctx.save();
    ctx.shadowColor = '#a06bff'; ctx.shadowBlur = 12 + pulse * 8;
    ctx.fillStyle = 'rgba(160, 107, 255, 0.5)';
    ctx.beginPath(); ctx.arc(cx, cy, TILE / 2 - 3, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(10, 6, 20, 0.88)';
    ctx.beginPath(); ctx.arc(cx, cy, TILE / 2 - 9, 0, Math.PI * 2); ctx.fill();
    // 旋转弧线
    ctx.strokeStyle = '#c9a6ff'; ctx.lineWidth = 2;
    for (let i = 0; i < 3; i++) {
      const a = animTime * 0.004 + i * Math.PI * 2 / 3;
      ctx.beginPath(); ctx.arc(cx, cy, TILE / 2 - 6, a, a + 1.1); ctx.stroke();
    }
    // 内芯辉光点
    ctx.fillStyle = `rgba(233, 216, 255, ${0.5 + pulse * 0.4})`;
    ctx.beginPath(); ctx.arc(cx, cy, 3 + pulse * 1.5, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawBase() {
    const px = BASE.x * TILE, py = BASE.y * TILE;
    if (baseAlive) {
      ctx.fillStyle = '#0a1040';
      ctx.fillRect(px + 2, py + 2, TILE - 4, TILE - 4);
      ctx.strokeStyle = '#002FA7';
      ctx.lineWidth = 2;
      ctx.strokeRect(px + 2, py + 2, TILE - 4, TILE - 4);
      ctx.fillStyle = '#00f0ff';
      ctx.font = '700 8px "Consolas", monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('Q', px + TILE / 2, py + TILE / 2);
      ctx.shadowColor = '#00f0ff'; ctx.shadowBlur = 6;
      ctx.fillText('Q', px + TILE / 2, py + TILE / 2);
      ctx.shadowBlur = 0;
    } else {
      ctx.fillStyle = '#1a0505';
      ctx.fillRect(px + 2, py + 2, TILE - 4, TILE - 4);
      ctx.strokeStyle = '#ff2d55';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(px + 6, py + 6); ctx.lineTo(px + TILE - 6, py + TILE - 6);
      ctx.moveTo(px + TILE - 6, py + 6); ctx.lineTo(px + 6, py + TILE - 6);
      ctx.stroke();
    }
  }

  function drawPowerup(p) {
    const size = 16;
    // 快消失时闪烁
    if (p.life < 3 && Math.floor(p.life * 6) % 2 === 0) return;
    const x = p.x, y = p.y + Math.sin(p.bob) * 2;
    const def = POWERUP_DEF[p.type];
    const important = (p.type === 'shield' || p.type === 'life');
    const lowHp = lives <= 1;   // 濒死时高亮关键道具
    ctx.save();
    // 关键道具：光柱 + 下坠箭头指引，濒死时脉冲
    if (important) {
      const t = performance.now();
      const pulse = lowHp ? (0.45 + 0.4 * Math.sin(t / 130)) : 0.28;
      ctx.fillStyle = def.color;
      ctx.globalAlpha = pulse;
      ctx.shadowColor = def.color; ctx.shadowBlur = 14;
      ctx.fillRect(x + size / 2 - 3, y - 68, 6, 68);
      ctx.globalAlpha = 1;
      const ay = y - 72 - (lowHp ? Math.abs(Math.sin(t / 200)) * 5 : 0);
      ctx.beginPath();
      ctx.moveTo(x + size / 2 - 6, ay);
      ctx.lineTo(x + size / 2 + 6, ay);
      ctx.lineTo(x + size / 2, ay - 8);
      ctx.closePath();
      ctx.fill();
      ctx.shadowBlur = 0;
    }
    ctx.shadowColor = def.color; ctx.shadowBlur = 10;
    ctx.fillStyle = '#05050a';
    ctx.fillRect(x, y, size, size);
    ctx.strokeStyle = def.color; ctx.lineWidth = 2;
    ctx.strokeRect(x + 0.5, y + 0.5, size - 1, size - 1);
    drawPowerupIcon(p.type, x + size / 2, y + size / 2, def.color);
    ctx.restore();
  }

  function drawPowerupIcon(type, cx, cy, color) {
    const s = 4;
    ctx.fillStyle = color;
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.5;
    if (type === 'shield') {
      ctx.beginPath();
      ctx.moveTo(cx, cy - s - 1);
      ctx.lineTo(cx + s, cy - s + 2);
      ctx.lineTo(cx + s, cy + 1);
      ctx.quadraticCurveTo(cx + s, cy + s, cx, cy + s + 1);
      ctx.quadraticCurveTo(cx - s, cy + s, cx - s, cy + 1);
      ctx.lineTo(cx - s, cy - s + 2);
      ctx.closePath();
      ctx.fill();
    } else if (type === 'rapid') {
      ctx.beginPath();
      ctx.moveTo(cx + 1, cy - s - 1);
      ctx.lineTo(cx - 2, cy);
      ctx.lineTo(cx + 0.5, cy);
      ctx.lineTo(cx - 1, cy + s + 1);
      ctx.lineTo(cx + 2.5, cy - 1);
      ctx.lineTo(cx, cy - 1);
      ctx.closePath();
      ctx.fill();
    } else if (type === 'double') {
      ctx.fillRect(cx - 3.5, cy - s, 2.5, s * 2);
      ctx.fillRect(cx + 1, cy - s, 2.5, s * 2);
    } else if (type === 'life') {
      ctx.fillRect(cx - 1.5, cy - s, 3, s * 2);
      ctx.fillRect(cx - s, cy - 1.5, s * 2, 3);
    } else if (type === 'freeze') {
      for (let i = 0; i < 3; i++) {
        const a = i * Math.PI / 3;
        ctx.beginPath();
        ctx.moveTo(cx - Math.cos(a) * s, cy - Math.sin(a) * s);
        ctx.lineTo(cx + Math.cos(a) * s, cy + Math.sin(a) * s);
        ctx.stroke();
      }
    } else if (type === 'bomb') {
      ctx.beginPath();
      ctx.arc(cx, cy + 1, s - 1, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(cx + 1, cy - s + 1);
      ctx.lineTo(cx + 3, cy - s - 2);
      ctx.stroke();
    }
  }

  function drawTank(t) {
    const s = t.size;
    const scale = s / TANK_SIZE;
    const cx = t.x + s / 2, cy = t.y + s / 2;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(t.dir * Math.PI / 4);
    ctx.scale(scale, scale);

    const isPlayer = t.isPlayer;
    const flashing = t.hitFlash > 0;
    // 装备皮肤（仅玩家）：按当前装备的皮肤配色绘制
    const skin = isPlayer ? (SKINS[equippedSkin] || SKINS.classic) : null;

    if (isPlayer) { ctx.shadowColor = skin.glow; ctx.shadowBlur = 10; }
    else if (t.isBoss) { ctx.shadowColor = '#ff2d55'; ctx.shadowBlur = 18; }
    else { ctx.shadowColor = t.color; ctx.shadowBlur = 8; }

    const bodyColor = flashing ? '#ffffff' : (isPlayer ? skin.body : t.color);

    // 履带
    ctx.fillStyle = isPlayer ? skin.track : (t.isBoss ? '#2a0810' : '#1a1020');
    ctx.fillRect(-11, -10, 5, 20);
    ctx.fillRect(6, -10, 5, 20);
    ctx.fillStyle = isPlayer ? skin.body : (t.isBoss ? '#ff2d55' : '#2a2035');
    ctx.fillRect(-11, -8, 5, 3);
    ctx.fillRect(-11, -3, 5, 3);
    ctx.fillRect(-11, 2, 5, 3);
    ctx.fillRect(-11, 7, 5, 3);
    ctx.fillRect(6, -8, 5, 3);
    ctx.fillRect(6, -3, 5, 3);
    ctx.fillRect(6, 2, 5, 3);
    ctx.fillRect(6, 7, 5, 3);

    // 车身
    ctx.fillStyle = bodyColor;
    ctx.fillRect(-6, -8, 12, 16);
    // 炮塔
    ctx.fillStyle = flashing ? '#dddddd' : (isPlayer ? shade(skin.body, 30) : shade(t.color, -25));
    ctx.fillRect(-4, -4, 8, 8);
    // 炮管
    ctx.fillStyle = isPlayer ? skin.barrel : (t.isBoss ? '#ffaa00' : '#2a2035');
    ctx.fillRect(-2, -16, 4, 10);

    // 兵种独特造型
    if (!isPlayer && !t.isBoss) {
      if (t.type === 'sniper') {
        // 狙击：加长炮管 + 瞄准镜
        ctx.fillStyle = '#a06bff';
        ctx.fillRect(-1.5, -21, 3, 6);
        ctx.fillStyle = '#e6d4ff';
        ctx.fillRect(-1, -20, 2, 2);
        ctx.fillStyle = 'rgba(160,107,255,0.5)';
        ctx.fillRect(-4, -14, 8, 1.5);
      } else if (t.type === 'suicide') {
        // 自爆：红色警示灯闪烁 + 保险丝
        const blink = Math.floor(animTime / 120) % 2 === 0;
        ctx.fillStyle = blink ? '#ff2d55' : '#7a1520';
        ctx.beginPath(); ctx.arc(0, -1, 3.4, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = blink ? '#ffb300' : '#5a1200';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(0, -1, 5.2, 0, Math.PI * 2); ctx.stroke();
      } else if (t.type === 'engineer') {
        // 工兵：绿色维修十字 + 警示条纹
        ctx.strokeStyle = '#2ecc71'; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-3.5, 0); ctx.lineTo(3.5, 0);
        ctx.moveTo(0, -3.5); ctx.lineTo(0, 3.5);
        ctx.stroke();
        ctx.fillStyle = '#1d4a2a';
        ctx.fillRect(-6, -8, 12, 2);
      } else if (t.type === 'fast') {
        // 快速：两侧进气格栅（速度感）
        ctx.fillStyle = 'rgba(255,230,0,0.55)';
        ctx.fillRect(-6, -6, 2, 4);
        ctx.fillRect(4, -6, 2, 4);
      } else if (t.type === 'elite') {
        // 精英：中央能量核
        ctx.fillStyle = 'rgba(255,0,255,0.8)';
        ctx.beginPath(); ctx.arc(0, 0, 2.2, 0, Math.PI * 2); ctx.fill();
      }
    }

    // 装甲/精英额外标记
    if (t.type === 'armored') {
      ctx.strokeStyle = 'rgba(200,220,255,0.7)';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(-7, -9, 14, 18);
    }
    if (t.type === 'elite' || t.isBoss) {
      ctx.strokeStyle = t.isBoss ? 'rgba(255,45,85,0.55)' : 'rgba(255,0,255,0.45)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(0, 0, 13, 0, Math.PI * 2);
      ctx.stroke();
    }

    ctx.shadowBlur = 0;
    ctx.restore();

    // 多血敌人：头顶血点（Boss 用顶部血条）
    if (!isPlayer && !t.isBoss && t.maxHp > 1) {
      const dots = t.maxHp;
      const dw = 4, gap = 2;
      const totalW = dots * dw + (dots - 1) * gap;
      let dx = t.x + s / 2 - totalW / 2;
      const dy = t.y - 5;
      for (let i = 0; i < dots; i++) {
        ctx.fillStyle = i < t.hp ? t.color : 'rgba(255,255,255,0.15)';
        ctx.fillRect(dx, dy, dw, 3);
        dx += dw + gap;
      }
    }
  }
