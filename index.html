  // ===== 控制 =====
  function start(isDaily) {
    dailyMode = !!isDaily;
    dailyRng = dailyMode ? mulberry32(dailySeed()) : null;
    rng = dailyMode ? dailyRng : Math.random;
    score = 0; lives = 3 + (bonus.lifeup || 0); level = 1;   // 装甲储备：开局额外生命
    // 重置过关成长与每日词条
    upgrades = {}; upgTotal = 0;
    dailyMods = { _names: [] };
    hideUpgradeBox();
    if (dailyMode) {
      // 用当日种子抽 2~3 条词条，全服同一天完全一致
      const pool = DAILY_MODS.slice();
      const n = 2 + Math.floor(dailyRng() * 2);   // 2 或 3 条
      for (let i = 0; i < n && pool.length; i++) {
        const idx = Math.floor(dailyRng() * pool.length);
        const m = pool.splice(idx, 1)[0];
        dailyMods._names.push(m.name);
        m.apply();
      }
      dailyMods._desc = dailyMods._names.join(' · ');
    }
    gameOver = false; paused = false; won = false;
    bestAtStart = best;
    lastLives = -1; lastCombo = -1;
    hurtFlash = 0; hitStop = 0; bossWarn = 0;
    resetStat();
    achNew = [];
    player = makePlayer();
    // 常备护盾：每关开场 2 秒护盾（120 帧 ≈ 2 秒）
    player.spawnInv = bonus.shield > 0 ? 120 : 0;
    startLevel();
    running = true;
    hideOverlay();
    pauseBtn.textContent = '⏸';
    setBgm('battle');
    lvIntroNext = false;
    showLevelIntro(dailyMode ? '每日挑战' : '第 1 关');
    if (dailyMode) {
      const d = new Date();
      showToast('📅 每日挑战 · ' + (d.getMonth() + 1) + '月' + d.getDate() + '日 · 全网同图');
      if (dailyMods._desc) setTimeout(() => showToast('⚡ 词条：' + dailyMods._desc), 2200);
    }
  }

  function endGame(win) {
    gameOver = true;
    running = false;
    won = win;
    pauseBtn.textContent = '⏸';
    setBgm('calm');
    // 结算成就判定
    if (dailyMode) unlockAch('daily');
    if (score >= 5000) unlockAch('score5k');
    if (stat.shots >= 20 && stat.hits / stat.shots >= 0.7) unlockAch('surge');
    // 每日挑战通关：额外金币奖励
    if (win && dailyMode) {
      const g = addGold(50);
      showToast('📅 每日挑战通关 · 奖励 🪙' + g);
    }
    showOverlay('over');
    if (score > bestAtStart) showToast('🏆 新纪录：' + score + ' 分！');
  }

  // ===== 商店（永久加成 + 角色皮肤）=====
  let shopTab = 'bonus';
  function openShop() { shopBox.classList.add('show'); renderShop(); }
  function closeShop() { shopBox.classList.remove('show'); }
  function renderShop() {
    const sc = $('shopCoins'); if (sc) sc.textContent = coins;
    shopBody.innerHTML = '';
    if (shopTab === 'bonus') {
      for (const def of BONUS_DEF) {
        const lv = bonus[def.id] || 0;
        const maxed = lv >= def.max;
        const price = maxed ? 0 : def.price[lv];
        const item = document.createElement('div');
        item.className = 'shopItem';
        item.innerHTML = '<span class="siIcon">' + def.icon + '</span>' +
          '<span class="siName">' + def.name + '</span>' +
          '<span class="siDesc">' + def.desc + '</span>' +
          '<span class="siMeta">' + (maxed ? '已满级' : '等级 ' + lv + '/' + def.max + ' · 下一级 🪙' + price) + '</span>' +
          '<button class="siBtn' + (maxed ? ' owned disabled' : '') + '">' + (maxed ? '已满级' : '🪙 购买 ' + price) + '</button>';
        const btn = item.querySelector('.siBtn');
        if (!maxed) btn.onclick = () => buyBonus(def.id);
        shopBody.appendChild(item);
      }
    } else {
      for (const id of SKIN_LIST) {
        const sk = SKINS[id];
        const owned = ownedSkins.includes(id);
        const equipped = equippedSkin === id;
        const item = document.createElement('div');
        item.className = 'shopItem' + (equipped ? ' equipped' : '');
        item.innerHTML = '<span class="siIcon">' + sk.icon + '</span>' +
          '<span class="siName">' + sk.name + '</span>' +
          '<span class="siDesc">玩家坦克外观配色</span>' +
          '<span class="siMeta">' + (owned ? (equipped ? '已装备' : '已拥有') : '🪙 ' + sk.price) + '</span>' +
          '<button class="siBtn ' + (equipped ? 'equipped' : (owned ? 'owned' : '')) + '">' + (equipped ? '已装备' : (owned ? '装备' : '🪙 购买 ' + sk.price)) + '</button>';
        const btn = item.querySelector('.siBtn');
        btn.onclick = () => {
          if (equipped) return;
          if (owned) equipSkin(id); else buySkin(id);
        };
        shopBody.appendChild(item);
      }
    }
  }
  function buyBonus(id) {
    const def = BONUS_DEF.find(x => x.id === id);
    if (!def) return;
    const lv = bonus[id] || 0;
    if (lv >= def.max) return;
    const price = def.price[lv];
    if (coins < price) { showToast('🪙 金币不足'); beep(180, 0.12, 'square', 0.05); return; }
    coins -= price; bonus[id] = lv + 1;
    saveCoins(); saveBonus(); renderShop(); updateCoinHud();
    showToast(def.icon + ' 购买成功 · ' + def.name);
    sfxPickup();
  }
  function buySkin(id) {
    const sk = SKINS[id];
    if (!sk || ownedSkins.includes(id)) return;
    if (coins < sk.price) { showToast('🪙 金币不足'); beep(180, 0.12, 'square', 0.05); return; }
    coins -= sk.price; ownedSkins.push(id); equippedSkin = id;
    saveCoins(); saveSkins(); saveSkin(); renderShop(); updateCoinHud();
    showToast(sk.icon + ' 皮肤已购买并装备 · ' + sk.name);
    sfxPickup();
  }
  function equipSkin(id) {
    if (!ownedSkins.includes(id)) return;
    equippedSkin = id; saveSkin(); renderShop();
    showToast(SKINS[id].icon + ' 已装备 · ' + SKINS[id].name);
    sfxPickup();
  }

  // ===== 分享成绩 / 好友挑战 =====
  function copyText(t) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(t).then(() => true, () => copyFallback(t));
    }
    return Promise.resolve(copyFallback(t));
  }
  function copyFallback(t) {
    const ta = document.createElement('textarea');
    ta.value = t;
    ta.style.cssText = 'position:fixed;top:-999px;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { /* 忽略 */ }
    ta.remove();
    return ok;
  }
  async function shareScore() {
    const base = location.origin + location.pathname;
    const link = base + (dailyMode ? '?daily=1&' : '?') + 'ch=' + score + '-' + level;
    const acc = stat.shots > 0 ? Math.round(stat.hits / stat.shots * 100) : 0;
    const text = '⚔️ 我在「QIAN 坦克大战」拿了 ' + score + ' 分、打到第 ' + level + ' 关'
      + '（击杀 ' + stat.kills + ' · 最长 ×' + Math.max(1, stat.maxCombo) + ' 连击 · 命中率 ' + acc + '%'
      + (stat.bossKills ? ' · Boss×' + stat.bossKills : '') + '），来超越我！';
    try {
      if (navigator.share) {
        await navigator.share({ title: 'QIAN 坦克大战', text, url: link });
        return;
      }
      const ok = await copyText(text + ' ' + link);
      showToast(ok ? '📋 挑战链接已复制，去粘贴给朋友！' : '复制失败，请手动复制地址栏链接');

  }

  // ===== 战绩图（霓虹战报卡，长按保存 / 分享） =====
  function buildReportCanvas() {
    const W2 = 728, H2 = 1028;
    const c = document.createElement('canvas');
    c.width = W2; c.height = H2;
    const g = c.getContext('2d');

    // 背景：深空渐变 + 赛博网格
    const bg = g.createLinearGradient(0, 0, 0, H2);
    bg.addColorStop(0, '#060a1e'); bg.addColorStop(0.55, '#0a1140'); bg.addColorStop(1, '#04060f');
    g.fillStyle = bg; g.fillRect(0, 0, W2, H2);
    g.strokeStyle = 'rgba(0, 47, 167, 0.35)'; g.lineWidth = 1;
    for (let x = 0; x <= W2; x += 48) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H2); g.stroke(); }
    for (let y = 0; y <= H2; y += 48) { g.beginPath(); g.moveTo(0, y); g.lineTo(W2, y); g.stroke(); }

    // 顶部品牌
    g.textAlign = 'center';
    g.fillStyle = '#00f0ff';
    g.font = '800 30px "Segoe UI", sans-serif';
    g.shadowColor = 'rgba(0, 240, 255, 0.8)'; g.shadowBlur = 18;
    g.fillText('QIAN · 坦克大战', W2 / 2, 86);
    g.shadowBlur = 0;
    g.fillStyle = 'rgba(157, 196, 232, 0.75)';
    g.font = '600 18px "Segoe UI", sans-serif';
    g.fillText('— 战 绩 报 告 —', W2 / 2, 122);

    // 大分数
    const acc = stat.shots > 0 ? Math.round(stat.hits / stat.shots * 100) : 0;
    g.fillStyle = '#ffffff';
    g.font = '800 128px "Segoe UI", sans-serif';
    g.shadowColor = 'rgba(0, 240, 255, 0.85)'; g.shadowBlur = 34;
    g.fillText(String(score), W2 / 2, 288);
    g.shadowBlur = 0;
    g.fillStyle = '#00f0ff';
    g.font = '700 22px "Segoe UI", sans-serif';
    g.fillText('TOTAL SCORE', W2 / 2, 328);

    if (score > bestAtStart && score > 0) {
      g.fillStyle = '#ffe600';
      g.font = '800 24px "Segoe UI", sans-serif';
      g.shadowColor = 'rgba(255, 230, 0, 0.8)'; g.shadowBlur = 16;
      g.fillText('🏆 新 纪 录', W2 / 2, 372);
      g.shadowBlur = 0;
    }

    // 统计卡
    const stats = [
      ['到达关卡', '第 ' + level + ' 关', '#00f0ff'],
      ['击毁敌军', stat.kills + ' 辆', '#ff00ff'],
      ['最长连击', '×' + Math.max(1, stat.maxCombo), '#ffe600'],
      ['命中率', acc + '%', '#39ff14'],
      ['Boss 击破', stat.bossKills + ' 只', '#ff2d55'],
      ['阵亡', stat.deaths + ' 次', '#9dc4e8']
    ];
    const cardW = 288, cardH = 92, gapX = 28, gapY = 22;
    const x0 = (W2 - cardW * 2 - gapX) / 2, y0 = 420;
    stats.forEach((s, i) => {
      const cx = x0 + (i % 2) * (cardW + gapX);
      const cy = y0 + ((i / 2) | 0) * (cardH + gapY);
      g.fillStyle = 'rgba(10, 20, 55, 0.85)';
      g.strokeStyle = 'rgba(0, 240, 255, 0.35)';
      g.lineWidth = 1.5;
      roundRect(g, cx, cy, cardW, cardH, 14);
      g.fill(); g.stroke();
      g.fillStyle = 'rgba(157, 196, 232, 0.85)';
      g.font = '600 17px "Segoe UI", sans-serif';
      g.fillText(s[0], cx + cardW / 2, cy + 32);
      g.fillStyle = s[2];
      g.font = '800 30px "Segoe UI", sans-serif';
      g.fillText(s[1], cx + cardW / 2, cy + 72);
    });

    // 成就徽章（本次解锁优先）
    const showAch = achNew.length ? achNew : [...achUnlocked].slice(0, 4);
    if (showAch.length) {
      let ax = W2 / 2 - (showAch.length * 132 - 12) / 2;
      const ay = y0 + 3 * (cardH + gapY) + 18;
      showAch.slice(0, 4).forEach(id => {
        const a = ACHIEVE.find(x => x.id === id);
        if (!a) return;
        g.fillStyle = 'rgba(255, 230, 0, 0.12)';
        g.strokeStyle = 'rgba(255, 230, 0, 0.5)';
        roundRect(g, ax, ay, 120, 44, 22);
        g.fill(); g.stroke();
        g.fillStyle = '#ffe600';
        g.font = '700 16px "Segoe UI", sans-serif';
        g.fillText(a.icon + ' ' + a.name, ax + 60, ay + 28);
        ax += 132;
      });
    }

    // 底部署名
    g.fillStyle = 'rgba(120, 165, 215, 0.8)';
    g.font = '600 18px "Segoe UI", sans-serif';
    g.fillText('DESIGNED BY QIAN · V1.9', W2 / 2, H2 - 78);
    const d = new Date();
    const ds = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    g.fillStyle = 'rgba(90, 106, 138, 0.7)';
    g.font = '500 15px "Segoe UI", sans-serif';
    g.fillText(ds + (dailyMode ? ' · 每日挑战' : ''), W2 / 2, H2 - 48);

    return c;
  }
  function roundRect(g, x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r);
    g.arcTo(x, y, x + w, y, r);
    g.closePath();
  }

  function openReport() {
    try {
      const c = buildReportCanvas();
      reportImg.src = c.toDataURL('image/png');
      reportBox.classList.add('show');
    } catch (e) {
      showToast('战绩图生成失败');
    }
  }
  async function shareReport() {
    try {
      const blob = await (await fetch(reportImg.src)).blob();
      const file = new File([blob], 'qian-tank-battle.png', { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: 'QIAN 坦克大战 · 战绩图' });
        return;
      }
      showToast('长按图片保存，发给朋友');
    } catch (e) {
      showToast('长按图片保存，发给朋友');
    }
  }

  // ===== 事件 =====
  btnPlay.addEventListener('click', () => {
    ensureAudio();
    if (overlayKind === 'paused') togglePause();
    else start(dailyInvited);
  });
  btnDaily.addEventListener('click', () => { ensureAudio(); start(true); });
  btnShop.addEventListener('click', () => { ensureAudio(); openShop(); });
  btnShopClose.addEventListener('click', closeShop);
  tabBonus.addEventListener('click', () => { shopTab = 'bonus'; tabBonus.classList.add('active'); tabSkins.classList.remove('active'); renderShop(); });
  tabSkins.addEventListener('click', () => { shopTab = 'skins'; tabSkins.classList.add('active'); tabBonus.classList.remove('active'); renderShop(); });
  btnShare.addEventListener('click', () => { ensureAudio(); shareScore(); });
  btnReport.addEventListener('click', () => { ensureAudio(); openReport(); });
  $('btnReportClose').addEventListener('click', () => reportBox.classList.remove('show'));
  $('btnReportShare').addEventListener('click', () => { ensureAudio(); shareReport(); });
  pauseBtn.addEventListener('click', (e) => { togglePause(); e.currentTarget.blur(); });
  muteBtn.addEventListener('click', (e) => { toggleMute(); e.currentTarget.blur(); });

  window.addEventListener('keydown', (e) => {
    keys[e.key] = true;
    if (e.key === 'p' || e.key === 'P') togglePause();
    if (e.key === 'm' || e.key === 'M') toggleMute();
    if (e.key === 'Enter' && !overlay.classList.contains('hide')) {
      if (overlayKind === 'paused') togglePause(); else start(dailyInvited);
    }
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault();
  });
  window.addEventListener('keyup', (e) => { keys[e.key] = false; });

  function loseFocus() {
    keys = {};
    releaseTouch();
    if (running && !paused && !gameOver) togglePause();
  }
  window.addEventListener('blur', loseFocus);
  document.addEventListener('visibilitychange', () => { if (document.hidden) loseFocus(); });

  // ===== 触屏输入：左摇杆八方向走位 + 右开火 =====
  // STICK_KEYS[i] = 八方向 i 对应要按下的方向键（斜向按两键，与键盘 W+D 同理）
  const STICK_KEYS = [
    ['ArrowUp'], ['ArrowUp', 'ArrowRight'], ['ArrowRight'], ['ArrowDown', 'ArrowRight'],
    ['ArrowDown'], ['ArrowDown', 'ArrowLeft'], ['ArrowLeft'], ['ArrowUp', 'ArrowLeft']
  ];
  const STICK_ALL = ['ArrowUp', 'ArrowRight', 'ArrowDown', 'ArrowLeft'];
  const zone = $('stickZone'), stick = $('stick'), knob = $('knob'), fireBtn = $('tFire');
  const touchKeys = new Set();
  let stickDir = -1;        // -1 = 回中不移动
  let stickId = null;

  function setStickDir(d) {
    if (d === stickDir) return;
    // 只清摇杆设过的键，不干扰键盘实体键
    for (const k of STICK_ALL) {
      if (touchKeys.has(k)) { keys[k] = false; touchKeys.delete(k); }
    }
    stickDir = d;
    if (d >= 0) {
      for (const k of STICK_KEYS[d]) { keys[k] = true; touchKeys.add(k); }
    }
  }

  function releaseTouch() {
    touchKeys.forEach(k => { keys[k] = false; });
    touchKeys.clear();
    stickDir = -1; stickId = null;
    knob.style.transform = '';
    knob.classList.remove('on');
    stick.classList.remove('active');
    fireBtn.classList.remove('on');
    keys[' '] = false;
  }

  // 以底盘圆心为原点：按偏移角度映射八方向（各方位都能走），中心留死区
  function stickTrack(e) {
    const r = stick.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    const max = r.width * 0.27;   // 摇杆可偏移半径（保证旋钮不越出底盘）
    let dx = e.clientX - cx, dy = e.clientY - cy;
    const len = Math.hypot(dx, dy);
    if (len > max) { dx = dx / len * max; dy = dy / len * max; }
    knob.style.transform = 'translate(' + dx.toFixed(1) + 'px,' + dy.toFixed(1) + 'px)';
    if (len < max * 0.34) { setStickDir(-1); return; }
    setStickDir(dirFromVec(dx, dy));
  }

  zone.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    ensureAudio();
    stickId = e.pointerId;
    try { zone.setPointerCapture(e.pointerId); } catch (err) { /* 忽略 */ }
    knob.classList.add('on');
    stick.classList.add('active');
    stickTrack(e);
  });
  zone.addEventListener('pointermove', (e) => {
    if (stickId !== e.pointerId) return;
    e.preventDefault();
    stickTrack(e);
  });
  function stickEnd(e) {
    if (stickId === null || (e && e.pointerId !== stickId)) return;
    stickId = null;
    setStickDir(-1);
    knob.style.transform = '';
    knob.classList.remove('on');
    stick.classList.remove('active');
  }
  zone.addEventListener('pointerup', stickEnd);
  zone.addEventListener('pointercancel', stickEnd);
  zone.addEventListener('lostpointercapture', stickEnd);
  zone.addEventListener('contextmenu', (e) => e.preventDefault());

  // 开火键
  fireBtn.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    ensureAudio();
    try { fireBtn.setPointerCapture(e.pointerId); } catch (err) { /* 忽略 */ }
    keys[' '] = true;
    touchKeys.add(' ');
    fireBtn.classList.add('on');
  });
  const fireUp = () => {
    keys[' '] = false;
    touchKeys.delete(' ');
    fireBtn.classList.remove('on');
  };
  fireBtn.addEventListener('pointerup', fireUp);
  fireBtn.addEventListener('pointercancel', fireUp);
  fireBtn.addEventListener('lostpointercapture', fireUp);
  fireBtn.addEventListener('contextmenu', (e) => e.preventDefault());

  // 点击画布也能开火（手机上很顺手）
  canvas.addEventListener('pointerdown', (e) => { e.preventDefault(); ensureAudio(); keys[' '] = true; });
  canvas.addEventListener('pointerup', () => { keys[' '] = false; });
  canvas.addEventListener('pointercancel', () => { keys[' '] = false; });

  // 尺寸 / 旋转
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', () => setTimeout(layout, 150));
  if (window.visualViewport) window.visualViewport.addEventListener('resize', layout);

  // 微信里提示转发
  if (/MicroMessenger/i.test(navigator.userAgent)) {
    const tip = $('wxtip');
    setTimeout(() => tip.classList.add('show'), 1400);
    setTimeout(() => tip.classList.remove('show'), 7000);
    tip.addEventListener('click', () => tip.classList.remove('show'));
  }

  // ===== 启动 =====
  applyMuteLabel();
  updateHud();
  updateCoinHud();
  bossLevel = false;
  generateMap();
  layout();
  showOverlay('title');
  setBgm('calm');
  lastTime = performance.now();
  rafId = requestAnimationFrame(tick);

  // ===== 测试钩子（仅 ?test=1 暴露，正常游玩不可见） =====
  if (urlParams.get('test') === '1') {
    window.__tbTest = {
      stat: () => ({ ...stat }),
      ach: () => [...achUnlocked],
      achNew: () => [...achNew],
      endGame: (w) => endGame(!!w),
      openReport, setBgm, showLevelIntro,
      kill: () => {
        let e = enemies.find(x => !x.dead);
        if (!e) {
          // 尚无敌人（刷兵计时未到）：合成一个，走真实击杀路径
          e = { x: 100, y: 100, size: TANK_SIZE, color: '#ff00ff', type: 'normal', hp: 1, maxHp: 1, isBoss: false, dead: false };
        }
        e.dead = true;
        onEnemyKilled(e);
        return true;
      },
      addScore: (n) => { score += n; },
      scoreNow: () => score,
      forceClear: () => {
        enemies.forEach(e => { e.dead = true; });
        enemies = [];
        enemiesSpawned = enemiesTotal;
      },
      addStat: (k, v) => { stat[k] = (stat[k] || 0) + v; },
      // —— Boss 验证用 ——
      setBossHp: (n) => { const b = enemies.find(e => e.isBoss && !e.dead); if (b) b.hp = n; },
      bossSkillNow: () => { const b = enemies.find(e => e.isBoss && !e.dead); if (b) b.skillTimer = 1; },
      bossInfo: () => {
        const b = enemies.find(e => e.isBoss && !e.dead);
        return b ? { x: b.x, y: b.y, hp: b.hp, max: b.maxHp, phase: b.phase, state: b.state, enterT: b.enterT, enterY: b.enterY } : null;
      },
      powerups: () => powerups.map(p => p.type),
      // —— 八方向验证用 ——
      state: () => ({
        player: player ? { x: player.x, y: player.y, dir: player.dir, dead: player.dead } : null,
        enemies: enemies.map(e => ({ dir: e.dir, isBoss: !!e.isBoss, x: e.x, y: e.y, hp: e.hp, phase: e.phase || 0, state: e.state || 'idle', enterT: e.enterT || 0 })),
        bullets: bullets.map(b => ({ dir: b.dir, x: b.x, y: b.y, owner: b.owner.isPlayer ? 'p' : 'e' })),
        boss: { hp: bossHp, max: bossMaxHp, deathT: bossDeathT, timeScale, whiteFlash, level, bossLevel },
        level, running, paused
      }),
      setDir: (d) => { if (player) player.dir = d; },
      fireOnce: () => { if (player) { player.cooldown = 0; fire(player); } },
      setLevel: (lv) => { level = lv; startLevel(); },
      respawn: () => { if (player) { player.dead = false; player.spawnInv = 120; } },
      tp: (x, y) => { if (player) { player.x = x; player.y = y; player.dead = false; player.spawnInv = 120; } },
      // —— 过关成长 / 每日词条验证 ——
      upgrades: () => ({ ...upgrades, upgTotal }),
      daily: () => ({ dailyMode, ...dailyMods }),
      chooseUpgrade: (id) => applyUpgrade(id),
      skipUpgrade: () => advanceLevel(),
      offerUpgrades,
      setDailyMods: (fn) => { dailyMods = { _names: [] }; fn(dailyMods); },
      // —— 地图新元素验证 ——
      mapInfo: () => {
        const barrels = [], portalTiles = [];
        for (let y = 0; y < ROWS; y++)
          for (let x = 0; x < COLS; x++) {
            if (map[y][x] === TILE_BARREL) barrels.push([x, y]);
            else if (map[y][x] === TILE_PORTAL) portalTiles.push([x, y]);
          }
        return { barrels, portals: portals.map(p => [...p]), portalTiles };
      },
      explodeAll: () => {
        for (let y = 0; y < ROWS; y++)
          for (let x = 0; x < COLS; x++)
            if (map[y][x] === TILE_BARREL) explodeBarrel(x, y);
      },
      spawnEnemyAt: (px, py, type = 'normal') => {
        const def = ENEMY_TYPES[type] || ENEMY_TYPES.normal;
        const e = { x: px, y: py, dir: 0, speed: 0, cooldown: 0, isPlayer: false,
          type, hp: def.hp, maxHp: def.hp, size: TANK_SIZE,
          color: def.color || '#ff00ff', changeTimer: 999, shootTimer: 999,
          hitFlash: 0, portalCd: 0, __test: true };
        enemies.push(e);
        return e;
      },
      testEnemies: () => enemies.filter(e => e.__test).map(e => ({ x: e.x, y: e.y, hp: e.hp, dead: e.dead, type: e.type })),
      invul: (ms = 9999) => { if (player) player.spawnInv = ms; },
      skipIntro: () => { lvIntroT = 0; lvIntroNext = false; },
      clearMap: () => { for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) map[y][x] = 0; },
      setUpgrades: (o) => { upgrades = Object.assign({}, o); },
      stopSpawn: () => { enemySpawnTimer = 999999; },
      enemyNear: (px, py, r) => enemies.find(e => !e.dead && Math.hypot(e.x + e.size / 2 - px, e.y + e.size / 2 - py) <= r) || null,
      playerPos: () => player ? { x: player.x, y: player.y, portalCd: player.portalCd } : null,
      setPlayer: (x, y) => { if (player) { player.x = x; player.y = y; } },
      // 诊断探针：玩家中心所在格是否为门格 + 手动触发一次传送
      probePortal: () => {
        const cx = player.x + player.size / 2, cy = player.y + player.size / 2;
        const gx = Math.floor(cx / TILE), gy = Math.floor(cy / TILE);
        const onPortal = inside(gx, gy) && map[gy][gx] === TILE_PORTAL;
        const before = { x: player.x, y: player.y, portalCd: player.portalCd };
        checkPortal(player);
        const after = { x: player.x, y: player.y, portalCd: player.portalCd };
        return { gx, gy, onPortal, portalsLen: portals.length, dead: player.dead, spawnInv: player.spawnInv, before, after };
      },
      // —— 金币 / 商店验证 ——
      coins: () => coins,
      setCoins: (n) => { coins = Math.max(0, n | 0); saveCoins(); updateCoinHud(); },
      addGold,
      enemyGold,
      bonus: () => ({ ...bonus }),
      skins: () => ({ owned: ownedSkins.slice(), equipped: equippedSkin }),
      setBonus: (o) => { bonus = Object.assign({ lifeup: 0, cd: 0, spd: 0, coinup: 0, shield: 0 }, o); saveBonus(); },
      setSkins: (o) => { ownedSkins = o.owned || ['classic']; equippedSkin = o.equipped || 'classic'; saveSkins(); saveSkin(); },
      buyBonus, buySkin, equipSkin, renderShop,
      shopState: () => ({ tab: shopTab, open: shopBox.classList.contains('show') }),
      setShopTab: (t) => { shopTab = t; },
      bullets: () => bullets.map(b => ({ dir: b.dir, x: b.x, y: b.y, size: b.size, pen: b.pen, bomb: b.bomb, owner: b.owner.isPlayer ? 'p' : 'e' })),
      // —— 局外养成验证 ——
      startGame: () => start(false),
      livesNow: () => lives,
      setLives: (n) => { lives = Math.max(0, n | 0); lastLives = -1; },
      hudCoins: () => elCoins ? elCoins.textContent : null,
      lsGet: (k) => localStorage.getItem(k),
      renderOnce: () => { draw(); },
    };
  }

  // ===== Service Worker：离线可玩（http/https 环境注册） =====
  if ('serviceWorker' in navigator &&
      (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => { /* 注册失败不影响游戏 */ });
    });
  }
})();
</script>
