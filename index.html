<style>

    --bg: #05050a;

    --cyan: #00f0ff;

    --hud-h: 54px;

  html, body {

    width: 100%; height: 100%;
    position: fixed; inset: 0;

    background: var(--bg);

    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;

    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image:
      linear-gradient(rgba(0, 47, 167, 0.10) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 47, 167, 0.10) 1px, transparent 1px);
    background-size: 36px 36px;
    opacity: .8;
  }

    position: fixed; left: 0; right: 0;
    top: var(--hud-h); bottom: var(--pad-h);
    display: flex; align-items: center; justify-content: center;
    padding: 0; z-index: 1;
  }

    display: block;
    border-radius: 10px;
    border: 1px solid rgba(0, 47, 167, 0.85);
    background: #030308;
    box-shadow:
      0 0 0 1px rgba(0, 240, 255, 0.08),
      0 0 26px rgba(0, 47, 167, 0.42),
      0 0 70px rgba(0, 47, 167, 0.18);
    touch-action: none;
  }

  /* ---------- 顶部 HUD ---------- */
  #hud {
    position: fixed; top: 0; left: 0; right: 0; z-index: 20;
    height: var(--hud-h);
    display: flex; align-items: center; gap: 5px;
    padding: 0 8px;
    padding-top: env(safe-area-inset-top);
    background: linear-gradient(180deg, rgba(5, 5, 10, 0.95) 40%, rgba(5, 5, 10, 0));
    pointer-events: none;
  }
  .pill {
    display: flex; align-items: baseline; gap: 4px;
    padding: 3px 8px; border-radius: 999px;
    background: rgba(0, 47, 167, 0.18);
    border: 1px solid rgba(77, 159, 255, 0.22);
    white-space: nowrap; line-height: 1;
  }
  .pill .k { font-size: 9px; letter-spacing: 1px; color: var(--muted); }
  .pill .v {
    font-size: 14px; font-weight: 800; color: #fff;
    font-variant-numeric: tabular-nums;
  }
  .pill.best .v { color: var(--cyan); }
  .pill.combo { border-color: rgba(255, 0, 255, 0.5); background: rgba(255, 0, 255, 0.12); }
  .pill.combo .v { color: var(--cyan); }
  .pill.combo.hot .v { color: var(--magenta); text-shadow: 0 0 8px rgba(255, 0, 255, 0.9); }
  #lives {
    display: flex; gap: 1px; font-size: 12px; line-height: 1;
    color: var(--green); margin-left: 2px;
  }
  #lives .off { opacity: .2; }
  .hbtns { margin-left: auto; display: flex; gap: 6px; pointer-events: auto; }
  .hbtn {
    width: 34px; height: 34px; padding: 0;
    display: grid; place-items: center;
    border-radius: 10px; font-size: 15px; line-height: 1;
    background: rgba(0, 47, 167, 0.28);
    border: 1px solid rgba(77, 159, 255, 0.35);
    color: var(--cyan);
    cursor: pointer;
    -webkit-appearance: none; appearance: none;
  }
  .hbtn:active { background: var(--klein); }

  #pad {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    height: var(--pad-h);
    display: none;
    align-items: center; justify-content: space-between;
    padding: 0 16px calc(10px + env(safe-area-inset-bottom));
    pointer-events: none;

    pointer-events: auto;
    width: 158px; height: 158px;
    display: grid; place-items: center;
    touch-action: none;
  }
  #stick {
    pointer-events: none;
    position: relative;
    width: 126px; height: 126px;
    border-radius: 50%;
    display: grid; place-items: center;
    background: radial-gradient(circle at 50% 40%,
      rgba(0, 47, 167, 0.46), rgba(0, 47, 167, 0.15) 68%, rgba(0, 240, 255, 0.06));
    border: 1px solid rgba(77, 159, 255, 0.42);
    box-shadow: inset 0 0 26px rgba(0, 240, 255, 0.12), 0 0 20px rgba(0, 47, 167, 0.45);
    touch-action: none;
    -webkit-appearance: none; appearance: none;
  }
  #stick::before {
    content: ''; position: absolute; inset: 17%;
    border-radius: 50%; border: 1px dashed rgba(77, 159, 255, 0.20);
  }
  #stick::after {
    content: ''; position: absolute; inset: 0; border-radius: 50%;

      linear-gradient(to right, transparent calc(50% - 0.5px),
        rgba(0, 240, 255, 0.10) calc(50% - 0.5px),

  #knob {

    background: radial-gradient(circle at 50% 32%, #7fb4ff, #002fa7 74%);
    border: 1px solid rgba(150, 220, 255, 0.7);
    box-shadow: 0 0 16px rgba(0, 240, 255, 0.35), inset 0 -4px 10px rgba(0, 0, 0, 0.35);
    transition: transform 0.10s ease-out, box-shadow 0.12s ease;
    will-change: transform;
  }
  #knob.on { box-shadow: 0 0 28px rgba(0, 240, 255, 0.85), inset 0 -4px 10px rgba(0, 0, 0, 0.3); }
  #tFire {
    pointer-events: auto;
    width: 86px; height: 86px; border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, 0.55);
    background: radial-gradient(circle at 50% 32%, #ff4dd2, #b80090);
    color: #fff; font-size: 15px; font-weight: 800; letter-spacing: 2px;
    box-shadow: 0 0 24px rgba(255, 0, 255, 0.45);
    touch-action: none;
    -webkit-appearance: none; appearance: none;
  }
  #tFire.on { transform: scale(0.94); box-shadow: 0 0 32px rgba(255, 0, 255, 0.8); }

    height: auto; background: none;

    padding-bottom: calc(12px + env(safe-area-inset-bottom));

  html.touch.wide #stickZone { width: 136px; height: 136px; }
  html.touch.wide #stick { width: 104px; height: 104px; opacity: 0.85; }
  html.touch.wide #knob { width: 50px; height: 50px; }
  html.touch.wide #tFire { width: 74px; height: 74px; opacity: 0.85; }

    color: var(--cyan); opacity: .9;

  #ovTitle {

  #btnPlay {

    background: linear-gradient(180deg, #0a3fd0, var(--klein));
    color: #fff; font-size: 16px; font-weight: 800; letter-spacing: 3px;
    box-shadow: 0 0 22px rgba(0, 47, 167, 0.7), 0 0 0 1px rgba(0, 240, 255, 0.18) inset;

    -webkit-appearance: none; appearance: none;

  #ovTip {
    font-size: 10px; letter-spacing: 1px; color: #4d5c7a;
    line-height: 1.8; max-width: 300px;
  }

  /* ---------- toast ---------- */
  #toast {
    position: fixed; top: calc(var(--hud-h) + 8px); left: 50%;
    transform: translateX(-50%) translateY(-6px);
    z-index: 25;
    padding: 8px 18px; border-radius: 999px;
    background: rgba(0, 47, 167, 0.92);
    border: 1px solid var(--cyan);
    color: #fff; font-size: 13px; letter-spacing: 1px;
    white-space: nowrap;
    opacity: 0; pointer-events: none;
    transition: opacity .22s ease, transform .22s ease;
    box-shadow: 0 0 18px rgba(0, 240, 255, 0.3);

  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    position: fixed; top: calc(var(--hud-h) + 12px); left: 50%;

    transition: opacity .3s ease, transform .3s ease;
    text-align: center;
  }
  #wxtip.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #wxtip b { color: var(--cyan); }

  #mark {
    position: fixed; right: 10px; bottom: 8px; z-index: 15;
    font-size: 9px; letter-spacing: 4px; color: rgba(90, 106, 138, 0.65);
    pointer-events: none;
  }
  html.touch #mark { display: none; }

  @media (max-width: 360px) {
    .pill.best { display: none; }
    #ovTitle { font-size: 28px; letter-spacing: 4px; }
  }

  function resize() {
    const r = stage.getBoundingClientRect();
    const size = Math.max(200, Math.floor(Math.min(r.width, r.height)) - 12);
    canvas.style.width = size + 'px';
    canvas.style.height = size + 'px';
    const px = Math.round(size * DPR);
    if (canvas.width !== px) { canvas.width = px; canvas.height = px; }
    renderScale = px / W;
    draw();
  }
  function layout() {
    document.documentElement.classList.toggle('wide', window.innerWidth > window.innerHeight * 1.15);
    resize();
  }

  // 本地存储：最高分 / 静音偏好
  const LS_BEST = 'tank-battle-best', LS_MUTE = 'tank-battle-muted';
  let best = 0, muted = false;
  try {
    best = parseInt(localStorage.getItem(LS_BEST) || '0', 10) || 0;
    muted = localStorage.getItem(LS_MUTE) === '1';
  } catch (e) { /* 隐私模式下 localStorage 不可用 */ }
  let bestAtStart = best;

  // ===== 状态 =====
  let map = [];
  let player = null;
  let bullets = [];
  let enemies = [];
  let particles = [];
  let texts = [];
  let powerups = [];
  let score = 0;
  let lives = 3;
  let level = 1;
  let running = false;
  let paused = false;
  let gameOver = false;
  let won = false;
  let enemySpawnTimer = 0;
  let enemiesTotal = 0;
  let enemiesSpawned = 0;
  let baseAlive = true;
  let shake = 0;
  let keys = {};
  let rafId = null;
  let lastLives = -1, lastCombo = -1;

  let bossLevel = false;           // 本关是否 Boss 关
  let bossHp = 0, bossMaxHp = 0;   // Boss 血条

  // 时间驱动（修复高刷屏速度翻倍）
  let lastTime = 0;

  // 连击 / 道具效果（秒计时）
  let combo = 0, comboTimer = 0;
  let fx = { rapid: 0, double: 0, freeze: 0 };

  // ===== 音效（Web Audio） =====
  let audioCtx = null;
  function ensureAudio() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch (e) { /* 忽略 */ }
  }
  // 微信 / iOS 需要用户手势后才能出声
  document.addEventListener('WeixinJSBridgeReady', ensureAudio, false);
  document.addEventListener('touchstart', ensureAudio, { passive: true });

  function beep(freq, dur, type = 'square', vol = 0.06) {
    if (muted) return;
    try {
      ensureAudio();
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + dur);
    } catch (e) { /* 忽略音频错误 */ }
  }
  const sfxShoot  = () => beep(880, 0.06, 'square', 0.03);
  const sfxHit    = () => beep(220, 0.08, 'sawtooth', 0.05);
  const sfxBoom   = () => { beep(120, 0.25, 'sawtooth', 0.09); beep(60, 0.3, 'sawtooth', 0.07); };
  const sfxPickup = () => { beep(660, 0.08); setTimeout(() => beep(990, 0.1), 80); };
  const sfxBoss   = () => { beep(90, 0.5, 'sawtooth', 0.12); beep(45, 0.7, 'sawtooth', 0.1); };

  // ===== 工具 =====
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const rand = (a, b) => a + Math.random() * (b - a);
  const randInt = (a, b) => Math.floor(rand(a, b + 1));
  function shade(hex, amt) {
    if (!hex) return '#888';
    const n = parseInt(hex.slice(1), 16);
    let r = (n >> 16) + amt, g = ((n >> 8) & 0xff) + amt, b = (n & 0xff) + amt;
    r = clamp(r, 0, 255); g = clamp(g, 0, 255); b = clamp(b, 0, 255);
    return `rgb(${r},${g},${b})`;
  }

  // ===== 地图 =====
  function loadPresetMap(idx) {
    const rows = PRESET_MAPS[idx % PRESET_MAPS.length];
    map = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
    for (let y = 0; y < ROWS; y++) {
      const row = rows[y] || '';
      for (let x = 0; x < COLS; x++) {
        const ch = row[x] || '.';
        map[y][x] = ch === 'B' ? TILE_BRICK
                  : ch === 'S' ? TILE_STEEL
                  : ch === 'W' ? TILE_WATER
                  : ch === 'T' ? TILE_TREE : 0;
      }
    }
    decorateMap();
  }

  function decorateMap() {
    // 四周钢墙
    for (let x = 0; x < COLS; x++) {
      map[0][x] = TILE_STEEL; map[ROWS - 1][x] = TILE_STEEL;
    }
    for (let y = 0; y < ROWS; y++) {
      map[y][0] = TILE_STEEL; map[y][COLS - 1] = TILE_STEEL;
    }
    // 基地与护墙
    map[BASE.y][BASE.x] = 0;          // 基地格本身留空：子弹能打进来，坦克靠 isBlocked 拦
    map[BASE.y - 1][BASE.x] = TILE_BRICK;
    map[BASE.y - 2][BASE.x] = TILE_BRICK;
    map[BASE.y - 1][BASE.x - 1] = TILE_BRICK;
    map[BASE.y - 1][BASE.x + 1] = TILE_BRICK;
    map[BASE.y][BASE.x - 1] = TILE_BRICK;
    map[BASE.y][BASE.x + 1] = TILE_BRICK;
    // 出生点清空（只清精确内部格，不破坏外墙与基地）
    [[1, 1], [COLS - 2, 1], [(COLS / 2) | 0, 1], [BASE.x, BASE.y + 1], [SPAWN.x, SPAWN.y]]
      .forEach(([x, y]) => { if (inside(x, y)) map[y][x] = 0; });
  }

  function generateMap() {
    if (bossLevel) loadPresetMap(PRESET_MAPS.length - 1);   // Boss 场
    else loadPresetMap((level - 1) % (PRESET_MAPS.length - 1));
  }

  function inside(x, y) { return x >= 0 && y >= 0 && x < COLS && y < ROWS; }

  // 判断某像素区域是否可通行
  function isBlocked(px, py, size, isBullet = false) {
    const x0 = Math.floor(px / TILE), x1 = Math.floor((px + size - 0.01) / TILE);
    const y0 = Math.floor(py / TILE), y1 = Math.floor((py + size - 0.01) / TILE);
    for (let y = y0; y <= y1; y++)
      for (let x = x0; x <= x1; x++) {
        if (!inside(x, y)) return true;
        const t = map[y][x];
        if (isBullet) {
          if (t === TILE_STEEL || t === TILE_BRICK) return true;
          if (t === TILE_WATER) return false; // 子弹可越过水
        } else {
          if (t === TILE_BRICK || t === TILE_STEEL || t === TILE_WATER) return true;
          if (x === BASE.x && y === BASE.y) return true;  // 基地格坦克不可驶入
        }
      }
    return false;
  }

  // 子弹击中砖块：摧毁命中的那一格
  function damageTile(px, py) {
    const x = Math.floor(px / TILE), y = Math.floor(py / TILE);
    if (inside(x, y) && map[y][x] === TILE_BRICK) {
      map[y][x] = 0;
      spawnParticles(x * TILE + TILE / 2, y * TILE + TILE / 2, '#ff00ff', 6);
      return true;
    }
    return false;
  }

  // ===== 粒子 / 飘分 =====
  function spawnParticles(x, y, color, n = 8) {
    for (let i = 0; i < n; i++) {
      particles.push({
        x, y,
        vx: rand(-2.5, 2.5), vy: rand(-2.5, 2.5),
        life: rand(0.3, 0.6), max: 0.6, color,
        size: rand(1.5, 3.5)
      });
    }
  }

  function addText(x, y, str, color = '#00f0ff') {
    texts.push({ x, y, str, color, life: 0.9, max: 0.9 });
  }

  // ===== 坦克 =====
  function makePlayer() {
    return {
      x: SPAWN.x * TILE + (TILE - TANK_SIZE) / 2,
      y: SPAWN.y * TILE + (TILE - TANK_SIZE) / 2,
      dir: DIR.UP, speed: PLAYER_SPEED,
      cooldown: 0, isPlayer: true, color: '#002FA7',
      size: TANK_SIZE, spawnInv: 0, hitFlash: 0
    };
  }

  function levelSpeedMul() { return Math.min(1 + (level - 1) * 0.06, 1.6); }

  function pickEnemyType() {
    const r = Math.random();
    if (level >= 7) {
      if (r < 0.10) return 'elite';
      if (r < 0.30) return 'armored';
      if (r < 0.55) return 'fast';
      return 'normal';
    }
    if (level >= 5) {
      if (r < 0.18) return 'armored';
      if (r < 0.42) return 'fast';
      return 'normal';
    }
    if (level >= 3) {
      if (r < 0.25) return 'fast';
      return 'normal';
    }
    return 'normal';
  }

  function pickEnemyColor() {
    const c = ['#ff00ff', '#00f0ff', '#39ff14', '#ff2d55', '#4d9fff'];
    return c[randInt(0, c.length - 1)];
  }

  function spawnEnemy(x, y, type) {
    const def = ENEMY_TYPES[type];
    enemies.push({
      x, y, dir: DIR.DOWN,
      speed: def.speed * levelSpeedMul(),
      cooldown: 0, isPlayer: false,
      type, hp: def.hp, maxHp: def.hp, size: TANK_SIZE,
      color: def.color || pickEnemyColor(),
      changeTimer: randInt(60, 160), shootTimer: randInt(40, 140),
      hitFlash: 0
    });
  }

  function spawnBoss() {
    bossMaxHp = 10 + level;
    bossHp = bossMaxHp;
    enemies.push({
      x: W / 2 - BOSS_SIZE / 2,
      y: 3 * TILE,
      dir: DIR.DOWN, speed: 0.7,
      cooldown: 0, isPlayer: false, isBoss: true,
      type: 'boss', hp: bossMaxHp, maxHp: bossMaxHp,
      size: BOSS_SIZE, color: '#ff2d55',
      changeTimer: 90, shootTimer: 70, hitFlash: 0
    });
    sfxBoss();
    showToast('⚠ BOSS 出现！');
  }

  const spawnPoints = [
    [1 * TILE, 1 * TILE],
    [(COLS - 2) * TILE, 1 * TILE],
    [(COLS / 2 | 0) * TILE, 1 * TILE]
  ];

  // ===== 子弹 =====
  function fire(tank) {
    if (tank.cooldown > 0) return;
    const isP = tank.isPlayer;
    const rapid = isP && fx.rapid > 0;
    tank.cooldown = isP ? (rapid ? 7 : 14) : (tank.isBoss ? 50 : 40);
    const cx = tank.x + tank.size / 2;
    const cy = tank.y + tank.size / 2;
    const shoot = (ox, oy) => {
      bullets.push({ x: ox - 2, y: oy - 2, size: 4, dir: tank.dir, speed: BULLET_SPEED, owner: tank });
    };
    if (isP && fx.double > 0) {
      if (tank.dir === DIR.UP || tank.dir === DIR.DOWN) { shoot(cx - 6, cy); shoot(cx + 6, cy); }
      else { shoot(cx, cy - 6); shoot(cx, cy + 6); }
    } else {
      shoot(cx, cy);
    }
    if (isP) sfxShoot();
    else beep(500, 0.05, 'square', 0.02);
  }

  function bossFire(e) {
    const cx = e.x + e.size / 2, cy = e.y + e.size / 2;
    const vertical = (e.dir === DIR.UP || e.dir === DIR.DOWN);
    for (const off of [-10, 0, 10]) {
      const ox = vertical ? cx + off : cx;
      const oy = vertical ? cy : cy + off;
      bullets.push({ x: ox - 2, y: oy - 2, size: 5, dir: e.dir, speed: BULLET_SPEED * 0.9, owner: e });
    }
    beep(300, 0.1, 'sawtooth', 0.04);
  }

  // ===== 敌人 AI =====
  function updateEnemy(e, k) {
    if (fx.freeze > 0) return;              // 冻结：不动不射
    if (e.isBoss) { updateBoss(e, k); return; }

    if ((e.changeTimer -= k) <= 0) {
      e.changeTimer = randInt(50, 170);
      if (Math.random() < 0.75) e.dir = randInt(0, 3);
    }
    const shootMin = Math.max(22, 60 - level * 4);
    const shootMax = Math.max(80, 150 - level * 6);
    if ((e.shootTimer -= k) <= 0) {
      e.shootTimer = randInt(shootMin, shootMax);
      fire(e);
    }
    // 偶尔锁定玩家或基地
    const r = Math.random();
    let tx = null, ty = null;
    if (player && !player.dead && r < 0.025) { tx = player.x; ty = player.y; }
    else if (baseAlive && r >= 0.025 && r < 0.05) { tx = BASE.x * TILE; ty = BASE.y * TILE; }
    if (tx !== null) {
      const dx = tx - e.x, dy = ty - e.y;
      if (Math.abs(dx) > Math.abs(dy)) e.dir = dx > 0 ? DIR.RIGHT : DIR.LEFT;
      else e.dir = dy > 0 ? DIR.DOWN : DIR.UP;
    }

    const nx = e.x + DX[e.dir] * e.speed * k;
    const ny = e.y + DY[e.dir] * e.speed * k;
    if (!isBlocked(nx, ny, e.size) && !tankHitsTank(nx, ny, e.size, e)) {
      e.x = nx; e.y = ny;
    } else {
      e.changeTimer = Math.min(e.changeTimer, 20);
      e.dir = pickFreeDir(e);
    }
  }

  function updateBoss(e, k) {
    // 缓慢追踪玩家
    if (player && !player.dead) {
      const dx = (player.x + TANK_SIZE / 2) - (e.x + e.size / 2);
      const dy = (player.y + TANK_SIZE / 2) - (e.y + e.size / 2);
      if (Math.abs(dx) > Math.abs(dy)) e.dir = dx > 0 ? DIR.RIGHT : DIR.LEFT;
      else e.dir = dy > 0 ? DIR.DOWN : DIR.UP;
    }
    const nx = e.x + DX[e.dir] * e.speed * k;
    const ny = e.y + DY[e.dir] * e.speed * k;
    if (!isBlocked(nx, ny, e.size) && !tankHitsTank(nx, ny, e.size, e)) {
      e.x = nx; e.y = ny;
    } else {
      e.dir = pickFreeDir(e);
    }
    if ((e.shootTimer -= k) <= 0) {
      e.shootTimer = Math.max(40, 70 - level * 2);
      bossFire(e);
    }
  }

  function pickFreeDir(e) {
    const free = [0, 1, 2, 3].filter(d =>
      !isBlocked(e.x + DX[d] * TILE, e.y + DY[d] * TILE, e.size) &&
      !tankHitsTank(e.x + DX[d] * TILE, e.y + DY[d] * TILE, e.size, e));
    return free.length ? free[randInt(0, free.length - 1)] : randInt(0, 3);
  }

  function tankHitsTank(nx, ny, size, self) {
    const tanks = self.isPlayer ? enemies : enemies.concat(player && !player.dead ? [player] : []);
    for (const t of tanks) {
      if (t === self || t.dead) continue;
      if (nx < t.x + t.size && nx + size > t.x && ny < t.y + t.size && ny + size > t.y) return true;
    }
    return false;
  }

  // ===== 子弹更新 =====
  function updateBullet(b, k) {
    const dist = b.speed * k;
    const steps = Math.max(1, Math.ceil(dist));
    const stepLen = dist / steps;
    for (let s = 0; s < steps; s++) {
      b.x += DX[b.dir] * stepLen;
      b.y += DY[b.dir] * stepLen;
      const cx = b.x + b.size / 2, cy = b.y + b.size / 2;

      if (b.x < 0 || b.y < 0 || b.x + b.size > W || b.y + b.size > H) { b.dead = true; return; }
      if (isBlocked(b.x, b.y, b.size, true)) {
        damageTile(cx, cy);
        if (b.dir === DIR.UP) damageTile(cx, b.y);
        else if (b.dir === DIR.DOWN) damageTile(cx, b.y + b.size);
        else if (b.dir === DIR.LEFT) damageTile(b.x, cy);
        else damageTile(b.x + b.size, cy);
        b.dead = true; sfxHit(); return;
      }
      // 基地
      if (baseAlive) {
        const bx = BASE.x * TILE, by = BASE.y * TILE;
        if (cx >= bx && cx <= bx + TILE && cy >= by && cy <= by + TILE) {
          baseAlive = false;
          b.dead = true; sfxBoom();
          spawnParticles(bx + TILE / 2, by + TILE / 2, '#ff2d55', 20);
          shake = 12;
          return;
        }
      }
      // 命中坦克
      if (b.owner.isPlayer) {
        for (const e of enemies) {
          if (e.dead) continue;
          if (cx >= e.x && cx <= e.x + e.size && cy >= e.y && cy <= e.y + e.size) {
            b.dead = true;
            e.hp--; e.hitFlash = 6;
            if (e.hp <= 0) { e.dead = true; onEnemyKilled(e); }
            else { sfxHit(); spawnParticles(cx, cy, e.color, 6); }
            return;
          }
        }
      } else if (player && !player.dead && !(player.spawnInv > 0)) {
        if (cx >= player.x && cx <= player.x + TANK_SIZE && cy >= player.y && cy <= player.y + TANK_SIZE) {
          b.dead = true; killPlayer(); return;
        }
      }
      // 子弹互撞
      for (const o of bullets) {
        if (o === b || o.dead || o.owner.isPlayer === b.owner.isPlayer) continue;
        if (cx >= o.x && cx <= o.x + o.size && cy >= o.y && cy <= o.y + o.size) {
          b.dead = true; o.dead = true; return;
        }
      }
    }
  }

  // ===== 玩家 =====
  function updatePlayer(k) {
    if (!player || player.dead) return;
    if (player.cooldown > 0) player.cooldown -= k;
    let mx = 0, my = 0;
    if (keys['ArrowUp'] || keys['w'] || keys['W']) my = -1;
    else if (keys['ArrowDown'] || keys['s'] || keys['S']) my = 1;
    else if (keys['ArrowLeft'] || keys['a'] || keys['A']) mx = -1;
    else if (keys['ArrowRight'] || keys['d'] || keys['D']) mx = 1;

    if (mx !== 0 || my !== 0) {
      player.dir = mx !== 0 ? (mx > 0 ? DIR.RIGHT : DIR.LEFT) : (my > 0 ? DIR.DOWN : DIR.UP);
      const step = player.speed * k;
      const nx = player.x + mx * step;
      const ny = player.y + my * step;
      if (mx !== 0 && !isBlocked(nx, player.y, TANK_SIZE) && !tankHitsTank(nx, player.y, TANK_SIZE, player))
        player.x = nx;
      if (my !== 0 && !isBlocked(player.x, ny, TANK_SIZE) && !tankHitsTank(player.x, ny, TANK_SIZE, player))
        player.y = ny;
      clampPlayer();
    }
    if (keys[' '] || keys['Space'] || keys['j'] || keys['J']) fire(player);
  }

  function clampPlayer() {
    player.x = clamp(player.x, TILE, W - TILE - TANK_SIZE);
    player.y = clamp(player.y, TILE, H - TILE - TANK_SIZE);
  }

  function killPlayer() {
    if (!player || player.dead) return;
    player.dead = true;
    sfxBoom();
    spawnParticles(player.x + TANK_SIZE / 2, player.y + TANK_SIZE / 2, player.color, 18);
    shake = 10;
    lives--;
    updateHud();
    setTimeout(() => {
      if (!running || gameOver) return;
      if (player && !player.dead) return;  // 已重生
      if (lives > 0) {
        player = makePlayer();
        player.spawnInv = 120;
        updateHud();
      } else {
        endGame(false);
      }
    }, 700);
  }

  function onEnemyKilled(e) {
    sfxBoom();
    spawnParticles(e.x + e.size / 2, e.y + e.size / 2, e.color, e.isBoss ? 48 : 16);
    shake = e.isBoss ? 16 : 6;
    addKillScore(e);
    maybeDropPowerup(e.x + e.size / 2, e.y + e.size / 2, e.isBoss);
    if (e.isBoss) { bossHp = 0; showToast('💥 BOSS 击破！'); }
  }

  function addKillScore(e) {
    combo++;
    comboTimer = 5;
    const baseScore = e.isBoss ? 1000 * level : ENEMY_TYPES[e.type].score;
    const mult = 1 + (combo - 1) * 0.1;
    const gain = Math.round(baseScore * mult / 10) * 10;
    score += gain;
    addText(e.x + e.size / 2, e.y - 4, '+' + gain, combo >= 3 ? '#ff00ff' : '#00f0ff');
    if (combo >= 3) addText(e.x + e.size / 2, e.y - 24, combo + ' 连击', '#ffe600');
  }

  // ===== 道具 =====
  function maybeDropPowerup(x, y, isBoss) {
    if (isBoss) {
      spawnPowerup(x - 20, y); spawnPowerup(x, y); spawnPowerup(x + 20, y);
    } else if (Math.random() < 0.15) {
      spawnPowerup(x, y);
    }
  }

  function spawnPowerup(x, y) {
    const type = POWERUP_LIST[randInt(0, POWERUP_LIST.length - 1)];
    powerups.push({
      x: clamp(x - 8, TILE, W - TILE - 16),
      y: clamp(y - 8, TILE, H - TILE - 16),
      type, life: 12, bob: rand(0, Math.PI * 2), dead: false
    });
  }

  function updatePowerups(dt) {
    for (const p of powerups) {
      if (p.dead) continue;
      p.life -= dt;
      p.bob += dt * 4;
      if (player && !player.dead) {
        const pcx = player.x + TANK_SIZE / 2, pcy = player.y + TANK_SIZE / 2;
        const dx = pcx - (p.x + 8), dy = pcy - (p.y + 8);
        if (dx * dx + dy * dy < 24 * 24) { applyPowerup(p.type); p.dead = true; }
      }
      if (p.life <= 0) p.dead = true;
    }
    powerups = powerups.filter(p => !p.dead);
  }

  function applyPowerup(type) {
    sfxPickup();
    const def = POWERUP_DEF[type];
    if (player) addText(player.x + TANK_SIZE / 2, player.y - 6, def.label, def.color);
    switch (type) {
      case 'shield': player.spawnInv = Math.max(player.spawnInv || 0, 180); break;
      case 'rapid':  fx.rapid = 8; break;
      case 'double': fx.double = 10; break;
      case 'life':   lives = Math.min(lives + 1, 5); lastLives = -1; break;
      case 'freeze': fx.freeze = 5; break;
      case 'bomb':   bombEnemies(); break;
    }
    showToast('获得 ' + def.label + '！');
  }

  function bombEnemies() {
    shake = 14; sfxBoom();
    for (const e of enemies) {
      if (e.dead) continue;
      if (e.isBoss) {
        e.hp -= 4; e.hitFlash = 6;
        if (e.hp <= 0) { e.dead = true; onEnemyKilled(e); }
        else spawnParticles(e.x + e.size / 2, e.y + e.size / 2, '#ff9f43', 12);
      } else {
        e.dead = true;
        spawnParticles(e.x + TANK_SIZE / 2, e.y + TANK_SIZE / 2, '#ff9f43', 12);
        score += 50;
      }
    }
  }

  // ===== 关卡 / 敌人生成 =====
  function startLevel() {
    bossLevel = (level % 5 === 0);
    enemiesSpawned = 0;
    enemiesTotal = bossLevel ? 1 : (6 + level * 2);
    enemySpawnTimer = bossLevel ? 40 : 60;
    bullets = []; enemies = []; particles = []; texts = []; powerups = [];
    baseAlive = true;
    fx = { rapid: 0, double: 0, freeze: 0 };
    combo = 0; comboTimer = 0;
    bossHp = 0; bossMaxHp = 0;
    generateMap();
    if (lives > 0 && (!player || player.dead)) {
      player = makePlayer();
      player.spawnInv = 120;
    }
    if (player) {
      player.x = SPAWN.x * TILE + (TILE - TANK_SIZE) / 2;
      player.y = SPAWN.y * TILE + (TILE - TANK_SIZE) / 2;
      player.dir = DIR.UP;
    }
    lastLives = -1; lastCombo = -1;
    updateHud();
  }

  function updateSpawning(k) {
    if (enemiesSpawned >= enemiesTotal) return;
    if (bossLevel) {
      if ((enemySpawnTimer -= k) <= 0) { spawnBoss(); enemiesSpawned = 1; }
      return;
    }
    if ((enemySpawnTimer -= k) > 0) return;
    enemySpawnTimer = 90;
    const pt = spawnPoints[randInt(0, 2)];
    if (!enemies.some(e => !e.dead && Math.abs(e.x - pt[0]) < TILE && Math.abs(e.y - pt[1]) < TILE)) {
      spawnEnemy(pt[0], pt[1], pickEnemyType());
      enemiesSpawned++;
    }
  }

  // ===== 主循环（deltaTime 驱动） =====
  function tick(now) {
    rafId = requestAnimationFrame(tick);
    let dt = (now - lastTime) / 1000;
    lastTime = now;
    if (!isFinite(dt) || dt <= 0) dt = 1 / 60;
    if (dt > 0.05) dt = 0.05;      // 切窗恢复后限制单帧步长
    const k = dt * 60;             // 以 60fps 为基准的系数

    if (!running || paused) { draw(); return; }

    // 道具效果 / 连击计时（秒）
    if (fx.rapid > 0) fx.rapid -= dt;
    if (fx.double > 0) fx.double -= dt;
    if (fx.freeze > 0) fx.freeze -= dt;
    if (comboTimer > 0) { comboTimer -= dt; if (comboTimer <= 0) combo = 0; }

    updatePlayer(k);
    enemies.forEach(e => updateEnemy(e, k));
    bullets.forEach(b => updateBullet(b, k));
    updatePowerups(dt);

    bullets = bullets.filter(b => !b.dead);
    enemies = enemies.filter(e => !e.dead);

    updateSpawning(k);

    // 玩家与敌人碰撞
    if (player && !player.dead) {
      for (const e of enemies) {
        if (e.dead) continue;
        const r = TANK_SIZE - 1;
        if (player.x < e.x + e.size - 1 && player.x + r > e.x && player.y < e.y + e.size - 1 && player.y + r > e.y) {
          const dx = player.x - e.x, dy = player.y - e.y;
          const len = Math.hypot(dx, dy) || 1;
          const push = 0.5 * k;
          player.x += dx / len * push; player.y += dy / len * push;
          e.x -= dx / len * push; e.y -= dy / len * push;
          clampPlayer();
          e.changeTimer = Math.min(e.changeTimer, 10);
        }
      }
    }

    if (!baseAlive) { endGame(false); return; }

    // 敌人全灭 → 下一关（含过关奖励）
    if (running && enemies.length === 0 && enemiesSpawned >= enemiesTotal) {
      const bonus = 1000 + level * 200;
      score += bonus;
      addText(W / 2, H / 2 - 30, '+' + bonus, '#39ff14');
      showToast('🎉 第 ' + level + ' 关完成 · 奖励 +' + bonus);
      level++;
      startLevel();
      sfxPickup();
      return;
    }

    particles.forEach(p => { p.x += p.vx * k; p.y += p.vy * k; p.life -= dt; });
    particles = particles.filter(p => p.life > 0);

    texts.forEach(t => { t.y -= 0.55 * k; t.life -= dt; });
    texts = texts.filter(t => t.life > 0);

    if (player && player.spawnInv > 0) player.spawnInv -= k;
    if (shake > 0) shake -= k;
    enemies.forEach(e => { if (e.hitFlash > 0) e.hitFlash -= k; });
    if (player && player.hitFlash > 0) player.hitFlash -= k;

    // 同步 Boss 血条
    const boss = enemies.find(e => e.isBoss && !e.dead);
    bossHp = boss ? boss.hp : 0;

    updateHud();
    draw();
  }

  // ===== HUD =====
  function updateHud() {
    if (score > best) {
      best = score;
      try { localStorage.setItem(LS_BEST, String(best)); } catch (e) { /* 忽略 */ }
    }
    elScore.textContent = score;
    elBest.textContent = best;
    elLevel.textContent = level;
    elRemaining.textContent = Math.max(0, enemiesTotal - enemiesSpawned + enemies.length);
    if (lives !== lastLives) {
      lastLives = lives;
      let html = '';
      const slots = Math.max(3, lives);
      for (let i = 0; i < slots; i++) html += `<span class="${i < lives ? '' : 'off'}">▲</span>`;
      elLives.innerHTML = html;
    }
    if (combo !== lastCombo) {
      lastCombo = combo;
      if (combo >= 2) {
        elComboWrap.style.display = '';
        elCombo.textContent = '×' + combo;
        elComboWrap.classList.toggle('hot', combo >= 3);
      } else {
        elComboWrap.style.display = 'none';
      }
    }
  }

  // ===== 渲染 =====
  function draw() {
    if (!map.length) return;
    ctx.setTransform(renderScale, 0, 0, renderScale, 0, 0);
    ctx.save();
    if (shake > 0) ctx.translate(rand(-shake, shake) * 0.5, rand(-shake, shake) * 0.5);

    // 背景 + 赛博网格
    ctx.fillStyle = '#030308';
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(0, 47, 167, 0.12)';
    ctx.lineWidth = 1;
    for (let i = 0; i <= W; i += TILE) {
      ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, H); ctx.stroke();
    }
    for (let i = 0; i <= H; i += TILE) {
      ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(W, i); ctx.stroke();
    }

    // 地块
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        const t = map[y][x];
        const px = x * TILE, py = y * TILE;
        if (t === TILE_BRICK) drawBrick(px, py);
        else if (t === TILE_STEEL) drawSteel(px, py);
        else if (t === TILE_WATER) drawWater(px, py);
      }
    }

    drawBase();

    // 子弹（霓虹辉光）
    for (const b of bullets) {
      if (b.owner.isPlayer) {
        ctx.shadowColor = '#00f0ff'; ctx.shadowBlur = 8; ctx.fillStyle = '#00f0ff';
      } else {
        ctx.shadowColor = b.owner.isBoss ? '#ff2d55' : '#ff00ff';
        ctx.shadowBlur = b.owner.isBoss ? 10 : 6;
        ctx.fillStyle = b.owner.isBoss ? '#ff2d55' : '#ff00ff';
      }
      ctx.fillRect(b.x, b.y, b.size, b.size);
      ctx.shadowBlur = 0;
    }

    // 敌人
    for (const e of enemies) drawTank(e);

    // 玩家（无敌闪烁）
    if (player && !player.dead) {
      if (player.spawnInv > 0 && Math.floor(player.spawnInv / 4) % 2 === 0) {
        // 闪烁隐藏
      } else drawTank(player);
    }

    // 草丛（覆盖上层）
    for (let y = 0; y < ROWS; y++)
      for (let x = 0; x < COLS; x++)
        if (map[y][x] === TILE_TREE) drawTree(x * TILE, y * TILE);

    // 道具
    for (const p of powerups) drawPowerup(p);

    // 粒子
    for (const p of particles) {
      ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
    ctx.globalAlpha = 1;

    // 飘分
    if (texts.length) {
      ctx.font = '700 13px "Segoe UI", sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      for (const t of texts) {
        ctx.globalAlpha = clamp(t.life / t.max, 0, 1);
        ctx.fillStyle = t.color;
        ctx.fillText(t.str, t.x, t.y);
      }
      ctx.globalAlpha = 1;
    }

    ctx.restore();

    // Boss 血条
    if (bossHp > 0 && bossMaxHp > 0) {
      const bw = 300, bh = 10, bx = (W - bw) / 2, by = 8;
      ctx.fillStyle = 'rgba(3,3,8,0.85)';
      ctx.fillRect(bx - 3, by - 3, bw + 6, bh + 6);
      ctx.fillStyle = 'rgba(255,45,85,0.2)';
      ctx.fillRect(bx, by, bw, bh);
      const ratio = clamp(bossHp / bossMaxHp, 0, 1);
      ctx.fillStyle = '#ff2d55';
      ctx.shadowColor = '#ff2d55'; ctx.shadowBlur = 10;
      ctx.fillRect(bx, by, bw * ratio, bh);
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#fff';
      ctx.font = '700 10px "Consolas", monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.fillText('BOSS  ' + bossHp + ' / ' + bossMaxHp, W / 2, by + bh + 6);
    }

    // 道具效果状态（左下）
    let ex = 8;
    const ey = H - 20;
    const showFx = (label, t, color) => {
      if (t <= 0) return;
      ctx.fillStyle = color;
      ctx.globalAlpha = 0.85;
      ctx.fillRect(ex, ey, 58, 13);
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#030308';
      ctx.font = '700 9px "Consolas", monospace';
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillText(label + ' ' + t.toFixed(1) + 's', ex + 4, ey + 7);
      ex += 64;
    };
    showFx('护盾', (player && player.spawnInv > 0) ? player.spawnInv / 60 : 0, '#00f0ff');
    showFx('快速', fx.rapid, '#ffe600');
    showFx('双管', fx.double, '#ff00ff');
    showFx('冻结', fx.freeze, '#4d9fff');
  }

  function drawBrick(px, py) {
    ctx.fillStyle = '#2a1520';
    ctx.fillRect(px, py, TILE, TILE);
    ctx.strokeStyle = '#1a0a12';
    ctx.lineWidth = 1;
    ctx.strokeRect(px + 0.5, py + 0.5, TILE - 1, TILE - 1);
    ctx.fillStyle = '#3a2030';
    ctx.fillRect(px, py + 7, TILE, 2);
    ctx.fillRect(px, py + 15, TILE, 2);
    ctx.fillRect(px + 5, py, 2, 7);
    ctx.fillRect(px + 17, py, 2, 7);
    ctx.fillRect(px + 11, py + 9, 2, 6);
    ctx.fillRect(px + 23, py + 9, 2, 6);
    ctx.fillRect(px + 5, py + 17, 2, 7);
    ctx.fillRect(px + 17, py + 17, 2, 7);
  }

  function drawSteel(px, py) {
    ctx.fillStyle = '#1a2030';
    ctx.fillRect(px, py, TILE, TILE);
    ctx.fillStyle = '#2a3548';
    ctx.fillRect(px + 3, py + 3, TILE - 6, TILE - 6);
    ctx.fillStyle = '#3a4860';
    ctx.fillRect(px + 8, py + 8, TILE - 16, TILE - 16);
    ctx.fillStyle = 'rgba(0, 240, 255, 0.12)';
    ctx.fillRect(px + 8, py + 8, TILE - 16, 2);
  }

  function drawWater(px, py) {
    ctx.fillStyle = '#0a1530';
    ctx.fillRect(px, py, TILE, TILE);
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.35)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(px + 2, py + 8); ctx.lineTo(px + 12, py + 8);
    ctx.moveTo(px + 14, py + 16); ctx.lineTo(px + 22, py + 16);
    ctx.stroke();
  }

  function drawTree(px, py) {
    ctx.fillStyle = 'rgba(10, 30, 20, 0.85)';
    ctx.fillRect(px, py, TILE, TILE);
    ctx.fillStyle = '#1a4020';
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.arc(px + 6 + i * 7, py + 8, 6, 0, Math.PI * 2);
      ctx.arc(px + 10 + i * 7, py + 15, 6, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = 'rgba(57, 255, 20, 0.4)';
    ctx.fillRect(px + 4, py + 4, 2, 2);
    ctx.fillRect(px + 18, py + 14, 2, 2);
  }

  function drawBase() {
    const px = BASE.x * TILE, py = BASE.y * TILE;
    if (baseAlive) {
      ctx.fillStyle = '#0a1040';
      ctx.fillRect(px + 2, py + 2, TILE - 4, TILE - 4);
      ctx.strokeStyle = '#002FA7';
      ctx.lineWidth = 2;
      ctx.strokeRect(px + 2, py + 2, TILE - 4, TILE - 4);
      ctx.fillStyle = '#00f0ff';
      ctx.font = '700 8px "Consolas", monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('Q', px + TILE / 2, py + TILE / 2);
      ctx.shadowColor = '#00f0ff'; ctx.shadowBlur = 6;
      ctx.fillText('Q', px + TILE / 2, py + TILE / 2);
      ctx.shadowBlur = 0;
    } else {
      ctx.fillStyle = '#1a0505';
      ctx.fillRect(px + 2, py + 2, TILE - 4, TILE - 4);
      ctx.strokeStyle = '#ff2d55';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(px + 6, py + 6); ctx.lineTo(px + TILE - 6, py + TILE - 6);
      ctx.moveTo(px + TILE - 6, py + 6); ctx.lineTo(px + 6, py + TILE - 6);
      ctx.stroke();
    }
  }

  function drawPowerup(p) {
    const size = 16;
    // 快消失时闪烁
    if (p.life < 3 && Math.floor(p.life * 6) % 2 === 0) return;
    const x = p.x, y = p.y + Math.sin(p.bob) * 2;
    const def = POWERUP_DEF[p.type];
    ctx.save();
    ctx.shadowColor = def.color; ctx.shadowBlur = 10;
    ctx.fillStyle = '#05050a';
    ctx.fillRect(x, y, size, size);
    ctx.strokeStyle = def.color; ctx.lineWidth = 2;
    ctx.strokeRect(x + 0.5, y + 0.5, size - 1, size - 1);
    drawPowerupIcon(p.type, x + size / 2, y + size / 2, def.color);
    ctx.restore();
  }

  function drawPowerupIcon(type, cx, cy, color) {
    const s = 4;
    ctx.fillStyle = color;
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.5;
    if (type === 'shield') {
      ctx.beginPath();
      ctx.moveTo(cx, cy - s - 1);
      ctx.lineTo(cx + s, cy - s + 2);
      ctx.lineTo(cx + s, cy + 1);
      ctx.quadraticCurveTo(cx + s, cy + s, cx, cy + s + 1);
      ctx.quadraticCurveTo(cx - s, cy + s, cx - s, cy + 1);
      ctx.lineTo(cx - s, cy - s + 2);
      ctx.closePath();
      ctx.fill();
    } else if (type === 'rapid') {
      ctx.beginPath();
      ctx.moveTo(cx + 1, cy - s - 1);
      ctx.lineTo(cx - 2, cy);
      ctx.lineTo(cx + 0.5, cy);
      ctx.lineTo(cx - 1, cy + s + 1);
      ctx.lineTo(cx + 2.5, cy - 1);
      ctx.lineTo(cx, cy - 1);
      ctx.closePath();
      ctx.fill();
    } else if (type === 'double') {
      ctx.fillRect(cx - 3.5, cy - s, 2.5, s * 2);
      ctx.fillRect(cx + 1, cy - s, 2.5, s * 2);
    } else if (type === 'life') {
      ctx.fillRect(cx - 1.5, cy - s, 3, s * 2);
      ctx.fillRect(cx - s, cy - 1.5, s * 2, 3);
    } else if (type === 'freeze') {
      for (let i = 0; i < 3; i++) {
        const a = i * Math.PI / 3;
        ctx.beginPath();
        ctx.moveTo(cx - Math.cos(a) * s, cy - Math.sin(a) * s);
        ctx.lineTo(cx + Math.cos(a) * s, cy + Math.sin(a) * s);
        ctx.stroke();
      }
    } else if (type === 'bomb') {
      ctx.beginPath();
      ctx.arc(cx, cy + 1, s - 1, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(cx + 1, cy - s + 1);
      ctx.lineTo(cx + 3, cy - s - 2);
      ctx.stroke();
    }
  }

  function drawTank(t) {
    const s = t.size;
    const scale = s / TANK_SIZE;
    const cx = t.x + s / 2, cy = t.y + s / 2;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(t.dir * Math.PI / 2);
    ctx.scale(scale, scale);

    const isPlayer = t.isPlayer;
    const flashing = t.hitFlash > 0;

    if (isPlayer) { ctx.shadowColor = '#00f0ff'; ctx.shadowBlur = 10; }
    else if (t.isBoss) { ctx.shadowColor = '#ff2d55'; ctx.shadowBlur = 18; }
    else { ctx.shadowColor = t.color; ctx.shadowBlur = 8; }

    const bodyColor = flashing ? '#ffffff' : t.color;

    // 履带
    ctx.fillStyle = isPlayer ? '#0a1040' : (t.isBoss ? '#2a0810' : '#1a1020');
    ctx.fillRect(-11, -10, 5, 20);
    ctx.fillRect(6, -10, 5, 20);
    ctx.fillStyle = isPlayer ? '#3355cc' : (t.isBoss ? '#ff2d55' : '#2a2035');
    ctx.fillRect(-11, -8, 5, 3);
    ctx.fillRect(-11, -3, 5, 3);
    ctx.fillRect(-11, 2, 5, 3);
    ctx.fillRect(-11, 7, 5, 3);
    ctx.fillRect(6, -8, 5, 3);
    ctx.fillRect(6, -3, 5, 3);
    ctx.fillRect(6, 2, 5, 3);
    ctx.fillRect(6, 7, 5, 3);

    // 车身
    ctx.fillStyle = bodyColor;
    ctx.fillRect(-6, -8, 12, 16);
    // 炮塔
    ctx.fillStyle = flashing ? '#dddddd' : shade(t.color, isPlayer ? 30 : -25);
    ctx.fillRect(-4, -4, 8, 8);
    // 炮管
    ctx.fillStyle = isPlayer ? '#00f0ff' : (t.isBoss ? '#ffaa00' : '#2a2035');
    ctx.fillRect(-2, -16, 4, 10);

    // 装甲/精英额外标记
    if (t.type === 'armored') {
      ctx.strokeStyle = 'rgba(200,220,255,0.7)';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(-7, -9, 14, 18);
    }
    if (t.type === 'elite' || t.isBoss) {
      ctx.strokeStyle = t.isBoss ? 'rgba(255,45,85,0.55)' : 'rgba(255,0,255,0.45)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(0, 0, 13, 0, Math.PI * 2);
      ctx.stroke();
    }

    ctx.shadowBlur = 0;
    ctx.restore();

    // 多血敌人：头顶血点（Boss 用顶部血条）
    if (!isPlayer && !t.isBoss && t.maxHp > 1) {
      const dots = t.maxHp;
      const dw = 4, gap = 2;
      const totalW = dots * dw + (dots - 1) * gap;
      let dx = t.x + s / 2 - totalW / 2;
      const dy = t.y - 5;
      for (let i = 0; i < dots; i++) {
        ctx.fillStyle = i < t.hp ? t.color : 'rgba(255,255,255,0.15)';
        ctx.fillRect(dx, dy, dw, 3);
        dx += dw + gap;
      }
    }
  }

  // ===== 提示 =====
  let toastTimer = null;
  function showToast(msg) {
    const el = $('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 1600);
  }

  // ===== 遮罩层 =====
  let overlayKind = 'title';

  function showOverlay(kind) {
    overlayKind = kind;
    overlay.classList.remove('hide');
    ovTitle.style.color = '';
    ovSub.style.display = '';
    ovTip.style.display = '';
    if (kind === 'title') {
      ovTitle.textContent = '坦克大战';
      ovSub.textContent = '守住基地 · 消灭敌军 · 点开即玩';
      ovStats.innerHTML = best > 0 ? `最高分 <b>${best}</b>` : '';
      btnPlay.textContent = '开始游戏';
      ovTip.textContent = isTouch
        ? '左下摇杆走位 · 右下按钮开火'
        : 'WASD / 方向键移动 · 空格开火 · P 暂停 · M 静音';
    } else if (kind === 'paused') {
      ovTitle.textContent = '已暂停';
      ovSub.textContent = '';
      ovStats.innerHTML = `得分 <b>${score}</b> · 第 <b>${level}</b> 关`;
      btnPlay.textContent = '继续游戏';
      ovTip.textContent = '';
    } else {
      ovTitle.textContent = won ? '胜 利' : '游戏结束';
      ovTitle.style.color = won ? '#00f0ff' : '#ff2d55';
      ovSub.textContent = won ? '基地守住了！' : '基地被摧毁了…';
      ovStats.innerHTML = `得分 <b>${score}</b> · 最高 <b>${best}</b>`;
      btnPlay.textContent = '再来一局';
      ovTip.textContent = '达到第 ' + level + ' 关';
    }
  }
  function hideOverlay() { overlay.classList.add('hide'); }

  // ===== 控制 =====
  function start() {
    score = 0; lives = 3; level = 1;
    gameOver = false; paused = false; won = false;
    bestAtStart = best;
    lastLives = -1; lastCombo = -1;
    player = makePlayer();
    player.spawnInv = 120;
    startLevel();
    running = true;
    hideOverlay();
    pauseBtn.textContent = '⏸';
    showToast('第 1 关 · 守住基地！');
  }

  function endGame(win) {
    gameOver = true;
    running = false;
    won = win;
    pauseBtn.textContent = '⏸';
    showOverlay('over');
    if (score > bestAtStart) showToast('🏆 新纪录：' + score + ' 分！');
  }

  function togglePause() {
    if (!running || gameOver) return;
    paused = !paused;
    pauseBtn.textContent = paused ? '▶' : '⏸';
    if (paused) showOverlay('paused'); else hideOverlay();
  }

  function applyMuteLabel() {
    muteBtn.textContent = muted ? '🔇' : '🔊';
  }

  function toggleMute() {
    muted = !muted;
    try { localStorage.setItem(LS_MUTE, muted ? '1' : '0'); } catch (e) { /* 忽略 */ }
    applyMuteLabel();
    if (!muted) sfxPickup();
  }

  // ===== 事件 =====
  btnPlay.addEventListener('click', () => {
    ensureAudio();
    if (overlayKind === 'paused') togglePause();
    else start();
  });
  pauseBtn.addEventListener('click', (e) => { togglePause(); e.currentTarget.blur(); });
  muteBtn.addEventListener('click', (e) => { toggleMute(); e.currentTarget.blur(); });

  window.addEventListener('keydown', (e) => {
    keys[e.key] = true;
    if (e.key === 'p' || e.key === 'P') togglePause();
    if (e.key === 'm' || e.key === 'M') toggleMute();
    if (e.key === 'Enter' && !overlay.classList.contains('hide')) {
      if (overlayKind === 'paused') togglePause(); else start();
    }
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault();
  });
  window.addEventListener('keyup', (e) => { keys[e.key] = false; });

  function loseFocus() {
    keys = {};
    releaseTouch();
    if (running && !paused && !gameOver) togglePause();
  }
  window.addEventListener('blur', loseFocus);
  document.addEventListener('visibilitychange', () => { if (document.hidden) loseFocus(); });

  // ===== 触屏输入：左摇杆走位 + 右开火 =====
  // STICK_KEYS 的下标与 DIR（UP 0 / RIGHT 1 / DOWN 2 / LEFT 3）一一对应
  const STICK_KEYS = ['ArrowUp', 'ArrowRight', 'ArrowDown', 'ArrowLeft'];
  const zone = $('stickZone'), stick = $('stick'), knob = $('knob'), fireBtn = $('tFire');
  const touchKeys = new Set();
  let stickDir = -1;        // -1 = 回中不移动
  let stickId = null;

  function setStickDir(d) {
    if (d === stickDir) return;
    STICK_KEYS.forEach(k => { keys[k] = false; touchKeys.delete(k); });
    stickDir = d;
    if (d >= 0) { keys[STICK_KEYS[d]] = true; touchKeys.add(STICK_KEYS[d]); }
  }

  function releaseTouch() {
    touchKeys.forEach(k => { keys[k] = false; });
    touchKeys.clear();
    stickDir = -1; stickId = null;
    knob.style.transform = '';
    knob.classList.remove('on');
    stick.classList.remove('active');
    fireBtn.classList.remove('on');
    keys[' '] = false;
  }

  // 以底盘圆心为原点：拖动方向取主轴，决定行进方向；中心留死区
  function stickTrack(e) {
    const r = stick.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    const max = r.width * 0.27;   // 摇杆可偏移半径（保证旋钮不越出底盘）
    let dx = e.clientX - cx, dy = e.clientY - cy;
    const len = Math.hypot(dx, dy);
    if (len > max) { dx = dx / len * max; dy = dy / len * max; }
    knob.style.transform = 'translate(' + dx.toFixed(1) + 'px,' + dy.toFixed(1) + 'px)';
    if (len < max * 0.34) { setStickDir(-1); return; }
    if (Math.abs(dx) > Math.abs(dy)) setStickDir(dx > 0 ? DIR.RIGHT : DIR.LEFT);
    else setStickDir(dy > 0 ? DIR.DOWN : DIR.UP);
  }

  zone.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    ensureAudio();
    stickId = e.pointerId;
    try { zone.setPointerCapture(e.pointerId); } catch (err) { /* 忽略 */ }
    knob.classList.add('on');
    stick.classList.add('active');
    stickTrack(e);
  });
  zone.addEventListener('pointermove', (e) => {
    if (stickId !== e.pointerId) return;
    e.preventDefault();
    stickTrack(e);
  });
  function stickEnd(e) {
    if (stickId === null || (e && e.pointerId !== stickId)) return;
    stickId = null;
    setStickDir(-1);
    knob.style.transform = '';
    knob.classList.remove('on');
    stick.classList.remove('active');
  }
  zone.addEventListener('pointerup', stickEnd);
  zone.addEventListener('pointercancel', stickEnd);
  zone.addEventListener('lostpointercapture', stickEnd);
  zone.addEventListener('contextmenu', (e) => e.preventDefault());

  // 开火键
  fireBtn.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    ensureAudio();
    try { fireBtn.setPointerCapture(e.pointerId); } catch (err) { /* 忽略 */ }
    keys[' '] = true;
    touchKeys.add(' ');
    fireBtn.classList.add('on');
  });
  const fireUp = () => {
    keys[' '] = false;
    touchKeys.delete(' ');
    fireBtn.classList.remove('on');
  };
  fireBtn.addEventListener('pointerup', fireUp);
  fireBtn.addEventListener('pointercancel', fireUp);
  fireBtn.addEventListener('lostpointercapture', fireUp);
  fireBtn.addEventListener('contextmenu', (e) => e.preventDefault());

  // 点击画布也能开火（手机上很顺手）
  canvas.addEventListener('pointerdown', (e) => { e.preventDefault(); ensureAudio(); keys[' '] = true; });
  canvas.addEventListener('pointerup', () => { keys[' '] = false; });
  canvas.addEventListener('pointercancel', () => { keys[' '] = false; });

  // 尺寸 / 旋转
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', () => setTimeout(layout, 150));
  if (window.visualViewport) window.visualViewport.addEventListener('resize', layout);

  // 微信里提示转发
  if (/MicroMessenger/i.test(navigator.userAgent)) {
    const tip = $('wxtip');
    setTimeout(() => tip.classList.add('show'), 1400);
    setTimeout(() => tip.classList.remove('show'), 7000);
    tip.addEventListener('click', () => tip.classList.remove('show'));
  }

  // ===== 启动 =====
  applyMuteLabel();
  updateHud();
  bossLevel = false;
  generateMap();
  layout();
  showOverlay('title');
  lastTime = performance.now();
  rafId = requestAnimationFrame(tick);
})();
</script>
</body>
</html>
