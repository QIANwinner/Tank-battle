<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>坦克大战 · Tank Battle</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='12' y='42' width='76' height='46' rx='10' fill='%23002FA7'/><rect x='30' y='52' width='40' height='26' rx='6' fill='%230a1040'/><rect x='44' y='10' width='12' height='36' fill='%2300f0ff'/></svg>">
<style>
  :root {
    --bg: #05050a;
    --panel: #0a0a18;
    --border: #1a1a3a;
    --text: #e8eef4;
    --muted: #5a6a8a;
    --accent: #002FA7;
    --neon-cyan: #00f0ff;
    --neon-magenta: #ff00ff;
    --neon-green: #39ff14;
    --neon-blue: #4d9fff;
    --green: #39ff14;
    --red: #ff2d55;
    --klein: #002FA7;
    --klein-bright: #3355cc;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    background-image:
      linear-gradient(rgba(0, 47, 167, 0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 47, 167, 0.06) 1px, transparent 1px);
    background-size: 40px 40px;
    color: var(--text);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
    overflow-x: hidden; overflow-y: auto;
  }
  .wrap {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 16px;
  }
  h1 {
    font-size: 28px;
    letter-spacing: 8px;
    font-weight: 800;
    color: #fff;
    text-shadow:
      0 0 6px rgba(0, 240, 255, 0.8),
      0 0 20px rgba(0, 240, 255, 0.5),
      0 0 40px rgba(0, 47, 167, 0.6);
  }
  h1 .brand {
    color: var(--neon-cyan);
    font-weight: 800;
  }
  h1 span {
    color: var(--neon-cyan);
    font-weight: 400; font-size: 13px; letter-spacing: 4px;
    vertical-align: middle; margin-left: 8px;
  }
  .footer {
    font-size: 11px;
    letter-spacing: 6px;
    color: var(--muted);
    text-transform: uppercase;
    opacity: .7;
  }
  .footer b { color: var(--neon-cyan); font-weight: 600; }
  .stage {
    display: flex;
    gap: 16px;
    align-items: flex-start;
  }
  .hud {
    width: 172px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    box-shadow: 0 0 0 1px rgba(0, 47, 167, 0.15) inset, 0 0 12px rgba(0, 47, 167, 0.1);
    position: relative;
  }
  .card h3 {
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--neon-cyan);
    margin-bottom: 6px;
    text-transform: uppercase;
    opacity: .8;
  }
  .stat { font-size: 24px; font-weight: 800; color: #fff; }
  .stat.best { color: var(--neon-cyan); }
  .lives { display: flex; gap: 6px; font-size: 20px; }
  .lives .tank { opacity: .25; color: var(--muted); }
  .lives .tank.on { opacity: 1; color: var(--neon-green); text-shadow: 0 0 6px rgba(57, 255, 20, 0.5); }
  canvas {
    display: block;
    width: 624px;
    max-width: 100%;
    height: auto;
    border-radius: 6px;
    border: 2px solid var(--klein);
    box-shadow:
      0 0 0 1px var(--border),
      0 0 20px rgba(0, 47, 167, 0.4),
      0 0 60px rgba(0, 47, 167, 0.2),
      0 10px 40px rgba(0,0,0,.6);
    background: #030308;
  }
  .controls { font-size: 12px; color: var(--muted); line-height: 1.8; }
  .controls b { color: var(--neon-cyan); font-weight: 600; }
  kbd {
    background: rgba(0, 47, 167, 0.15); border: 1px solid var(--klein-bright);
    border-bottom-width: 2px; border-radius: 4px;
    padding: 1px 7px; font-size: 11px; color: var(--neon-cyan);
    font-family: "Consolas", "Monaco", monospace;
  }
  .btns { display: flex; gap: 8px; }
  button {
    flex: 1;
    background: var(--klein);
    color: #fff;
    border: 1px solid var(--klein-bright);
    border-radius: 6px;
    padding: 10px 0; font-size: 14px; font-weight: 700;
    cursor: pointer; letter-spacing: 2px;
    transition: all .15s ease;
    text-shadow: 0 0 4px rgba(255,255,255,0.3);
    box-shadow: 0 0 8px rgba(0, 47, 167, 0.3);
  }
  button:hover {
    background: var(--klein-bright);
    box-shadow: 0 0 16px rgba(0, 47, 167, 0.6), 0 0 32px rgba(0, 240, 255, 0.2);
    border-color: var(--neon-cyan);
  }
  button:active { transform: translateY(1px); }
  button.ghost {
    background: transparent;
    color: var(--neon-cyan);
    border: 1px solid var(--klein-bright);
    box-shadow: none;
    text-shadow: none;
  }
  button.ghost:hover {
    background: rgba(0, 47, 167, 0.2);
    box-shadow: 0 0 12px rgba(0, 47, 167, 0.3);
  }
  /* 触屏虚拟按键（仅触摸设备显示） */
  .touch { display: none; align-items: center; gap: 30px; }
  .touch button { flex: 0 0 auto; }
  .tbtn {
    width: 54px; height: 54px; font-size: 17px; font-weight: 700;
    border-radius: 8px; touch-action: none;
    background: rgba(0, 47, 167, 0.2); color: var(--neon-cyan);
    border: 1px solid var(--klein-bright);
  }
  .tbtn:active { background: var(--klein); box-shadow: 0 0 12px rgba(0, 47, 167, 0.5); }
  .dpad {
    display: grid; gap: 5px;
    grid-template-columns: repeat(3, 54px);
    grid-template-rows: repeat(3, 54px);
  }
  #tUp { grid-column: 2; grid-row: 1; }
  #tLeft { grid-column: 1; grid-row: 2; }
  #tRight { grid-column: 3; grid-row: 2; }
  #tDown { grid-column: 2; grid-row: 3; }
  .tfire {
    width: 88px; height: 88px; border-radius: 50%;
    background: var(--neon-magenta); color: #fff; border: 2px solid #fff;
    font-size: 17px; font-weight: 800;
    box-shadow: 0 0 20px rgba(255, 0, 255, 0.5);
  }
  .tfire:active { box-shadow: 0 0 32px rgba(255, 0, 255, 0.8); }
  @media (pointer: coarse) {
    .touch { display: flex; }
  }
  .toast {
    position: fixed; top: 24px; left: 50%;
    transform: translateX(-50%);
    background: rgba(0, 47, 167, 0.9); border: 1px solid var(--neon-cyan);
    padding: 10px 22px; border-radius: 8px;
    font-size: 14px; letter-spacing: 1px; color: #fff;
    opacity: 0; pointer-events: none;
    transition: opacity .25s ease, transform .25s ease;
    box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(6px); }
  @media (max-width: 640px) {
    .stage { flex-direction: column; align-items: center; }
    .hud { width: 100%; flex-direction: row; flex-wrap: wrap; }
    .hud .card { flex: 1; min-width: 90px; }
    h1 { font-size: 20px; letter-spacing: 5px; }
    h1 span { display: block; margin-left: 0; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1><span class="brand">QIAN</span> · 坦克大战 <span>TANK BATTLE</span></h1>
    <div class="stage">
      <div class="hud">
        <div class="card">
          <h3>得分</h3>
          <div class="stat" id="score">0</div>
        </div>
        <div class="card">
          <h3>最高分</h3>
          <div class="stat best" id="best">0</div>
        </div>
        <div class="card">
          <h3>生命</h3>
          <div class="lives" id="lives"></div>
        </div>
        <div class="card">
          <h3>关卡</h3>
          <div class="stat" id="level">1</div>
        </div>
        <div class="card">
          <h3>剩余敌人</h3>
          <div class="stat" id="remaining">0</div>
        </div>
        <div class="card controls">
          <h3>操作</h3>
          <div><kbd>W A S D</kbd> / <kbd>方向键</kbd> 移动</div>
          <div><kbd>空格</kbd> / <kbd>J</kbd> 射击</div>
          <div><kbd>P</kbd> 暂停 · <kbd>M</kbd> 静音</div>
        </div>
        <div class="btns">
          <button id="startBtn">开始</button>
          <button id="pauseBtn" class="ghost">暂停</button>
          <button id="muteBtn" class="ghost">🔊 声音</button>
        </div>
      </div>
      <canvas id="game" width="624" height="624"></canvas>
    </div>
    <div class="touch">
      <div class="dpad">
        <button class="tbtn" id="tUp" aria-label="向上">▲</button>
        <button class="tbtn" id="tLeft" aria-label="向左">◀</button>
        <button class="tbtn" id="tDown" aria-label="向下">▼</button>
        <button class="tbtn" id="tRight" aria-label="向右">▶</button>
      </div>
      <button class="tbtn tfire" id="tFire" aria-label="开火">开火</button>
    </div>
    <div class="footer">DESIGNED BY <b>QIAN</b> · V1.1</div>
  </div>
  <div class="toast" id="toast"></div>

<script>
(() => {
  "use strict";

  // ===== 常量 =====
  const TILE = 24;                 // 每格像素
  const COLS = 26, ROWS = 26;      // 地图尺寸
  const W = COLS * TILE, H = ROWS * TILE;  // 逻辑尺寸
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);  // 高分屏清晰渲染
  canvas.width = W * dpr;
  canvas.height = H * dpr;

  const TILE_BRICK = 1;            // 砖墙（可摧毁）
  const TILE_STEEL = 2;            // 钢墙（不可摧毁）
  const TILE_WATER = 3;            // 水（坦克不能过，子弹可过）
  const TILE_TREE  = 4;            // 草丛（遮挡视觉）

  const DIR = { UP: 0, RIGHT: 1, DOWN: 2, LEFT: 3 };
  const DX = [0, 1, 0, -1];
  const DY = [-1, 0, 1, 0];

  const TANK_SIZE = 22;            // 坦克碰撞体近似为正方形
  const PLAYER_SPEED = 2.4;
  const ENEMY_SPEED = 1.15;
  const BULLET_SPEED = 5.2;
  const BASE = { x: 12, y: 23 };   // 基地格（距底边留一行，玩家在下方出生且不破坏外墙）

  // DOM 引用缓存（避免每帧查询）
  const $ = id => document.getElementById(id);
  const elScore = $('score'), elBest = $('best'), elLevel = $('level'),
        elRemaining = $('remaining'), elLives = $('lives'),
        startBtn = $('startBtn'), pauseBtn = $('pauseBtn'), muteBtn = $('muteBtn');

  // 本地存储：最高分 / 静音偏好
  const LS_BEST = 'tank-battle-best', LS_MUTE = 'tank-battle-muted';
  let best = 0, muted = false;
  try {
    best = parseInt(localStorage.getItem(LS_BEST) || '0', 10) || 0;
    muted = localStorage.getItem(LS_MUTE) === '1';
  } catch (e) { /* 隐私模式下 localStorage 不可用 */ }
  let bestAtStart = best;

  // ===== 状态 =====
  let map = [];
  let player = null;
  let bullets = [];
  let enemies = [];
  let particles = [];
  let texts = [];                  // 飘分文字
  let score = 0;
  let lives = 3;
  let level = 1;
  let running = false;
  let paused = false;
  let gameOver = false;
  let won = false;
  let enemySpawnTimer = 0;
  let enemiesTotal = 0;
  let enemiesSpawned = 0;
  let baseAlive = true;
  let shake = 0;
  let keys = {};
  let rafId = null;
  let lastLives = -1;

  // ===== 音效（Web Audio） =====
  let audioCtx = null;
  function beep(freq, dur, type = 'square', vol = 0.06) {
    if (muted) return;
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + dur);
    } catch (e) { /* 忽略音频错误 */ }
  }
  const sfxShoot  = () => beep(880, 0.06, 'square', 0.03);
  const sfxHit    = () => beep(220, 0.08, 'sawtooth', 0.05);
  const sfxBoom   = () => { beep(120, 0.25, 'sawtooth', 0.09); beep(60, 0.3, 'sawtooth', 0.07); };
  const sfxPickup = () => { beep(660, 0.08); setTimeout(() => beep(990, 0.1), 80); };

  // ===== 工具 =====
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const rand = (a, b) => a + Math.random() * (b - a);
  const randInt = (a, b) => Math.floor(rand(a, b + 1));

  // ===== 地图生成 =====
  function generateMap() {
    map = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
    // 四周钢墙
    for (let x = 0; x < COLS; x++) {
      map[0][x] = TILE_STEEL; map[ROWS - 1][x] = TILE_STEEL;
    }
    for (let y = 0; y < ROWS; y++) {
      map[y][0] = TILE_STEEL; map[y][COLS - 1] = TILE_STEEL;
    }
    // 基地与保护砖墙（先放置，随机地形只填充空格，不会覆盖）
    map[BASE.y][BASE.x] = TILE_STEEL;
    map[BASE.y - 1][BASE.x] = TILE_BRICK;
    map[BASE.y - 2][BASE.x] = TILE_BRICK;
    map[BASE.y - 1][BASE.x - 1] = TILE_BRICK;
    map[BASE.y - 1][BASE.x + 1] = TILE_BRICK;
    map[BASE.y][BASE.x - 1] = TILE_BRICK;
    map[BASE.y][BASE.x + 1] = TILE_BRICK;

    const brickBlob = (cx, cy) => {
      for (let y = cy - 1; y <= cy + 1; y++)
        for (let x = cx - 1; x <= cx + 1; x++)
          if (inside(x, y) && map[y][x] === 0 && Math.random() < 0.72)
            map[y][x] = TILE_BRICK;
    };
    const steelBox = (cx, cy, w = 1, h = 1) => {
      for (let y = cy; y < cy + h; y++)
        for (let x = cx; x < cx + w; x++)
          if (inside(x, y) && map[y][x] === 0) map[y][x] = TILE_STEEL;
    };
    const waterRow = (cx, cy, len) => {
      for (let x = cx; x < cx + len; x++)
        if (inside(x, cy) && map[cy][x] === 0) map[cy][x] = TILE_WATER;
    };
    const trees = (cx, cy, w, h) => {
      for (let y = cy; y < cy + h; y++)
        for (let x = cx; x < cx + w; x++)
          if (inside(x, y) && map[y][x] === 0) map[y][x] = TILE_TREE;
    };

    // 若干随机砖块群
    const blobs = 9 + level;
    for (let i = 0; i < blobs; i++)
      brickBlob(randInt(2, COLS - 3), randInt(2, ROWS - 3));

    // 钢墙箱体
    steelBox(6, 4, 1, 2);
    steelBox(19, 4, 1, 2);
    steelBox(6, 20, 1, 2);
    steelBox(19, 20, 1, 2);
    steelBox(12, 12, 2, 2);
    steelBox(4, 12, 1, 2);
    steelBox(21, 12, 1, 2);

    // 水域
    waterRow(2, 6, 3);
    waterRow(21, 6, 3);
    waterRow(9, 12, 8);
    waterRow(2, 20, 3);
    waterRow(21, 20, 3);

    // 草丛
    trees(9, 6, 8, 2);
    trees(9, 18, 8, 2);
    trees(2, 9, 3, 3);
    trees(21, 9, 3, 3);
    trees(4, 16, 3, 3);
    trees(19, 16, 3, 3);

    // 清出出生点（敌方三点 + 玩家），只清内部格，不破坏外墙与基地
    [[1, 1], [COLS - 2, 1], [(COLS / 2) | 0, 1], [BASE.x, BASE.y + 1]]
      .forEach(([x, y]) => { if (inside(x, y)) map[y][x] = 0; });
  }

  function inside(x, y) { return x >= 0 && y >= 0 && x < COLS && y < ROWS; }

  // 判断某像素区域是否可通行（坦克）
  function isBlocked(px, py, size, isBullet = false) {
    const x0 = Math.floor(px / TILE), x1 = Math.floor((px + size - 0.01) / TILE);
    const y0 = Math.floor(py / TILE), y1 = Math.floor((py + size - 0.01) / TILE);
    for (let y = y0; y <= y1; y++)
      for (let x = x0; x <= x1; x++) {
        if (!inside(x, y)) return true;
        const t = map[y][x];
        if (isBullet) {
          if (t === TILE_STEEL || t === TILE_BRICK) return true;
          if (t === TILE_WATER) return false; // 子弹可越过水
        } else {
          if (t === TILE_BRICK || t === TILE_STEEL || t === TILE_WATER) return true;
        }
      }
    return false;
  }

  // 子弹击中砖块：摧毁命中的那一格
  function damageTile(px, py) {
    const x = Math.floor(px / TILE), y = Math.floor(py / TILE);
    if (inside(x, y) && map[y][x] === TILE_BRICK) {
      map[y][x] = 0;
      spawnParticles(x * TILE + TILE / 2, y * TILE + TILE / 2, '#ff00ff', 6);
      return true;
    }
    return false;
  }

  // ===== 粒子 / 飘分 =====
  function spawnParticles(x, y, color, n = 8) {
    for (let i = 0; i < n; i++) {
      particles.push({
        x, y,
        vx: rand(-2.5, 2.5), vy: rand(-2.5, 2.5),
        life: rand(0.3, 0.6), max: 0.6, color,
        size: rand(1.5, 3.5)
      });
    }
  }

  function addText(x, y, str, color = '#00f0ff') {
    texts.push({ x, y, str, color, life: 0.9, max: 0.9 });
  }

  // ===== 坦克 =====
  function makePlayer() {
    return {
      x: BASE.x * TILE + (TILE - TANK_SIZE) / 2,
      y: (BASE.y + 1) * TILE + (TILE - TANK_SIZE) / 2,
      dir: DIR.UP, speed: PLAYER_SPEED,
      cooldown: 0, isPlayer: true, color: '#002FA7'
    };
  }

  function spawnEnemy(x, y) {
    enemies.push({
      x, y, dir: DIR.DOWN, speed: ENEMY_SPEED,
      cooldown: 0, isPlayer: false,
      color: pickEnemyColor(), changeTimer: randInt(60, 160), shootTimer: randInt(40, 140)
    });
  }

  function pickEnemyColor() {
    const c = ['#ff00ff', '#00f0ff', '#39ff14', '#ff2d55', '#4d9fff'];
    return c[randInt(0, c.length - 1)];
  }

  const spawnPoints = [
    [1 * TILE, 1 * TILE],
    [(COLS - 2) * TILE, 1 * TILE],
    [(COLS / 2 | 0) * TILE, 1 * TILE]
  ];

  // ===== 子弹 =====
  function fire(tank) {
    if (tank.cooldown > 0) return;
    tank.cooldown = tank.isPlayer ? 14 : 40;
    const cx = tank.x + TANK_SIZE / 2;
    const cy = tank.y + TANK_SIZE / 2;
    bullets.push({
      x: cx - 2, y: cy - 2, size: 4,
      dir: tank.dir, speed: BULLET_SPEED,
      owner: tank
    });
    if (tank.isPlayer) sfxShoot();
    else beep(500, 0.05, 'square', 0.02);
  }

  // ===== 敌人 AI =====
  function updateEnemy(e) {
    // 定期改变方向 / 射击
    if (--e.changeTimer <= 0) {
      e.changeTimer = randInt(50, 170);
      if (Math.random() < 0.75) e.dir = randInt(0, 3);
    }
    if (--e.shootTimer <= 0) {
      e.shootTimer = randInt(40, 150);
      fire(e);
    }
    // 偶尔锁定玩家或基地方向
    const r = Math.random();
    let tx = null, ty = null;
    if (player && !player.dead && r < 0.025) { tx = player.x; ty = player.y; }
    else if (baseAlive && r >= 0.025 && r < 0.05) { tx = BASE.x * TILE; ty = BASE.y * TILE; }
    if (tx !== null) {
      const dx = tx - e.x, dy = ty - e.y;
      if (Math.abs(dx) > Math.abs(dy)) e.dir = dx > 0 ? DIR.RIGHT : DIR.LEFT;
      else e.dir = dy > 0 ? DIR.DOWN : DIR.UP;
    }

    const nx = e.x + DX[e.dir] * e.speed;
    const ny = e.y + DY[e.dir] * e.speed;
    if (!isBlocked(nx, ny, TANK_SIZE) && !tankHitsTank(nx, ny, e)) {
      e.x = nx; e.y = ny;
    } else {
      e.changeTimer = Math.min(e.changeTimer, 20);
      e.dir = pickFreeDir(e);
    }
  }

  // 卡墙时优先选一个可行方向，而不是纯随机乱撞
  function pickFreeDir(e) {
    const free = [0, 1, 2, 3].filter(d =>
      !isBlocked(e.x + DX[d] * TILE, e.y + DY[d] * TILE, TANK_SIZE) &&
      !tankHitsTank(e.x + DX[d] * TILE, e.y + DY[d] * TILE, e));
    return free.length ? free[randInt(0, free.length - 1)] : randInt(0, 3);
  }

  function tankHitsTank(nx, ny, self) {
    const r = TANK_SIZE - 1;
    const tanks = self.isPlayer ? enemies : enemies.concat(player ? [player] : []);
    for (const t of tanks) {
      if (t === self) continue;
      if (nx < t.x + r && nx + r > t.x && ny < t.y + r && ny + r > t.y) return true;
    }
    return false;
  }

  // ===== 子弹更新 =====
  function updateBullet(b) {
    const steps = Math.ceil(b.speed);
    for (let s = 0; s < steps; s++) {
      b.x += DX[b.dir] * (b.speed / steps);
      b.y += DY[b.dir] * (b.speed / steps);
      const cx = b.x + b.size / 2, cy = b.y + b.size / 2;

      // 边界
      if (b.x < 0 || b.y < 0 || b.x + b.size > W || b.y + b.size > H) {
        b.dead = true; return;
      }
      // 砖块 / 钢墙：命中格 = 子弹中心 + 运动方向前缘（覆盖跨格命中）
      if (isBlocked(b.x, b.y, b.size, true)) {
        damageTile(cx, cy);
        if (b.dir === DIR.UP) damageTile(cx, b.y);
        else if (b.dir === DIR.DOWN) damageTile(cx, b.y + b.size);
        else if (b.dir === DIR.LEFT) damageTile(b.x, cy);
        else damageTile(b.x + b.size, cy);
        b.dead = true; sfxHit(); return;
      }
      // 基地
      if (baseAlive) {
        const bx = BASE.x * TILE, by = BASE.y * TILE;
        if (cx >= bx && cx <= bx + TILE && cy >= by && cy <= by + TILE) {
          baseAlive = false;
          b.dead = true; sfxBoom();
          spawnParticles(bx + TILE / 2, by + TILE / 2, '#ff2d55', 20);
          shake = 12;
          return;
        }
      }
      // 命中坦克
      if (b.owner.isPlayer) {
        for (const e of enemies) {
          if (e.dead) continue;
          if (cx >= e.x && cx <= e.x + TANK_SIZE && cy >= e.y && cy <= e.y + TANK_SIZE) {
            e.dead = true; b.dead = true;
            score += 100; sfxBoom();
            spawnParticles(e.x + TANK_SIZE / 2, e.y + TANK_SIZE / 2, e.color, 16);
            addText(e.x + TANK_SIZE / 2, e.y - 4, '+100');
            shake = 6;
            return;
          }
        }
      } else if (player && !player.dead && !(player.spawnInv > 0)) {
        // 出生保护期内子弹直接穿过玩家
        if (cx >= player.x && cx <= player.x + TANK_SIZE && cy >= player.y && cy <= player.y + TANK_SIZE) {
          b.dead = true; killPlayer(); return;
        }
      }
      // 子弹互撞
      for (const o of bullets) {
        if (o === b || o.dead || o.owner.isPlayer === b.owner.isPlayer) continue;
        if (cx >= o.x && cx <= o.x + o.size && cy >= o.y && cy <= o.y + o.size) {
          b.dead = true; o.dead = true; return;
        }
      }
    }
  }

  // ===== 玩家 =====
  function updatePlayer() {
    if (!player || player.dead) return;
    if (player.cooldown > 0) player.cooldown--;
    let mx = 0, my = 0;
    if (keys['ArrowUp'] || keys['w'] || keys['W']) my = -1;
    else if (keys['ArrowDown'] || keys['s'] || keys['S']) my = 1;
    else if (keys['ArrowLeft'] || keys['a'] || keys['A']) mx = -1;
    else if (keys['ArrowRight'] || keys['d'] || keys['D']) mx = 1;

    if (mx !== 0 || my !== 0) {
      player.dir = mx !== 0 ? (mx > 0 ? DIR.RIGHT : DIR.LEFT) : (my > 0 ? DIR.DOWN : DIR.UP);
      const nx = player.x + mx * player.speed;
      const ny = player.y + my * player.speed;
      // 分别尝试 x / y 以便贴墙滑动
      if (mx !== 0 && !isBlocked(nx, player.y, TANK_SIZE) && !tankHitsTank(nx, player.y, player))
        player.x = nx;
      if (my !== 0 && !isBlocked(player.x, ny, TANK_SIZE) && !tankHitsTank(player.x, ny, player))
        player.y = ny;
      clampPlayer();
    }
    if (keys[' '] || keys['Space'] || keys['j'] || keys['J']) fire(player);
  }

  function clampPlayer() {
    player.x = clamp(player.x, TILE, W - TILE - TANK_SIZE);
    player.y = clamp(player.y, TILE, H - TILE - TANK_SIZE);
  }

  function killPlayer() {
    if (!player || player.dead) return;
    player.dead = true;
    sfxBoom();
    spawnParticles(player.x + TANK_SIZE / 2, player.y + TANK_SIZE / 2, player.color, 18);
    shake = 10;
    lives--;
    updateHud();
    setTimeout(() => {
      if (!running || gameOver) return;
      if (player && !player.dead) return; // 已随过关重生，避免误判结束
      if (lives > 0) {
        player = makePlayer();
        player.spawnInv = 120;
        updateHud();
      } else {
        endGame(false);
      }
    }, 700);
  }

  function endGame(win) {
    gameOver = true;
    running = false;
    won = win;
    if (score > bestAtStart) showToast('🏆 新纪录：' + score + ' 分！');
    else showToast(win ? '🏆 胜利！你守住了基地！' : '💀 游戏结束');
    startBtn.textContent = '重新开始';
  }

  // ===== 关卡 / 敌人生成 =====
  function startLevel() {
    enemiesTotal = 6 + level * 2;
    enemiesSpawned = 0;
    enemySpawnTimer = 60;
    bullets = [];
    enemies = [];
    particles = [];
    texts = [];
    baseAlive = true;
    generateMap();
    if (lives > 0 && (!player || player.dead)) {
      player = makePlayer();
      player.spawnInv = 120;
    }
    player.x = BASE.x * TILE + (TILE - TANK_SIZE) / 2;
    player.y = (BASE.y + 1) * TILE + (TILE - TANK_SIZE) / 2;
    player.dir = DIR.UP;
    updateHud();
  }

  function updateSpawning() {
    if (enemiesSpawned >= enemiesTotal) return;
    if (--enemySpawnTimer > 0) return;
    enemySpawnTimer = 90;
    // 选一个没被占用的出生点
    const pt = spawnPoints[randInt(0, 2)];
    if (!enemies.some(e => !e.dead && Math.abs(e.x - pt[0]) < TILE && Math.abs(e.y - pt[1]) < TILE)) {
      spawnEnemy(pt[0], pt[1]);
      enemiesSpawned++;
    }
  }

  // ===== 主循环 =====
  function loop() {
    rafId = requestAnimationFrame(loop);
    if (!running || paused) { draw(); return; }

    updatePlayer();
    enemies.forEach(updateEnemy);
    bullets.forEach(updateBullet);

    // 移除死亡实体
    bullets = bullets.filter(b => !b.dead);
    enemies = enemies.filter(e => !e.dead);

    updateSpawning();

    // 玩家与敌人碰撞
    if (player && !player.dead) {
      for (const e of enemies) {
        if (e.dead) continue;
        const r = TANK_SIZE - 1;
        if (player.x < e.x + r && player.x + r > e.x && player.y < e.y + r && player.y + r > e.y) {
          // 相撞：各自弹开一点
          const dx = player.x - e.x, dy = player.y - e.y;
          const len = Math.hypot(dx, dy) || 1;
          const push = 0.5;
          player.x += dx / len * push; player.y += dy / len * push;
          e.x -= dx / len * push; e.y -= dy / len * push;
          clampPlayer();
          e.changeTimer = Math.min(e.changeTimer, 10);
        }
      }
    }

    // 基地被摧毁
    if (!baseAlive) { endGame(false); }

    // 敌人清空且已全部生成 → 下一关
    if (running && enemies.length === 0 && enemiesSpawned >= enemiesTotal) {
      level++;
      startLevel();
      sfxPickup();
      showToast('🎉 进入第 ' + level + ' 关');
    }

    particles.forEach(p => {
      p.x += p.vx; p.y += p.vy;
      p.life -= 1 / 60;
    });
    particles = particles.filter(p => p.life > 0);

    texts.forEach(t => { t.y -= 0.55; t.life -= 1 / 60; });
    texts = texts.filter(t => t.life > 0);

    if (player && player.spawnInv > 0) player.spawnInv--;
    if (shake > 0) shake--;

    updateHud();
    draw();
  }

  // ===== HUD =====
  function updateHud() {
    if (score > best) {
      best = score;
      try { localStorage.setItem(LS_BEST, String(best)); } catch (e) { /* 忽略 */ }
    }
    elScore.textContent = score;
    elBest.textContent = best;
    elLevel.textContent = level;
    elRemaining.textContent = enemiesTotal - enemiesSpawned + enemies.length;
    if (lives !== lastLives) {
      lastLives = lives;
      let html = '';
      for (let i = 0; i < 3; i++) html += `<span class="tank ${i < lives ? 'on' : ''}">▲</span>`;
      elLives.innerHTML = html;
    }
  }

  // ===== 渲染 =====
  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.save();
    if (shake > 0) ctx.translate(rand(-shake, shake) * 0.5, rand(-shake, shake) * 0.5);

    // 背景
    ctx.fillStyle = '#030308';
    ctx.fillRect(0, 0, W, H);
    // 赛博网格
    ctx.strokeStyle = 'rgba(0, 47, 167, 0.12)';
    ctx.lineWidth = 1;
    for (let i = 0; i <= W; i += TILE) {
      ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, H); ctx.stroke();
    }
    for (let i = 0; i <= H; i += TILE) {
      ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(W, i); ctx.stroke();
    }

    // 地块
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        const t = map[y][x];
        const px = x * TILE, py = y * TILE;
        if (t === TILE_BRICK) drawBrick(px, py);
        else if (t === TILE_STEEL) drawSteel(px, py);
        else if (t === TILE_WATER) drawWater(px, py);
      }
    }

    // 基地
    drawBase();

    // 子弹
    for (const b of bullets) {
      if (b.owner.isPlayer) {
        ctx.shadowColor = '#00f0ff';
        ctx.shadowBlur = 8;
        ctx.fillStyle = '#00f0ff';
      } else {
        ctx.shadowColor = '#ff00ff';
        ctx.shadowBlur = 6;
        ctx.fillStyle = '#ff00ff';
      }
      ctx.fillRect(b.x, b.y, b.size, b.size);
      ctx.shadowBlur = 0;
    }

    // 敌人
    for (const e of enemies) drawTank(e);

    // 玩家
    if (player && !player.dead) {
      if (player.spawnInv > 0 && Math.floor(player.spawnInv / 4) % 2 === 0) {
        // 无敌闪烁
      } else drawTank(player);
    }

    // 草丛（覆盖在上层）
    for (let y = 0; y < ROWS; y++)
      for (let x = 0; x < COLS; x++)
        if (map[y][x] === TILE_TREE) drawTree(x * TILE, y * TILE);

    // 粒子
    for (const p of particles) {
      ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
    ctx.globalAlpha = 1;

    // 飘分文字
    if (texts.length) {
      ctx.font = '700 13px "Segoe UI", sans-serif';
      ctx.textAlign = 'center';
      for (const t of texts) {
        ctx.globalAlpha = clamp(t.life / t.max, 0, 1);
        ctx.fillStyle = t.color;
        ctx.fillText(t.str, t.x, t.y);
      }
      ctx.globalAlpha = 1;
    }

    ctx.restore();

    // 覆盖层（开始 / 暂停 / 结束）
    if (!running || paused || gameOver) {
      ctx.fillStyle = 'rgba(3, 3, 8, 0.82)';
      ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      if (gameOver) {
        ctx.shadowColor = won ? '#00f0ff' : '#ff2d55';
        ctx.shadowBlur = 20;
        ctx.fillStyle = won ? '#00f0ff' : '#ff2d55';
        ctx.font = '800 40px "Segoe UI", sans-serif';
        ctx.fillText(won ? '胜 利' : '游戏结束', W / 2, H / 2 - 20);
        ctx.shadowBlur = 0;
        ctx.font = '14px "Consolas", monospace';
        ctx.fillStyle = '#5a6a8a';
        ctx.fillText('SCORE ' + score + '  ·  BEST ' + best, W / 2, H / 2 + 22);
        ctx.fillText('PRESS START TO CONTINUE', W / 2, H / 2 + 44);
      } else if (paused) {
        ctx.shadowColor = '#00f0ff';
        ctx.shadowBlur = 16;
        ctx.fillStyle = '#00f0ff';
        ctx.font = '800 40px "Segoe UI", sans-serif';
        ctx.fillText('PAUSED', W / 2, H / 2);
        ctx.shadowBlur = 0;
      } else {
        ctx.shadowColor = '#00f0ff';
        ctx.shadowBlur = 16;
        ctx.fillStyle = '#fff';
        ctx.font = '800 34px "Segoe UI", sans-serif';
        ctx.fillText('QIAN · TANK BATTLE', W / 2, H / 2 - 14);
        ctx.shadowBlur = 0;
        ctx.font = '14px "Consolas", monospace';
        ctx.fillStyle = '#00f0ff';
        ctx.fillText('PRESS START', W / 2, H / 2 + 24);
      }
    }
  }

  function drawBrick(px, py) {
    ctx.fillStyle = '#2a1520';
    ctx.fillRect(px, py, TILE, TILE);
    ctx.strokeStyle = '#1a0a12';
    ctx.lineWidth = 1;
    ctx.strokeRect(px + 0.5, py + 0.5, TILE - 1, TILE - 1);
    // 砖缝
    ctx.fillStyle = '#3a2030';
    ctx.fillRect(px, py + 7, TILE, 2);
    ctx.fillRect(px, py + 15, TILE, 2);
    ctx.fillRect(px + 5, py, 2, 7);
    ctx.fillRect(px + 17, py, 2, 7);
    ctx.fillRect(px + 11, py + 9, 2, 6);
    ctx.fillRect(px + 23, py + 9, 2, 6);
    ctx.fillRect(px + 5, py + 17, 2, 7);
    ctx.fillRect(px + 17, py + 17, 2, 7);
  }

  function drawSteel(px, py) {
    ctx.fillStyle = '#1a2030';
    ctx.fillRect(px, py, TILE, TILE);
    ctx.fillStyle = '#2a3548';
    ctx.fillRect(px + 3, py + 3, TILE - 6, TILE - 6);
    ctx.fillStyle = '#3a4860';
    ctx.fillRect(px + 8, py + 8, TILE - 16, TILE - 16);
    // 高光条
    ctx.fillStyle = 'rgba(0, 240, 255, 0.12)';
    ctx.fillRect(px + 8, py + 8, TILE - 16, 2);
  }

  function drawWater(px, py) {
    ctx.fillStyle = '#0a1530';
    ctx.fillRect(px, py, TILE, TILE);
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.35)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(px + 2, py + 8); ctx.lineTo(px + 12, py + 8);
    ctx.moveTo(px + 14, py + 16); ctx.lineTo(px + 22, py + 16);
    ctx.stroke();
  }

  function drawTree(px, py) {
    ctx.fillStyle = 'rgba(10, 30, 20, 0.85)';
    ctx.fillRect(px, py, TILE, TILE);
    ctx.fillStyle = '#1a4020';
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.arc(px + 6 + i * 7, py + 8, 6, 0, Math.PI * 2);
      ctx.arc(px + 10 + i * 7, py + 15, 6, 0, Math.PI * 2);
      ctx.fill();
    }
    // 霓虹点
    ctx.fillStyle = 'rgba(57, 255, 20, 0.4)';
    ctx.fillRect(px + 4, py + 4, 2, 2);
    ctx.fillRect(px + 18, py + 14, 2, 2);
  }

  function drawBase() {
    const px = BASE.x * TILE, py = BASE.y * TILE;
    if (baseAlive) {
      ctx.fillStyle = '#0a1040';
      ctx.fillRect(px + 2, py + 2, TILE - 4, TILE - 4);
      ctx.strokeStyle = '#002FA7';
      ctx.lineWidth = 2;
      ctx.strokeRect(px + 2, py + 2, TILE - 4, TILE - 4);
      // QIAN logo
      ctx.fillStyle = '#00f0ff';
      ctx.font = '700 8px "Consolas", monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('Q', px + TILE / 2, py + TILE / 2);
      ctx.shadowColor = '#00f0ff';
      ctx.shadowBlur = 6;
      ctx.fillText('Q', px + TILE / 2, py + TILE / 2);
      ctx.shadowBlur = 0;
    } else {
      ctx.fillStyle = '#1a0505';
      ctx.fillRect(px + 2, py + 2, TILE - 4, TILE - 4);
      ctx.strokeStyle = '#ff2d55';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(px + 6, py + 6); ctx.lineTo(px + TILE - 6, py + TILE - 6);
      ctx.moveTo(px + TILE - 6, py + 6); ctx.lineTo(px + 6, py + TILE - 6);
      ctx.stroke();
    }
  }

  function drawTank(t) {
    const cx = t.x + TANK_SIZE / 2, cy = t.y + TANK_SIZE / 2;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(t.dir * Math.PI / 2);

    const isPlayer = t.isPlayer;

    // 霓虹辉光
    if (isPlayer) {
      ctx.shadowColor = '#00f0ff';
      ctx.shadowBlur = 10;
    } else {
      ctx.shadowColor = t.color;
      ctx.shadowBlur = 8;
    }

    // 履带
    ctx.fillStyle = isPlayer ? '#0a1040' : '#1a1020';
    ctx.fillRect(-11, -10, 5, 20);
    ctx.fillRect(6, -10, 5, 20);
    ctx.fillStyle = isPlayer ? '#3355cc' : '#2a2035';
    ctx.fillRect(-11, -8, 5, 3);
    ctx.fillRect(-11, -3, 5, 3);
    ctx.fillRect(-11, 2, 5, 3);
    ctx.fillRect(-11, 7, 5, 3);
    ctx.fillRect(6, -8, 5, 3);
    ctx.fillRect(6, -3, 5, 3);
    ctx.fillRect(6, 2, 5, 3);
    ctx.fillRect(6, 7, 5, 3);

    // 车身
    ctx.fillStyle = t.color;
    ctx.fillRect(-6, -8, 12, 16);
    // 炮塔
    ctx.fillStyle = shade(t.color, isPlayer ? 30 : -25);
    ctx.fillRect(-4, -4, 8, 8);
    // 炮管
    ctx.fillStyle = isPlayer ? '#00f0ff' : '#2a2035';
    ctx.fillRect(-2, -16, 4, 10);

    ctx.shadowBlur = 0;
    ctx.restore();
  }

  function shade(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    let r = (n >> 16) + amt, g = ((n >> 8) & 0xff) + amt, b = (n & 0xff) + amt;
    r = clamp(r, 0, 255); g = clamp(g, 0, 255); b = clamp(b, 0, 255);
    return `rgb(${r},${g},${b})`;
  }

  // ===== 提示 =====
  let toastTimer = null;
  function showToast(msg) {
    const el = $('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 1600);
  }

  // ===== 控制 =====
  function start() {
    score = 0; lives = 3; level = 1;
    gameOver = false; paused = false; won = false;
    bestAtStart = best;
    lastLives = -1;
    player = makePlayer();
    player.spawnInv = 120;
    startLevel();
    running = true;
    startBtn.textContent = '重新开始';
    pauseBtn.textContent = '暂停';
    showToast('第 1 关 · 守住基地！');
  }

  function togglePause() {
    if (!running || gameOver) return;
    paused = !paused;
    pauseBtn.textContent = paused ? '继续' : '暂停';
  }

  function applyMuteLabel() {
    muteBtn.textContent = muted ? '🔇 静音' : '🔊 声音';
  }

  function toggleMute() {
    muted = !muted;
    try { localStorage.setItem(LS_MUTE, muted ? '1' : '0'); } catch (e) { /* 忽略 */ }
    applyMuteLabel();
  }

  // ===== 事件 =====
  // 按钮点击后移除焦点，避免随后按空格射击时误触按钮
  startBtn.addEventListener('click', (e) => { start(); e.currentTarget.blur(); });
  pauseBtn.addEventListener('click', (e) => { togglePause(); e.currentTarget.blur(); });
  muteBtn.addEventListener('click', (e) => { toggleMute(); e.currentTarget.blur(); });

  window.addEventListener('keydown', (e) => {
    keys[e.key] = true;
    if (e.key === 'p' || e.key === 'P') togglePause();
    if (e.key === 'm' || e.key === 'M') toggleMute();
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
  });
  window.addEventListener('keyup', (e) => { keys[e.key] = false; });

  // 失焦 / 切走标签页：清空按键并自动暂停，防止「卡键」
  function loseFocus() {
    keys = {};
    if (running && !paused && !gameOver) togglePause();
  }
  window.addEventListener('blur', loseFocus);
  document.addEventListener('visibilitychange', () => { if (document.hidden) loseFocus(); });

  // 触屏虚拟按键
  [['tUp', 'ArrowUp'], ['tLeft', 'ArrowLeft'], ['tDown', 'ArrowDown'],
   ['tRight', 'ArrowRight'], ['tFire', ' ']].forEach(([id, key]) => {
    const el = $(id);
    const press = (e) => { e.preventDefault(); keys[key] = true; };
    const release = (e) => { e.preventDefault(); keys[key] = false; };
    el.addEventListener('pointerdown', press);
    el.addEventListener('pointerup', release);
    el.addEventListener('pointerleave', release);
    el.addEventListener('pointercancel', release);
    el.addEventListener('contextmenu', (e) => e.preventDefault());
  });

  // ===== 启动 =====
  applyMuteLabel();
  updateHud();
  generateMap();
  draw();
  loop();
})();
</script>
</body>
</html>
